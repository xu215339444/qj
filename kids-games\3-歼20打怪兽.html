<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>歼-20 打怪兽大闯关</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(180deg, #7fc4f5 0%, #b9dcff 45%, #ffd9e8 100%);
    overflow: hidden; user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #app {
    position: relative; width: 100%; max-width: 520px; height: 100%; max-height: 900px;
    display: flex; flex-direction: column; padding: 8px 10px 12px; gap: 6px;
  }

  /* 顶部信息栏 */
  .hud {
    flex: none; display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.6); border-radius: 18px; padding: 7px 12px;
    box-shadow: 0 4px 12px rgba(60,80,140,.15);
  }
  .hud .lv { font-size: 15px; font-weight: 900; color: #5b4b8a; }
  .hud .lv b { color: #e08a12; }
  .hearts { display: flex; gap: 3px; }
  .hearts svg { width: 20px; height: 20px; }
  .hud .score {
    margin-left: auto; font-size: 16px; font-weight: 900; color: #5b4b8a;
    background: #fff; border-radius: 12px; padding: 3px 10px;
  }
  .hud .score b { color: #57b848; font-size: 18px; }
  .btn-mini {
    border: none; cursor: pointer; background: #fff; color: #5b4b8a;
    font-size: 14px; font-weight: 800; border-radius: 12px; padding: 5px 10px;
    box-shadow: 0 3px 0 rgba(120,90,180,.25);
  }
  .btn-mini:active { transform: translateY(2px); box-shadow: none; }

  /* 第二行：武器 + 火力 + 炸弹 */
  .hud2 { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 3px; }
  .wbox {
    font-size: 13px; font-weight: 900; color: #fff; border-radius: 12px; padding: 4px 11px;
    display: flex; align-items: center; gap: 5px; box-shadow: 0 3px 0 rgba(0,0,0,.15);
    background: linear-gradient(#ffd34d, #ff9a3d);
  }
  .wbox .dot { display: block; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .pw {
    font-size: 13px; font-weight: 900; color: #5b4b8a; background: rgba(255,255,255,.6);
    border-radius: 12px; padding: 4px 11px; display: flex; align-items: center; gap: 5px;
  }
  .pw i {
    display: block; width: 12px; height: 12px; border-radius: 50%;
    background: rgba(120,110,160,.22);
  }
  .pw i.on {
    background: linear-gradient(#ffd34d, #ff9a3d);
    box-shadow: 0 0 0 2px rgba(255,255,255,.85);
  }
  .pw.max { animation: pwpulse .6s ease-in-out infinite; }
  @keyframes pwpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .btn-bomb {
    margin-left: auto; border: none; cursor: pointer; color: #fff;
    font-size: 13px; font-weight: 900; border-radius: 12px; padding: 6px 12px;
    background: linear-gradient(#ff9a3d, #f2622e); box-shadow: 0 3px 0 #c94a1e;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-bomb b { font-size: 16px; }
  .btn-bomb svg { width: 17px; height: 17px; }
  .btn-bomb:active { transform: translateY(2px); box-shadow: none; }
  .btn-bomb.empty {
    background: linear-gradient(#cfcada, #a9a3bd); box-shadow: 0 3px 0 #8f8aa5;
  }

  /* 进度条 */
  .prog { flex: none; height: 8px; background: rgba(255,255,255,.55); border-radius: 6px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#ffd34d,#ff9a3d); transition: width .3s; }

  /* 画布 */
  .wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas {
    display: block; border-radius: 16px; touch-action: none;
    box-shadow: 0 10px 26px rgba(60,80,140,.28);
    background: linear-gradient(180deg, #8fd0ff 0%, #c9e8ff 40%, #ffe9f2 100%);
  }

  /* 底部提示 */
  .tipbar {
    flex: none; text-align: center; font-size: 13px; font-weight: 700; color: #4a5b8a;
    background: rgba(255,255,255,.5); border-radius: 12px; padding: 5px 8px;
  }

  /* 覆盖层 */
  .overlay {
    position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: rgba(50,70,130,.42); padding: 16px; animation: fade .25s;
  }
  @keyframes fade { from { opacity: 0 } }
  .card {
    background: #fffdf6; border: 7px solid #ffd34d; border-radius: 24px;
    padding: 20px 22px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 16px 40px rgba(50,70,130,.4); animation: pop .35s;
    max-height: 100%; overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(.75); opacity: 0 } }
  .card h2 { margin: 0 0 4px; font-size: 25px; color: #e08a12; }
  .card h3 { margin: 0 0 8px; font-size: 19px; color: #5b4b8a; }
  .card p { margin: 6px 0; font-size: 15px; font-weight: 700; color: #5b4b8a; line-height: 1.7; }
  .card .small { font-size: 13px; color: #8a7ab0; line-height: 1.8; text-align: left; }
  .card .rows { display: flex; justify-content: center; gap: 20px; margin: 10px 0; }
  .card .rows div { font-size: 14px; color: #6b5b95; font-weight: 700; }
  .card .rows b { display: block; font-size: 26px; color: #7ad46b; }

  /* 选子弹 */
  .wp-title { font-size: 14px; font-weight: 900; color: #5b4b8a; margin: 12px 0 6px; }
  .wp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 7px; }
  .wp {
    border: 3px solid rgba(120,110,160,.2); background: #fff; border-radius: 14px;
    padding: 7px 4px 6px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    font-size: 13px; font-weight: 900; color: #6b5b95; line-height: 1.35;
  }
  .wp em { display: block; font-style: normal; font-size: 10px; font-weight: 700; color: #a09ab8; margin-top: 2px; }
  .wp .ic { display: block; width: 26px; height: 26px; margin: 0 auto 3px; }
  .wp.sel { border-color: #ffb02e; background: #fff8e2; color: #e08a12; box-shadow: 0 3px 0 #ffd34d; }
  .wp.sel em { color: #c79a4a; }
  .btn {
    border: none; cursor: pointer; border-radius: 26px; margin-top: 12px;
    background: linear-gradient(#ffd34d, #ffb02e); color: #fff;
    font-size: 21px; font-weight: 900; padding: 13px 34px;
    box-shadow: 0 6px 0 #e08a12, 0 10px 20px rgba(80,60,140,.25);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e08a12; }
  .btn.blue { background: linear-gradient(#8fd6ff, #5fb0ff); box-shadow: 0 6px 0 #3d8fd6; }
  .btn:disabled { opacity: .5; }
  .mini-jet { margin: 4px auto 8px; display: block; }

  /* 回大厅的小入口（单独打开游戏文件时也能一键回去） */
  .homelink {
    position: fixed; right: 8px; bottom: 6px; z-index: 60;
    font-size: 11px; font-weight: 800; color: #6f5fa0; text-decoration: none;
    background: rgba(255,255,255,.6); border-radius: 9px; padding: 3px 8px;
    opacity: .6; -webkit-tap-highlight-color: transparent;
  }
  .homelink:active { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="lv">第 <b id="hLv">1</b> 关</div>
    <div class="hearts" id="hHearts"></div>
    <div class="score">打掉 <b id="hScore">0</b></div>
  </div>
  <div class="hud2">
    <div class="wbox" id="hWpBox"><i class="dot"></i><span id="hWp">三连发</span></div>
    <div class="pw" id="hPwBox">火力 <span id="hPw"></span></div>
    <button class="btn-bomb" id="btnBomb">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="15.5" r="7" fill="#3b3b52"/><path d="M15 8.5L20 3.5" stroke="#ffd34d" stroke-width="2.6" stroke-linecap="round"/><circle cx="20.5" cy="3" r="2.6" fill="#ffd34d"/></svg>
      炸弹 <b id="hBomb">100</b>
    </button>
    <button class="btn-mini" id="btnPause">暂停</button>
  </div>
  <div class="prog"><i id="hProg"></i></div>
  <div class="wrap"><canvas id="cv"></canvas></div>
  <div class="tipbar" id="tipbar">按住屏幕拖飞机 · 吃到星星会换子弹 · 危险就点炸弹</div>
  <div id="overlayBox"></div>
</div>

<script>
/* ================== 基础设置 ================== */
const W = 480, H = 720;                 // 逻辑画布尺寸
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const hit = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y, r = a.r + b.r; return dx * dx + dy * dy < r * r; };

/* ================== 音效（Web Audio：噪声/失真/回声/循环BGM） ================== */
let actx = null, soundOn = true, master = null, nbuf = null;
function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
    const len = Math.floor(actx.sampleRate * 1.2);
    nbuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
}
function osc(f0, f1, dur, type, vol, when, echo) {   // 扫频振荡器（可选回声）
  if (!soundOn) return; try { ensureAudio();
    const t0 = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(Math.max(20, f0), t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 || f0 * 0.4), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    if (echo) {
      const dl = actx.createDelay(0.5); dl.delayTime.value = 0.16;
      const fb = actx.createGain(); fb.gain.value = 0.3; dl.connect(fb); fb.connect(dl);
      g.connect(dl); dl.connect(master);
    }
    o.start(t0); o.stop(t0 + dur + 0.06);
  } catch (e) { /* 忽略 */ }
}
function noise(dur, vol, f0, f1, q, type, when) {     // 成形噪声（爆炸/火焰/激光）
  if (!soundOn) return; try { ensureAudio();
    const t0 = actx.currentTime + (when || 0);
    const s = actx.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const fl = actx.createBiquadFilter(); fl.type = type || 'lowpass';
    fl.frequency.setValueAtTime(f0 || 1000, t0);
    if (f1) fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    fl.Q.value = q || 0.8;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl); fl.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur + 0.06);
  } catch (e) { /* 忽略 */ }
}
function dist(f0, f1, dur, vol) {                     // 失真锯齿（受伤）
  if (!soundOn) return; try { ensureAudio();
    const t0 = actx.currentTime;
    const o = actx.createOscillator(), sh = actx.createWaveShaper();
    const c = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; c[i] = Math.tanh(x * 3.2); }
    sh.curve = c;
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(28, f1), t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.09, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(sh); sh.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) { /* 忽略 */ }
}
const SFX = {
  shoot:  () => { osc(1500, 360, 0.09, 'square', 0.042); noise(0.05, 0.045, 5600, 1400, 1.4, 'highpass'); },          // 激光
  boom:   () => { noise(0.5, 0.22, 950, 70, 0.7); osc(165, 36, 0.55, 'sine', 0.3); osc(88, 30, 0.6, 'triangle', 0.2); }, // 轰鸣爆炸
  hurt:   () => { dist(430, 50, 0.4, 0.11); noise(0.22, 0.09, 1000, 140, 1); },                                        // 受伤失真
  item:   () => { osc(1318, 1318, 0.14, 'sine', 0.085); osc(1975, 1975, 0.24, 'sine', 0.06, 0.06, true); },           // 叮咚
  clear:  () => { [659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => osc(f, f * 1.02, 0.2, 'triangle', 0.09), i * 105)); },
  win:    () => { [523, 659, 784, 1046, 784, 1046, 1318, 1568].forEach((f, i) => setTimeout(() => { osc(f, f, 0.2, 'square', 0.05); osc(f * 2, f * 2, 0.12, 'sine', 0.028); }, i * 110)); },
  lose:   () => { [392, 311, 233, 155].forEach((f, i) => setTimeout(() => osc(f, f * 0.96, 0.36, 'sawtooth', 0.07), i * 180)); },
  power:  () => { [523, 784, 1318].forEach((f, i) => setTimeout(() => osc(f, f, 0.14, 'square', 0.05), i * 65)); },
  bomb:   () => { osc(120, 28, 0.8, 'sine', 0.3); noise(0.9, 0.2, 750, 55, 0.6); osc(48, 22, 0.85, 'triangle', 0.18, 0.08); },
  flame:  () => noise(0.08, 0.07, 1700, 480, 1),
  zap:    () => { osc(2000, 240, 0.17, 'square', 0.055); osc(2700, 420, 0.12, 'sawtooth', 0.03, 0.03); },
  lock:   () => { osc(950, 950, 0.07, 'sine', 0.05); setTimeout(() => osc(1420, 1420, 0.07, 'sine', 0.05), 60); },
  swing:  () => osc(700, 240, 0.14, 'triangle', 0.05),
  swap:   () => [659, 880, 1318].forEach((f, i) => setTimeout(() => osc(f, f, 0.1, 'triangle', 0.06), i * 55)),
  beam:   () => { osc(2400, 90, 0.5, 'sawtooth', 0.085); noise(0.4, 0.06, 4200, 300, 2, 'highpass'); },            // BOSS 激光
  summon: () => { osc(220, 440, 0.18, 'square', 0.05); setTimeout(() => osc(440, 880, 0.14, 'square', 0.04), 130); } // BOSS 召唤
};
/* BOSS 战紧张 BGM：小调 8 步循环音序器 */
const BGM = { on: false, step: 0, timer: null,
  bass: [110, 110, 0, 110, 131, 0, 98, 0],
  lead: [0, 220, 0, 262, 0, 220, 0, 196]
};
function bgmStart() {
  if (BGM.on || !soundOn) return;
  try { ensureAudio(); BGM.on = true; BGM.step = 0;
    BGM.timer = setInterval(bgmTick, 130); } catch (e) {}
}
function bgmStop() { if (!BGM.on) return; BGM.on = false; if (BGM.timer) { clearInterval(BGM.timer); BGM.timer = null; } }
function bgmTick() {
  try {
    if (!BGM.on || !actx || actx.state === 'suspended') return;
    const s = BGM.step % 8;
    const b = BGM.bass[s], l = BGM.lead[s];
    if (b) { osc(b, b, 0.16, 'triangle', 0.07); noise(0.04, 0.025, 200, 130, 1, 'lowpass'); }
    if (l) osc(l, l, 0.12, 'square', 0.024);
    BGM.step++;
  } catch (e) { /* 忽略 */ }
}

/* ================== 关卡配置（难度提高版） ================== */
const LEVELS = [
  { name:'云上小怪',   waves:[18, 20, 22, 24], types:['blob'],                boss:'toucan',     bossHp:75,  fire:0.2,  spd:1.20 },
  { name:'蝙蝠山谷',   waves:[20, 22, 24, 26], types:['blob','bat'],          boss:'hydra3',     bossHp:110, fire:0.4,  spd:1.34 },
  { name:'巨兽巢穴',   waves:[22, 24, 26, 28], types:['blob','bat','rock'],   boss:'mechdragon', bossHp:150, fire:0.65, spd:1.50 }
];
const ENEMY = {
  blob:     { r:19, hp:2, score:10, spd:99  },
  bat:      { r:23, hp:3, score:20, spd:129 },
  rock:     { r:27, hp:5, score:30, spd:80  },
  toucan:    { r:46, score:300, spd:0 },
  hydra3:    { r:56, score:450, spd:0 },
  mechdragon:{ r:60, score:700, spd:0 }
};

/* ================== 五种子弹（武器） ==================
   火力等级 1~3 级会让每种武器打得更多/更大，但形态不变          */
const WEAPONS = [
  { id:'flame',  name:'喷火龙', color:'#ff7a2f', cool:0.065,
    desc:'近距离喷火，飞近了烧得最快' },
  { id:'triple', name:'三连发', color:'#ffd34d', cool:0.155,
    desc:'三颗子弹一起打出去，覆盖面大' },
  { id:'bolt',   name:'雷电',   color:'#8fd6ff', cool:0.45,
    desc:'一道闪电劈到底，一整列的怪兽都挨打' },
  { id:'homing', name:'追踪弹', color:'#7ad46b', cool:0.24,
    desc:'小导弹会自己拐弯追着怪兽跑' },
  { id:'boomer', name:'回旋镖', color:'#c79cff', cool:0.42,
    desc:'飞出去还会拐回来，来回打两次' }
];
let weapon = 1;                      // 当前武器下标（开局默认三连发）
const weaponCfg = () => WEAPONS[clamp(weapon, 0, WEAPONS.length - 1)];
function weaponSvg(id) {             // 选子弹卡片上的小图标（纯 SVG，不用 emoji）
  if (id === 'flame')
    return '<path d="M13 2c3.2 4.8 6.2 6.2 6.2 11a6.2 6.2 0 0 1-12.4 0c0-3.1 2.1-4.2 2.1-7.2 0 2.1 1 3.1 2 2 1-.9.9-3 2.1-5.8z" fill="#ff7a2f"/>' +
           '<path d="M13 13.5c1.7 2.1 2.7 2.9 2.7 4.6a2.7 2.7 0 0 1-5.4 0c0-1.7 1-2.5 2.7-4.6z" fill="#ffd34d"/>';
  if (id === 'triple')
    return '<g fill="#ff9a3d"><rect x="11" y="2" width="4" height="12.5" rx="2"/>' +
           '<rect x="3" y="7.5" width="4" height="11.5" rx="2" transform="rotate(-20 5 13)"/>' +
           '<rect x="19" y="7.5" width="4" height="11.5" rx="2" transform="rotate(20 21 13)"/></g>' +
           '<circle cx="13" cy="6" r="1.6" fill="#fff8c0"/>';
  if (id === 'bolt')
    return '<path d="M15.8 2L6.8 14.6h5.1L10.4 24 20 10.8h-5.4z" fill="#8fd6ff" stroke="#3d8fd6" stroke-width="1.3" stroke-linejoin="round"/>';
  if (id === 'homing')
    return '<path d="M13 2c2.7 2.6 4.1 5.9 4.1 9.4v3.9L13 18.6l-4.1-3.3v-3.9C8.9 7.9 10.3 4.6 13 2z" fill="#7ad46b"/>' +
           '<circle cx="13" cy="10" r="2.2" fill="#fff"/>' +
           '<path d="M9.6 14.2L7 21l2.9-1.7M16.4 14.2L19 21l-2.9-1.7" stroke="#ff9a3d" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
  return  '<path d="M13 1.6l3.3 8.4 8.4 3.3-8.4 3.3L13 25l-3.3-8.4L1.3 13.3l8.4-3.3z" fill="#c79cff"/>' +
          '<circle cx="13" cy="13" r="2.6" fill="#fff"/>';
}

/* ================== 游戏状态 ================== */
let state = 'menu';                 // menu | playing | pause | clear | dead | win
let level = 0, waveIdx = 0, waveLeft = 0, waveTotal = 0, wavePause = 0;
let score = 0, kills = 0, lives = 3, startTime = 0, elapsed = 0;
let shake = 0, tick = 0, flash = 0;
const player = { x: W / 2, y: H - 130, r: 17, cool: 0, power: 1, pwExp: 0, inv: 0, alive: true };
let bombs = 30;                       // 每条命 30 颗炸弹
const BOMBS_PER_LIFE = 30, BOMB_DMG = 4;
const PW_NEED = [0, 20, 60];         // 升到 2 级累计 20 杀，升到 3 级累计 60 杀
let bullets = [], enemies = [], ebullets = [], drops = [], parts = [], clouds = [];
let bolts = [];                      // 雷电的视觉闪电（伤害在开火瞬间结算）
let tipMsg = '', tipT = 0;           // “换武器啦！”这类飘字提示
let boss = null, bossDone = false;   // bossDone：BOSS 已被打掉，别再刷第二只
let keys = {};

/* ================== 画布尺寸 ================== */
function resize() {
  const wrap = document.querySelector('.wrap');
  const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

/* ================== 绘制：歼-20（俯视，机头朝上） ================== */
function drawJet(g, x, y, t, alpha) {
  g.save();
  g.translate(x, y);
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  // 尾焰
  const fl = 13 + Math.sin(t * 0.35) * 5;
  const grd = g.createLinearGradient(0, 18, 0, 18 + fl);
  grd.addColorStop(0, 'rgba(255,240,150,.95)');
  grd.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = grd;
  g.beginPath(); g.moveTo(-10, 18); g.lineTo(-5, 18 + fl); g.lineTo(-1, 18); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(10, 18); g.lineTo(5, 18 + fl); g.lineTo(1, 18); g.closePath(); g.fill();
  // 主翼：后掠三角翼
  g.fillStyle = '#3e4960';
  g.beginPath();
  g.moveTo(2, -8); g.lineTo(48, 24); g.lineTo(42, 34); g.lineTo(2, 18);
  g.lineTo(-42, 34); g.lineTo(-48, 24);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1; g.stroke();
  // 鸭翼（歼-20 的标志性前翼）
  g.fillStyle = '#465268';
  g.beginPath(); g.moveTo(-9, -12); g.lineTo(-27, 4); g.lineTo(-23, 11); g.lineTo(-8, 0); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(9, -12); g.lineTo(27, 4); g.lineTo(23, 11); g.lineTo(8, 0); g.closePath(); g.fill(); g.stroke();
  // 外倾双垂尾
  g.fillStyle = '#2e374a';
  g.beginPath(); g.moveTo(-13, 6); g.lineTo(-27, 28); g.lineTo(-19, 31); g.lineTo(-10, 14); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(13, 6); g.lineTo(27, 28); g.lineTo(19, 31); g.lineTo(10, 14); g.closePath(); g.fill();
  // 菱形隐身机身
  const bg = g.createLinearGradient(0, -50, 0, 26);
  bg.addColorStop(0, '#7a8798'); bg.addColorStop(0.45, '#4d5769'); bg.addColorStop(1, '#313a4a');
  g.fillStyle = bg;
  g.beginPath();
  g.moveTo(0, -50); g.lineTo(6.5, -31); g.lineTo(11, -6); g.lineTo(13, 14);
  g.lineTo(9, 26); g.lineTo(-9, 26); g.lineTo(-13, 14); g.lineTo(-11, -6); g.lineTo(-6.5, -31);
  g.closePath(); g.fill();
  // 隐身棱线
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, -50); g.lineTo(0, 26); g.stroke();
  g.beginPath(); g.moveTo(-6.5, -31); g.lineTo(6.5, -31); g.stroke();
  // DSI 进气道鼓包
  g.fillStyle = 'rgba(16,22,32,.5)';
  g.beginPath(); g.ellipse(-8.5, 0, 3.6, 7.5, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(8.5, 0, 3.6, 7.5, 0, 0, 7); g.fill();
  // 座舱盖
  g.fillStyle = '#a9e0ff';
  g.beginPath(); g.moveTo(0, -27); g.lineTo(4, -18); g.lineTo(0, -11); g.lineTo(-4, -18); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.stroke();
  // 机身编号
  g.fillStyle = 'rgba(255,255,255,.8)';
  g.font = 'bold 9px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('20', -25, 20);
  g.restore();
}

/* ================== 绘制：各种怪兽 ================== */
function wobbly(g, r, n, amp, t, wob) {
  g.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2;
    const rr = r + Math.sin(a * wob + t) * amp;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
/* ---------- 五官零件 ---------- */
// 眼睛：open 睁开 / blink 眨眼 / hurt >< / dead X X / happy ^ ^
function eye(g, x, y, r, mode, look) {
  g.save();
  g.lineCap = 'round';
  if (mode === 'blink' || mode === 'happy') {
    g.strokeStyle = '#20303f'; g.lineWidth = Math.max(2, r * 0.42);
    g.beginPath();
    if (mode === 'happy') g.arc(x, y + r * 0.5, r, Math.PI * 1.18, Math.PI * 1.82);
    else { g.moveTo(x - r, y); g.lineTo(x + r, y); }
    g.stroke();
  } else if (mode === 'hurt' || mode === 'dead') {
    g.strokeStyle = '#20303f'; g.lineWidth = Math.max(2.2, r * 0.42);
    g.beginPath();
    g.moveTo(x - r * 0.8, y - r * 0.7); g.lineTo(x + r * 0.8, y + r * 0.7);
    g.moveTo(x + r * 0.8, y - r * 0.7); g.lineTo(x - r * 0.8, y + r * 0.7);
    g.stroke();
  } else {
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(40,55,80,.35)'; g.lineWidth = 1; g.stroke();
    const ox = (look || 0) * r * 0.34;
    g.fillStyle = '#20303f';
    g.beginPath(); g.arc(x + ox, y + r * 0.1, r * 0.5, 0, 7); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(x + ox - r * 0.2, y - r * 0.22, r * 0.2, 0, 7); g.fill();
  }
  g.restore();
}
// 眉毛：tilt > 0 表示内侧压低（生气）
function brow(g, x, y, w, tilt) {
  const s = x < 0 ? 1 : -1;
  g.save();
  g.strokeStyle = '#20303f'; g.lineWidth = Math.max(2.2, w * 0.4); g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - s * w, y - tilt); g.lineTo(x + s * w, y + tilt); g.stroke();
  g.restore();
}
// 嘴：smile 微笑 / oh 张嘴 / wave 波浪(害怕) / teeth 尖牙 / flat 一条线
function mouth(g, x, y, w, mode) {
  g.save();
  g.lineCap = 'round';
  if (mode === 'smile') {
    g.strokeStyle = '#20303f'; g.lineWidth = 2.2;
    g.beginPath(); g.arc(x, y - w * 0.25, w, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  } else if (mode === 'oh') {
    g.fillStyle = '#4a2436';
    g.beginPath(); g.ellipse(x, y, w * 0.5, w * 0.62, 0, 0, 7); g.fill();
    g.fillStyle = '#ff8fae';
    g.beginPath(); g.ellipse(x, y + w * 0.3, w * 0.26, w * 0.18, 0, 0, 7); g.fill();
  } else if (mode === 'wave') {
    g.strokeStyle = '#20303f'; g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(x - w, y);
    g.quadraticCurveTo(x - w * 0.5, y + w * 0.45, x, y);
    g.quadraticCurveTo(x + w * 0.5, y - w * 0.45, x + w, y);
    g.stroke();
  } else if (mode === 'teeth') {
    g.strokeStyle = '#20303f'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x - w, y - 2); g.lineTo(x + w, y - 2); g.stroke();
    g.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) {
      const tx = x - w * 0.6 + i * w * 0.6;
      g.beginPath(); g.moveTo(tx - 3, y - 2); g.lineTo(tx, y + 5); g.lineTo(tx + 3, y - 2); g.closePath(); g.fill();
    }
  } else {
    g.strokeStyle = '#20303f'; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(x - w, y); g.lineTo(x + w, y); g.stroke();
  }
  g.restore();
}
// 腮红
function blush(g, x, y, r) {
  g.save(); g.globalAlpha *= 0.5; g.fillStyle = '#ff8fae';
  g.beginPath(); g.ellipse(x, y, r, r * 0.62, 0, 0, 7); g.fill(); g.restore();
}
// 小怪兽头顶血条（BOSS 用屏幕顶部的大血条）
function drawHpBar(g, e) {
  if (e.maxhp <= 1 || e.r >= 40) return;
  const w = Math.max(28, e.r * 1.7), h = 5;
  const x = -w / 2, y = -e.r - 14, r = Math.max(0, e.hp / e.maxhp);
  g.save();
  g.fillStyle = 'rgba(0,0,0,.32)';
  g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = r > 0.6 ? '#6ede6e' : (r > 0.3 ? '#ffd34d' : '#ff5f7a');
  g.fillRect(x, y, w * r, h);
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
  g.strokeRect(x, y, w, h);
  g.restore();
}

function drawEnemy(g, e, t) {
  g.save();
  g.translate(e.x, e.y);
  g.globalAlpha = (e.flash > 0) ? 0.55 : 1;
  const ouch = e.flash > 0.12;                       // 刚被打中
  const weak = e.hp / e.maxhp <= 0.5;                // 快挂了
  const look = clamp((player.x - e.x) / 90, -1, 1);  // 眼珠追着飞机看
  const blink = Math.sin(t * 1.6 + (e.base || 0)) > 0.965;
  const eyeMode = ouch ? 'hurt' : (weak && e.maxhp >= 2 ? 'dead' : (blink ? 'blink' : 'open'));

  if (e.type === 'blob') {
    g.fillStyle = '#7ad46b';
    wobbly(g, e.r, 20, 2.2, t * 4, 5); g.fill();
    g.strokeStyle = '#4e9c3f'; g.lineWidth = 2; g.stroke();
    // 触角
    g.strokeStyle = '#57b848'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-7, -e.r + 3); g.lineTo(-10, -e.r - 8); g.stroke();
    g.beginPath(); g.moveTo(7, -e.r + 3); g.lineTo(10, -e.r - 8); g.stroke();
    g.fillStyle = '#ffd34d';
    g.beginPath(); g.arc(-10, -e.r - 9, 3, 0, 7); g.fill();
    g.beginPath(); g.arc(10, -e.r - 9, 3, 0, 7); g.fill();
    // 五官
    blush(g, -12, 4, 4.5); blush(g, 12, 4, 4.5);
    eye(g, -6.5, -2, 6.5, eyeMode, look);
    eye(g, 6.5, -2, 6.5, eyeMode, look);
    mouth(g, 0, 8, 5.5, ouch ? 'oh' : 'smile');

  } else if (e.type === 'bat') {
    const flap = Math.sin(t * 8) * 10;
    g.fillStyle = '#a678d8';
    g.beginPath(); g.moveTo(-6, -2); g.lineTo(-38, -10 - flap); g.lineTo(-30, 6); g.lineTo(-8, 8); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(6, -2); g.lineTo(38, -10 - flap); g.lineTo(30, 6); g.lineTo(8, 8); g.closePath(); g.fill();
    g.fillStyle = '#c79bf0';
    wobbly(g, e.r * 0.72, 18, 1.6, t * 3, 4); g.fill();
    // 耳朵
    g.fillStyle = '#c79bf0';
    g.beginPath(); g.moveTo(-10, -14); g.lineTo(-15, -26); g.lineTo(-3, -17); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(10, -14); g.lineTo(15, -26); g.lineTo(3, -17); g.closePath(); g.fill();
    // 五官：血少时害怕八字眉
    if (weak) { brow(g, -7, -11, 6, -3.2); brow(g, 7, -11, 6, -3.2); }
    eye(g, -6, -3, 5.5, eyeMode, look);
    eye(g, 6, -3, 5.5, eyeMode, look);
    mouth(g, 0, 8, 5.5, ouch ? 'oh' : (weak ? 'wave' : 'teeth'));

  } else if (e.type === 'rock') {
    const s = e.r;
    g.fillStyle = '#ffa63d';
    g.beginPath();
    g.moveTo(-s, -s * 0.5); g.lineTo(-s * 0.5, -s); g.lineTo(s * 0.5, -s); g.lineTo(s, -s * 0.5);
    g.lineTo(s, s * 0.6); g.lineTo(s * 0.4, s); g.lineTo(-s * 0.4, s); g.lineTo(-s, s * 0.6);
    g.closePath(); g.fill();
    g.strokeStyle = '#e08a1a'; g.lineWidth = 2.5; g.stroke();
    // 尖角
    g.fillStyle = '#ffd34d';
    g.beginPath(); g.moveTo(-s * 0.6, -s * 0.85); g.lineTo(-s * 0.5, -s * 1.5); g.lineTo(-s * 0.15, -s * 0.95); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(s * 0.6, -s * 0.85); g.lineTo(s * 0.5, -s * 1.5); g.lineTo(s * 0.15, s * 0.95); g.closePath(); g.fill();
    // 五官：天生凶，血少变晕
    brow(g, -8, -7, 7, 3.5); brow(g, 8, -7, 7, 3.5);
    eye(g, -8, 0, 7, eyeMode, look);
    eye(g, 8, 0, 7, eyeMode, look);
    mouth(g, 0, 12, 7, ouch ? 'oh' : (weak ? 'wave' : 'teeth'));

  } else if (e.type === 'toucan') {                 // 巨嘴鸟王：大橙鸟 + 巨型彩嘴
    const R = e.r, flap = Math.sin(t * 7), om = ouch ? 1.3 : 1;
    const wingY = R * 0.1;
    g.save(); g.rotate(flap * 0.16);
    g.fillStyle = '#ffb02e';
    g.beginPath(); g.ellipse(-R * 0.92, wingY, R * 0.52, R * 0.34, -0.5, 0, 7); g.fill();
    g.beginPath(); g.ellipse(R * 0.92, wingY, R * 0.52, R * 0.34, 0.5, 0, 7); g.fill();
    g.fillStyle = '#fff3c4';
    g.beginPath(); g.ellipse(-R * 0.94, wingY - 2, R * 0.3, R * 0.2, -0.5, 0, 7); g.fill();
    g.beginPath(); g.ellipse(R * 0.94, wingY - 2, R * 0.3, R * 0.2, 0.5, 0, 7); g.fill();
    g.restore();
    // 身体
    g.fillStyle = '#ff8f3c'; wobbly(g, R * 0.8, 26, 2.2, t * 2.6, 6); g.fill();
    g.strokeStyle = '#e06a1a'; g.lineWidth = 3; g.stroke();
    g.fillStyle = '#fff0d9';
    g.beginPath(); g.ellipse(0, R * 0.42, R * 0.5, R * 0.38, 0, 0, 7); g.fill();
    // 头顶羽冠
    g.strokeStyle = '#ff8a3c'; g.lineWidth = 4; g.lineCap = 'round';
    for (let k = -1; k <= 1; k++) {
      g.beginPath(); g.moveTo(k * R * 0.14, -R * 0.72);
      g.quadraticCurveTo(k * R * 0.2 + flap * 3, -R * 1.05, k * R * 0.26 + flap * 6, -R * 0.9); g.stroke();
    }
    // 眼睛 + 腮红
    eye(g, -R * 0.3, -R * 0.22, R * 0.13, eyeMode, look);
    eye(g, R * 0.3, -R * 0.22, R * 0.13, eyeMode, look);
    blush(g, -R * 0.46, R * 0.05, R * 0.1); blush(g, R * 0.46, R * 0.05, R * 0.1);
    // 巨型彩嘴（开合）
    g.fillStyle = '#ffa62b';
    g.beginPath(); g.moveTo(-R * 0.62, -R * 0.08);
    g.lineTo(R * 0.62, -R * 0.08);
    g.lineTo(R * 0.08, R * 0.5 * om);
    g.lineTo(-R * 0.08, R * 0.5 * om);
    g.closePath(); g.fill();
    g.strokeStyle = '#d97a14'; g.lineWidth = 2.5; g.stroke();
    g.fillStyle = '#ff8a00';
    g.beginPath(); g.moveTo(-R * 0.26, R * 0.44 * om);
    g.lineTo(R * 0.26, R * 0.44 * om);
    g.lineTo(R * 0.06, R * 0.7 * om);
    g.lineTo(-R * 0.06, R * 0.7 * om);
    g.closePath(); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-R * 0.03, R * 0.08, R * 0.035, 0, 7); g.fill();
    g.beginPath(); g.arc(R * 0.03, R * 0.08, R * 0.035, 0, 7); g.fill();
    // 尾羽
    g.strokeStyle = '#ffb02e'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-R * 0.3, R * 0.78);
    g.quadraticCurveTo(-R * 0.5, R * 1.25, -R * 0.85, R * 1.1 + flap * 4); g.stroke();

  } else if (e.type === 'hydra3') {                 // 三头蛇：三颗头轮流喷火
    const R = e.r;
    g.fillStyle = '#58b36e';
    g.beginPath(); g.ellipse(0, R * 0.1, R * 0.95, R * 0.5, 0, 0, 7); g.fill();
    g.strokeStyle = '#3e944f'; g.lineWidth = 3; g.stroke();
    g.fillStyle = '#9be08b';
    g.beginPath(); g.ellipse(0, R * 0.3, R * 0.42, R * 0.2, 0, 0, 7); g.fill();
    // 尾巴（右侧摆动）
    const wav = Math.sin(t * 3.4);
    g.strokeStyle = '#58b36e'; g.lineWidth = R * 0.24; g.lineCap = 'round';
    g.beginPath(); g.moveTo(R * 0.72, R * 0.18);
    g.quadraticCurveTo(R * 1.12, R * 0.1 + wav * 8, R * 1.32, R * 0.5 + wav * 13); g.stroke();
    // 三个头
    for (let k = -1; k <= 1; k++) {
      const hx = k * R * 0.62;
      const fireNow = (e.headN % 3) === k + 1 && e.fireT < 0.45;
      g.save(); g.translate(hx, -R * 0.05);
      // 脖子
      g.strokeStyle = '#58b36e'; g.lineWidth = R * 0.26; g.lineCap = 'round';
      g.beginPath(); g.moveTo(0, R * 0.12);
      g.quadraticCurveTo(k * R * 0.22 + Math.sin(t * 3 + k) * 3, -R * 0.5, 0, -R * 0.88 + Math.sin(t * 3.2 + k) * 4); g.stroke();
      // 头
      const hc = fireNow ? '#ff8a4a' : (ouch ? '#8ce07c' : '#6bc37b');
      g.fillStyle = hc; wobbly(g, R * 0.27, 14, 2, t * 3 + k * 2, 4); g.fill();
      g.strokeStyle = '#3e944f'; g.lineWidth = 2.4; g.stroke();
      // 眼睛（挨打变X）
      if (ouch) {
        g.strokeStyle = '#20303f'; g.lineWidth = 2.6; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-5, -7); g.lineTo(-1, -3); g.moveTo(-1, -7); g.lineTo(-5, -3); g.stroke();
        g.beginPath(); g.moveTo(5, -7); g.lineTo(1, -3); g.moveTo(1, -7); g.lineTo(5, -3); g.stroke();
      } else { eye(g, -6, -6, 4, eyeMode, look); eye(g, 6, -6, 4, eyeMode, look); }
      // 嘴 + 火焰舌头
      mouth(g, 0, 3, 7, fireNow ? 'oh' : (blink ? 'wave' : 'smile'));
      if (fireNow) {
        g.fillStyle = 'rgba(255,170,60,.9)';
        g.beginPath(); g.moveTo(-4, 10); g.lineTo(4, 10);
        g.lineTo(0, 26 + rnd(0, 6)); g.closePath(); g.fill();
        g.fillStyle = 'rgba(255,220,120,.85)';
        g.beginPath(); g.arc(0, 14 + rnd(0, 4), 3 + rnd(0, 2), 0, 7); g.fill();
      }
      g.restore();
    }
    // 身上鳞片点
    g.fillStyle = 'rgba(255,255,255,.18)';
    for (let k = -2; k <= 2; k++) { g.beginPath(); g.arc(k * R * 0.2, -R * 0.05, R * 0.05, 0, 7); g.fill(); }

  } else if (e.type === 'mechdragon') {             // 暗黑机械龙：金属机身，半血狂暴
    const R = e.r, rage = e.hp / e.maxhp <= 0.5;
    const gl = rage && Math.floor(t * 10) % 2;      // 狂暴红灯闪烁
    const fl = Math.sin(t * 6);
    // 机械翅膀
    g.fillStyle = '#5c6f8f';
    g.beginPath(); g.moveTo(-R * 0.2, -R * 0.5); g.lineTo(-R * 1.3, -R * 0.9 + fl * 7); g.lineTo(-R * 1.2, -R * 0.2 + fl * 7); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(R * 0.2, -R * 0.5); g.lineTo(R * 1.3, -R * 0.9 - fl * 7); g.lineTo(R * 1.2, -R * 0.2 - fl * 7); g.closePath(); g.fill();
    g.strokeStyle = '#3c4a63'; g.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.moveTo(R * 0.25 + i * R * 0.05, -R * 0.42 - i * R * 0.12); g.lineTo(R * 1.1 - i * R * 0.18, -R * 0.75); g.stroke();
      g.beginPath(); g.moveTo(-R * 0.25 - i * R * 0.05, -R * 0.42 - i * R * 0.12); g.lineTo(-R * 1.1 + i * R * 0.18, -R * 0.75); g.stroke();
    }
    // 机身（六边形机械体）
    g.fillStyle = rage ? (gl ? '#8a5f7a' : '#7189b5') : '#7d8fb5';
    g.beginPath();
    g.moveTo(0, -R * 0.92); g.lineTo(R * 0.62, -R * 0.55); g.lineTo(R * 0.78, R * 0.28);
    g.lineTo(R * 0.35, R * 0.85); g.lineTo(-R * 0.35, R * 0.85); g.lineTo(-R * 0.78, R * 0.28);

    g.beginPath(); g.moveTo(R * 0.3, -R * 0.85); g.lineTo(R * 0.42, -R * 1.25); g.lineTo(R * 0.08, -R * 0.95); g.closePath(); g.fill();
    // 机械眼（狂暴时红色发光）

    g.beginPath(); g.arc(R * 0.28, -R * 0.28, gr, 0, 7); g.fill();
    g.fillStyle = rage ? (gl ? '#fff' : '#ff3b3b') : (ouch ? '#ffb03d' : '#ffd34d');
    g.beginPath(); g.arc(-R * 0.28 + look * 4, -R * 0.28, gr * 0.5, 0, 7); g.fill();
    g.beginPath(); g.arc(R * 0.28 + look * 4, -R * 0.28, gr * 0.5, 0, 7); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(-R * 0.28 + look * 4 - 2, -R * 0.32, gr * 0.16, 0, 7); g.fill();
    g.beginPath(); g.arc(R * 0.28 + look * 4 - 2, -R * 0.32, gr * 0.16, 0, 7); g.fill();
    // 嘴巴（金属缝，狂暴亮牙）
    g.strokeStyle = '#2f3c58'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(-R * 0.3, R * 0.1); g.lineTo(R * 0.3, R * 0.1); g.stroke();
    // 下方推进焰
    g.fillStyle = 'rgba(255,140,60,.85)';
    g.beginPath(); g.moveTo(-R * 0.24, R * 0.85); g.lineTo(R * 0.24, R * 0.85);
    g.lineTo(R * 0.05, R * 1.2 + Math.abs(fl) * 8); g.lineTo(-R * 0.05, R * 1.2 + Math.abs(fl) * 8); g.closePath(); g.fill();
  }
  drawHpBar(g, e);
  g.restore();
}

function drawCloud(g, c) {

function drawBullet(g, b) {
  g.save(); g.translate(b.x, b.y);

    const grd = g.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
    grd.addColorStop(0,    'rgba(255,255,225,' + (0.95 * a).toFixed(3) + ')');
    grd.addColorStop(0.45, 'rgba(255,175,60,'  + (0.80 * a).toFixed(3) + ')');
    grd.addColorStop(1,    'rgba(255,90,30,0)');

    g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  } else if (b.kind === 'homing') {               // 小导弹：机头朝飞行方向 + 尾焰
    g.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
    g.fillStyle = 'rgba(255,180,60,.95)';
    g.beginPath(); g.moveTo(-3.5, 6); g.lineTo(0, 13 + Math.random() * 6); g.lineTo(3.5, 6); g.closePath(); g.fill();

    g.fillStyle = '#c79cff'; g.strokeStyle = '#fff'; g.lineWidth = 2.2;
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a1 = i * Math.PI / 3, a2 = a1 + Math.PI / 3;

      else g.moveTo(Math.cos(a1) * b.r, Math.sin(a1) * b.r);

  g.restore();
}
function drawBolt(g, b) {                         // 雷电：白色主闪 + 蓝色外晕
  const a = clamp(b.life / b.max, 0, 1);
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath();

    const jit = (Math.random() - 0.5) * b.w * 1.5 * (1 - Math.abs(t - 0.5) * 0.5);

  g.globalAlpha = a * 0.4; g.strokeStyle = '#8fd6ff'; g.lineWidth = 13; g.stroke();

function drawDrop(g, d) {

  if (d.type === 'weapon') {                  // 彩星：换一种子弹

      const a = -Math.PI / 2 + i * Math.PI / 6, r = i % 2 ? 6 : 14;
      i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath(); g.fill();
    g.fillStyle = '#ffd34d';
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 3.5 : 9;
      i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath(); g.fill();
  } else if (d.type === 'power') {
    g.fillStyle = '#5fb0ff';
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 5 : 12;
      i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath(); g.fill();
    g.fillStyle = '#fff';                       // 星星中间写个“力”
    g.font = 'bold 11px "PingFang SC", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';

    g.beginPath();
    g.moveTo(0, 8); g.bezierCurveTo(-13, -2, -8, -13, 0, -6);

    g.fill();

  g.restore();
}
function drawPart(g, p) {
  g.save(); g.globalAlpha = Math.max(0, p.life / p.max);
  g.translate(p.x, p.y); g.rotate(p.rot);
  g.fillStyle = p.c;
  if (p.star) {
    g.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, r = i % 2 ? p.r * 0.45 : p.r;
      i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    g.closePath(); g.fill();
  } else { g.beginPath(); g.arc(0, 0, p.r, 0, 7); g.fill(); }
  g.restore();
}

/* ================== 特效生成 ================== */
function boom(x, y, color, n) {
  for (let i = 0; i < (n || 14); i++) {
    const a = Math.random() * Math.PI * 2, sp = rnd(40, 190);
    parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: rnd(3, 7), c: pick([color, '#ffd34d', '#fff', '#ffa63d']),
      life: rnd(0.35, 0.75), max: 0.75, rot: rnd(0, 7), spin: rnd(-8, 8), star: Math.random() < 0.5
    });
  }
  shake = Math.max(shake, 5);
}

/* ================== 关卡流程 ================== */
function startLevel(n) {
  level = n;
  const L = LEVELS[n];
  waveIdx = 0; waveLeft = L.waves[0]; waveTotal = L.waves[0];
  wavePause = 0.7;
  bullets = []; enemies = []; ebullets = []; drops = []; parts = []; bolts = [];
  boss = null; bossDone = false;
  tipT = 0;                             // 关与关之间不残留“换子弹”提示
  player.x = W / 2; player.y = H - 130; player.cool = 0; player.inv = 1.2;
  player.alive = true;                  // 关键：上一关阵亡后重试，必须复活，否则永远不开火
  bombs = BOMBS_PER_LIFE;               // 每关开始重新配满炸弹
  flash = 0;
  clouds = [];
  for (let i = 0; i < 7; i++) clouds.push({ x: rnd(0, W), y: rnd(-H, H), s: rnd(0.5, 1.1), a: rnd(0.25, 0.6) });
  state = 'playing';
  hideOverlay();
  syncHud();
}
function spawnEnemy() {
  const L = LEVELS[level];
  const type = pick(L.types);
  const cfg = ENEMY[type];
  enemies.push({
    type, x: rnd(cfg.r + 12, W - cfg.r - 12), y: -cfg.r - 10,
    r: cfg.r, hp: cfg.hp, maxhp: cfg.hp, spd: cfg.spd * L.spd,
    base: rnd(0, 7), swing: rnd(18, 46), fireT: rnd(1, 2.5), flash: 0, hitT: 0, score: cfg.score
  });
}
function spawnBoss() {
  const L = LEVELS[level], type = L.boss, cfg = ENEMY[type], hp = L.bossHp;
  const NAME = { toucan: '巨嘴鸟王', hydra3: '三头蛇', mechdragon: '暗黑机械龙' };
  boss = {
    type, n: NAME[type] || '大怪兽', x: W / 2, y: -cfg.r - 40, r: cfg.r, hp, maxhp: hp,
    t: 0, fireT: 1.4, flash: 0, hitT: 0, score: cfg.score, entering: true, dir: 1,
    ph: 1, headN: 0, dive: 0, ty: 112, summonT: 0, bossT: 0
  };
}
/* ================== BOSS 行动（每只王都有专属招式） ================== */
function fireDot(x, y, vx, vy)   { ebullets.push({ x, y, vx, vy, r: 6,  kind: 'dot' }); }
function fireBall(x, y, vx, vy)  { ebullets.push({ x, y, vx: vx || 0, vy: vy || 300, r: 10, kind: 'ball' }); }
function fireFeather(x, y, vx)   { ebullets.push({ x, y, vx, vy: 200 + rnd(0, 70), r: 7, kind: 'feather' }); }
function fireSeek(x, y)          { ebullets.push({ x, y, vx: rnd(-30, 30), vy: 200, r: 9, kind: 'seek' }); }
function fireBeam(x)             { ebullets.push({ x, y: boss.y + boss.r, vx: 0, vy: 800, r: 12, kind: 'beam' }); }
function bossEnter(dt, homeY) {
  if (!boss.entering) return true;
  boss.y += 80 * dt;
  if (boss.y >= homeY) { boss.y = homeY; boss.entering = false; }
  return !boss.entering;
}
/* 第1关：巨嘴鸟王 —— 高空巡游 + 俯冲撞击 + 撒羽毛弹幕 */
function toucanAct(dt, hpR) {
  const fast = hpR <= 0.5;
  if (!bossEnter(dt, 110)) return;
  boss.x += boss.dir * (fast ? 95 : 70) * dt;
  if (boss.x < boss.r + 30) { boss.x = boss.r + 30; boss.dir = 1; }
  if (boss.x > W - boss.r - 30) { boss.x = W - boss.r - 30; boss.dir = -1; }
  boss.ty = 110 + Math.sin(boss.t * 2.0) * (fast ? 16 : 9);
  if (boss.dive === 2) {                        // 正在俯冲：追玩家撞下去，一路撒羽毛
    boss.y += (fast ? 440 : 360) * dt;
    boss.x += (player.x - boss.x) * Math.min(1, dt * 2.4);
    if (Math.random() < dt * (fast ? 24 : 14)) fireFeather(boss.x + rnd(-12, 12), boss.y + boss.r * 0.5, rnd(-110, 110));
    if (boss.y > 500) boss.dive = 1;
  } else if (boss.dive === 1) {                 // 拉高爬升
    boss.y -= 300 * dt;
    if (boss.y <= boss.ty) { boss.y = boss.ty; boss.dive = 0; }
  } else {
    boss.y += (boss.ty - boss.y) * Math.min(1, dt * 3);
    boss.fireT -= dt;
    if (boss.fireT <= 0) {
      if (Math.random() < (fast ? 0.42 : 0.3)) { boss.dive = 2; boss.fireT = fast ? 1.8 : 2.4; SFX.zap(); }
      else {
        for (let k = -2; k <= 2; k++) fireFeather(boss.x, boss.y + boss.r * 0.4, k * (fast ? 92 : 68));
        fireDot(boss.x, boss.y + boss.r * 0.3, 0, 250);
        boss.fireT = fast ? 1.25 : 1.7;
        SFX.zap();
      }
    }
  }
}
/* 第2关：三头蛇 —— 身体左右摆，三个头轮流喷火球 */
function hydraAct(dt, hpR) {
  const fast = hpR <= 0.5;
  if (!bossEnter(dt, 122)) return;
  boss.x += boss.dir * (fast ? 122 : 86) * dt;
  if (boss.x < boss.r + 34) { boss.x = boss.r + 34; boss.dir = 1; }
  if (boss.x > W - boss.r - 34) { boss.x = W - boss.r - 34; boss.dir = -1; }
  boss.y = 122 + Math.sin(boss.t * 1.35) * (fast ? 10 : 6);
  boss.fireT -= dt;
  if (boss.fireT <= 0) {
    boss.fireT = fast ? 0.55 : 0.85;
    const no = boss.headN % 3, hx = boss.x + (no - 1) * (fast ? 36 : 30), hy = boss.y - boss.r * 0.55;
    fireBall(hx - 5, hy, rnd(-36, 36), 310 + rnd(0, 60));
    fireBall(hx + 5, hy, rnd(-36, 36), 310 + rnd(0, 60));
    SFX.flame();
    boss.headN++;
  }
}
/* 第3关：暗黑机械龙 —— 阶段一激光+追踪弹；阶段二狂暴+召唤小怪 */
function mechAct(dt, hpR) {
  if (hpR <= 0.5 && boss.ph === 1) {            // 变身狂暴
    boss.ph = 2; shake = 18; flash = Math.max(flash, 0.35);
    boss.fireT = 0.4; boss.summonT = 2.2;
    SFX.beam(); SFX.power();
  }
  if (!bossEnter(dt, 128)) return;
  const rage = boss.ph === 2;
  boss.x += boss.dir * (rage ? 156 : 76) * dt;
  if (boss.x < boss.r + 26) { boss.x = boss.r + 26; boss.dir = 1; }
  if (boss.x > W - boss.r - 26) { boss.x = W - boss.r - 26; boss.dir = -1; }
  boss.y = 128 + Math.sin(boss.t * (rage ? 2.6 : 1.7)) * (rage ? 14 : 6);
  boss.fireT -= dt;
  if (boss.fireT <= 0) {
    if (!rage) {
      boss.fireT = 1.2;
      if (boss.headN % 2 === 0) { fireBeam(player.x); SFX.beam(); }
      else { fireSeek(boss.x - 18, boss.y + 10); fireSeek(boss.x + 18, boss.y + 10); SFX.lock(); }
    } else {
      boss.fireT = 0.8;
      if (Math.random() < 0.5) { fireBeam(player.x); SFX.beam(); }
      else {
        fireSeek(boss.x, boss.y + 6);
        fireBall(boss.x - 24, boss.y + 22, -70, 330);
        fireBall(boss.x + 24, boss.y + 22, 70, 330);
        SFX.flame();
      }
    }
    boss.headN++;
  }
  if (rage) {
    boss.summonT -= dt;
    if (boss.summonT <= 0) {
      boss.summonT = 4.4;
      spawnEnemy(); spawnEnemy(); SFX.summon();
    }
  }
}
function updateBoss(dt) {
  if (!boss) return;
  const hpR = boss.hp / boss.maxhp;
  boss.t += dt;
  if (boss.flash > 0) boss.flash -= dt;
  if (boss.hitT > 0) boss.hitT -= dt;
  if (boss.type === 'toucan') toucanAct(dt, hpR);
  else if (boss.type === 'hydra3') hydraAct(dt, hpR);
  else if (boss.type === 'mechdragon') mechAct(dt, hpR);
  if (hit(boss, player)) hurt();
}
function levelClear() {
  if (state !== 'playing') return;      // 打完 BOSS 后的 0.9 秒里若已阵亡，就不弹过关页
  state = 'clear';
  bgmStop();
  SFX.clear();
  const last = level >= LEVELS.length - 1;
  if (last) return showWin();
  showOverlay(
    '<div class="card">' +
      '<h2>第 ' + (level + 1) + ' 关完成！</h2>' +
      '<h3>' + LEVELS[level].name + ' 的怪兽都被赶跑啦</h3>' +
      '<p>现在打掉了 <b style="color:#e08a12">' + kills + '</b> 只怪兽</p>' +
      '<p class="small">下一关：' + LEVELS[level + 1].name + '<br>怪兽会更多更快，小心它们的火球</p>' +
      '<button class="btn" id="ovNext">继续闯关</button>' +
    '</div>'
  );
  $('ovNext').onclick = () => startLevel(level + 1);
}
function gameOver() {
  state = 'dead';
  bgmStop();
  SFX.lose();
  showOverlay(
    '<div class="card">' +
      '<h2>飞机受伤啦</h2>' +
      '<h3>第 ' + (level + 1) + ' 关 · ' + LEVELS[level].name + '</h3>' +
      '<p>没关系，我们从这一关重新开始</p>' +
      '<p class="small">小提示：躲在怪兽中间的空隙里，<br>看到火球来就往旁边挪一点</p>' +
      '<button class="btn" id="ovRetry">再试一次</button>' +
    '</div>'
  );
  // 重玩这一关：命和炸弹补满，火力保留（否则带着 1 级火力打 BOSS 太吃亏）
  $('ovRetry').onclick = () => { lives = 3; bombs = BOMBS_PER_LIFE; startLevel(level); };
}
function showWin() {
  state = 'win';
  bgmStop();
  SFX.win();
  const sec = Math.round((Date.now() - startTime) / 1000);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0'), ss = String(sec % 60).padStart(2, '0');
  const star = lives >= 3 ? 3 : (lives >= 2 ? 2 : 1);
  showOverlay(
    '<div class="card">' +
      '<h2>怪兽全部被赶跑啦！</h2>' +
      '<h3>歼-20 胜利返航</h3>' +
      '<div class="rows">' +
        '<div>打掉怪兽<b>' + kills + '</b></div>' +
        '<div>用了时间<b>' + mm + ':' + ss + '</b></div>' +
        '<div>剩余生命<b>' + lives + '</b></div>' +
        '<div>最终火力<b>' + player.power + ' 级</b></div>' +
      '</div>' +
      '<p class="small" style="text-align:center">' + '★'.repeat(star) + '☆'.repeat(3 - star) + '<br>' +
      (star === 3 ? '几乎没受伤，王牌飞行员！' : '已经很棒啦，再玩一次会更熟练') + '</p>' +
      '<button class="btn" id="ovAgain">再玩一次</button>' +
    '</div>'
  );
  $('ovAgain').onclick = () => newGame();
}

/* ================== 火力 / 炸弹 ================== */
function pwGain() {                          // 每打掉一只怪 +1 点火力经验
  player.pwExp++;
  if (player.power < 3 && player.pwExp >= PW_NEED[player.power]) powerTo(player.power + 1, true);
}
function powerTo(n, byKill) {                // 升/降火力等级
  player.power = clamp(n, 1, 3);
  player.pwExp = PW_NEED[player.power - 1];
  if (byKill && player.power > 1) { SFX.power(); syncHud(); }
}
function powerDown() {                       // 被打中掉一级
  if (player.power > 1) { powerTo(player.power - 1, false); syncHud(); }
}
function useBomb() {
  if (state !== 'playing' || !player.alive) return;
  if (bombs <= 0) { shake = Math.max(shake, 6); syncHud(); return; }
  bombs--;
  flash = 0.6; shake = 26;
  SFX.bomb();
  for (const b of ebullets) boom(b.x, b.y, '#ffd34d', 5);   // 弹幕全清
  ebullets = [];
  for (let i = enemies.length - 1; i >= 0; i--) {           // 全场怪兽挨炸
    const e = enemies[i];
    e.hp -= BOMB_DMG; e.flash = 0.3;
    boom(e.x, e.y, '#ffd34d', 9);
    if (e.hp <= 0) { onEnemyDead(e); enemies.splice(i, 1); }
  }
  if (boss && !boss.entering) {                             // BOSS 也吃伤害
    boss.hp -= BOMB_DMG; boss.flash = 0.3;
    boom(boss.x, boss.y, '#ffd34d', 26);
    if (boss.hp <= 0) onBossDead();
  }
  syncHud();
}

/* ================== 击杀结算（子弹和炸弹共用） ================== */
function onEnemyDead(e) {
  score += e.score; kills++;
  boom(e.x, e.y, '#7ad46b', 20); SFX.boom();
  if (Math.random() < 0.18) {
    const rr = Math.random();                          // 彩星会换一种子弹，让孩子每种都能玩到
    drops.push({ x: e.x, y: e.y, vy: 90, r: 14,
                 type: rr < 0.16 ? 'weapon' : (rr < 0.36 ? 'heart' : 'power') });
  }
  pwGain();
  syncHud();
}
function onBossDead() {
  score += boss.score; kills++;
  boom(boss.x, boss.y, '#ff6b8b', 42); SFX.boom();
  const bx = boss.x, by = boss.y;
  bgmStop(); boss = null; bossDone = true;
  pwGain();
  setTimeout(() => { boom(bx, by, '#ffd34d', 30); SFX.boom(); }, 160);
  setTimeout(levelClear, 900);
  syncHud();
}

/* ================== 玩家受伤 ================== */
function hurt() {
  if (player.inv > 0 || state !== 'playing') return;
  lives--;
  player.inv = 2.0;
  shake = 12;
  powerDown();                     // 挨打掉一级火力
  bombs = BOMBS_PER_LIFE;          // 新的这条命重新配满炸弹
  boom(player.x, player.y - 10, '#ffd34d', 18);
  SFX.hurt();
  syncHud();
  if (lives <= 0) { player.alive = false; setTimeout(gameOver, 500); }
}

/* ================== 主循环 ================== */
let lastT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!isFinite(dt) || dt <= 0) return;
  dt = Math.min(dt, 0.05);
  tick += dt * 60;
  if (state === 'playing') update(dt);
  draw();
}

/* ================== 武器系统 ================== */
const HIT_CD = 0.08;                          // 只给喷火用：它一秒能喷 40 多下，不设冷却会瞬秒 BOSS
function damageEnemy(e, n, idx, cd) {
  e.hp -= n; e.flash = 0.14; e.hitT = cd || 0;  // 露出“痛”表情
  if (e.hp <= 0) { onEnemyDead(e); enemies.splice(idx, 1); }
}
function damageBoss(n, cd) {
  boss.hp -= n; boss.flash = 0.14; boss.hitT = cd || 0;
  if (boss.hp <= 0) onBossDead();
}
function nearestTarget(b) {                  // 追踪弹锁定最近的怪兽（含 BOSS）
  let best = null, bd = Infinity;
  for (const e of enemies) {
    const d = (e.x - b.x) * (e.x - b.x) + (e.y - b.y) * (e.y - b.y);
    if (d < bd) { bd = d; best = e; }
  }
  if (boss) {
    const d = (boss.x - b.x) * (boss.x - b.x) + (boss.y - b.y) * (boss.y - b.y);
    if (d < bd) best = boss;
  }
  return best;
}
function strikeBolt(bx, halfW, dmg) {        // 雷电：瞬间结算整列伤害
  const y0 = player.y - 40;
  bolts.push({ x: bx, y0, y1: -12, w: halfW, life: 0.24, max: 0.24 });
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (e.hitT > 0) continue;
    if (Math.abs(e.x - bx) < halfW + e.r) damageEnemy(e, dmg || 1, j, 0);
  }
  if (boss && !(boss.hitT > 0) && Math.abs(boss.x - bx) < halfW + boss.r) damageBoss(dmg || 1, 0);
  boom(bx, y0 - 40, '#8fd6ff', 5);
}
function fireWeapon(w, p) {
  const x = player.x, y0 = player.y - 34;
  if (w.id === 'flame') {                    // 喷火龙：近身火舌，火力越高越宽越大
    const n = p >= 3 ? 3 : (p === 2 ? 2 : 1);
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i - (n - 1) / 2) * 22;
      bullets.push({ kind:'flame', x: x + off, y: y0, vx: off * 0.55, vy: -560,
                     r: 13, r0: 13, r1: 22 + p * 7, dmg:1, age:0, life:0.68, cd:0 });
    }
    SFX.flame();
  } else if (w.id === 'triple') {            // 三连发：1 级单发 / 2 级双发 / 3 级三向散射
    if (p >= 3) {
      bullets.push({ kind:'shot', x, y: player.y - 42, vx: 0,    vy: -780, r: 7, dmg:1, age:0, life:2.4, cd:0 });
      bullets.push({ kind:'shot', x: x - 15, y: y0, vx: -170, vy: -700, r: 7, dmg:1, age:0, life:2.4, cd:0 });
      bullets.push({ kind:'shot', x: x + 15, y: y0, vx: 170,  vy: -700, r: 7, dmg:1, age:0, life:2.4, cd:0 });
    } else if (p === 2) {
      bullets.push({ kind:'shot', x: x - 13, y: y0, vx: 0, vy: -700, r: 7, dmg:1, age:0, life:2.4, cd:0 });
      bullets.push({ kind:'shot', x: x + 13, y: y0, vx: 0, vy: -700, r: 7, dmg:1, age:0, life:2.4, cd:0 });
    } else {
      bullets.push({ kind:'shot', x, y: player.y - 40, vx: 0, vy: -700, r: 7, dmg:1, age:0, life:2.4, cd:0 });
    }
    SFX.shoot();
  } else if (w.id === 'bolt') {              // 雷电：1/2/3 道闪电，一整列通吃
    const n = p;
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i - (n - 1) / 2) * 46;
      strikeBolt(x + off, 34 + p * 6, 2);
    }
    SFX.zap();
  } else if (w.id === 'homing') {            // 追踪弹：自己拐弯咬住怪兽
    const n = p;
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i - (n - 1) / 2) * 22;
      bullets.push({ kind:'homing', x: x + off, y: y0, vx: off * 1.1, vy: -340,
                     r: 9, dmg:1, age:0, life:2.6, cd:0, tgt:null, relock:0 });
    }
    SFX.lock();
  } else {                                   // 回旋镖：飞出去再拐回来，来回打两次
    const n = p >= 3 ? 3 : (p === 2 ? 2 : 1);
    for (let i = 0; i < n; i++) {
      const dir = n === 1 ? 0 : (i - (n - 1) / 2);
      bullets.push({ kind:'boomer', x, y: y0, vx: dir * 190, vy: -640,
                     r: 15, dmg:1, age:0, life:2.2, cd:0, rot:0, pierce:true });
    }
    SFX.swing();
  }
}
function switchWeapon() {                    // 吃到换弹星星：随机换一种（不重复当前）
  let n = weapon;
  for (let i = 0; i < 8 && n === weapon; i++) n = rndi(0, WEAPONS.length - 1);
  weapon = n;
  player.cool = 0.25;
  bullets = [];
  tipMsg = '换子弹啦：' + weaponCfg().name;
  tipT = 1.9;
  SFX.swap();
  syncHud();
}

function update(dt) {
  const L = LEVELS[level];
  // --- 玩家操作 ---
  const sp = 430;
  if (keys.ArrowLeft || keys.a) player.x -= sp * dt;
  if (keys.ArrowRight || keys.d) player.x += sp * dt;
  if (keys.ArrowUp || keys.w) player.y -= sp * dt;
  if (keys.ArrowDown || keys.s) player.y += sp * dt;
  if (pointer.active) {                        // 手指/鼠标拖动：飞机平滑跟随
    player.x += (pointer.x - player.x) * Math.min(1, dt * 14);
    player.y += (pointer.y - player.y) * Math.min(1, dt * 14);
  }
  player.x = clamp(player.x, 26, W - 26);
  player.y = clamp(player.y, 40, H - 30);
  if (player.inv > 0) player.inv -= dt;
  if (flash > 0) flash -= dt;                  // 炸弹白闪

  // --- 自动开火：武器形态 x 火力等级 ---
  player.cool -= dt;
  if (player.cool <= 0 && player.alive) {
    const w = weaponCfg();
    player.cool = w.cool;
    fireWeapon(w, player.power);
  }
  if (tipT > 0) tipT -= dt;
  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].life -= dt;
    if (bolts[i].life <= 0) bolts.splice(i, 1);
  }

  // --- 出怪 ---
  if (wavePause > 0) wavePause -= dt;
  if (!boss) {
    if (waveLeft > 0 && wavePause <= 0) {
      spawnEnemy(); waveLeft--; wavePause = 0.7;
    } else if (waveLeft === 0 && enemies.length === 0 && wavePause <= 0) {
      if (waveIdx < L.waves.length - 1) { waveIdx++; waveLeft = L.waves[waveIdx]; waveTotal = L.waves[waveIdx]; wavePause = 0.7; }
      else if (L.boss && !bossDone) { spawnBoss(); }
      else if (!L.boss) levelClear();
      // BOSS 已被打掉时什么都不做，等 levelClear 的延时触发
      syncHud();
    }
  }

  // --- 怪兽移动与开火 ---
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.spd * dt;
    e.x = clamp(e.x + Math.sin(tick / 40 + e.base) * e.swing * dt, e.r, W - e.r);
    if (e.flash > 0) e.flash -= dt;
    if (e.hitT > 0) e.hitT -= dt;
    if (L.fire > 0) {
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 40) {
        e.fireT = rnd(2.2, 4.5) / L.fire;
        ebullets.push({ x: e.x, y: e.y + e.r, vx: rnd(-40, 40), vy: 210, r: 6 });
      }
    }
    if (e.y > H + e.r + 20) enemies.splice(i, 1);
    else if (hit(e, player)) { boom(e.x, e.y, '#7ad46b', 12); enemies.splice(i, 1); SFX.boom(); hurt(); }
  }

  // --- BOSS（专属 AI + 紧张 BGM）---
  if (boss) { updateBoss(dt); if (!boss.entering) bgmStart(); }
  else if (state === 'playing') bgmStop();

  // --- 我方子弹 ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.age += dt;
    if (b.cd > 0) b.cd -= dt;

    if (b.kind === 'homing') {                      // 追踪弹：锁定 + 拐弯
      if (b.tgt && b.tgt.hp <= 0) b.tgt = null;     // 目标已被打掉，重新锁定
      b.relock -= dt;
      if (b.relock <= 0 || !b.tgt) { b.tgt = nearestTarget(b); b.relock = 0.4; }
      if (b.tgt) {
        const dx = b.tgt.x - b.x, dy = b.tgt.y - b.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
        const sp = 480, k = Math.min(1, dt * 6);
        b.vx += (dx / d * sp - b.vx) * k;
        b.vy += (dy / d * sp - b.vy) * k;
      }
      if (Math.random() < 0.5) parts.push({ x: b.x, y: b.y + 6, vx: rnd(-14, 14), vy: rnd(20, 60),
        r: rnd(2, 4), c: '#ffd34d', life: 0.22, max: 0.22, rot: 0, spin: 0, star: false });
    } else if (b.kind === 'boomer') {               // 回旋镖：升到顶点再拐回来
      b.vy += 700 * dt;
      b.vx *= (1 - dt * 0.5);
      b.rot += dt * 15;
    } else if (b.kind === 'flame') {                // 喷火龙：越飘越大
      b.r = b.r0 + (b.r1 - b.r0) * Math.min(1, b.age / b.life);
    }

    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.age >= b.life || b.y < -60 || b.x < -60 || b.x > W + 60) { bullets.splice(i, 1); continue; }

    let gone = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (e.hitT > 0) continue;               // 喷火冷却中，这只怪兽暂时打不到
      if (hit(b, e)) {
        if (b.pierce) {                             // 穿透弹：每 0.16 秒最多打一只
          if (b.cd > 0) break;
          b.cd = 0.16;
        } else gone = true;
        damageEnemy(e, b.dmg, j, b.kind === 'flame' ? HIT_CD : 0);
        boom(b.x, b.y - 6, '#ffd34d', b.pierce ? 5 : 6);
        break;
      }
    }
    if (!gone && boss && !(boss.hitT > 0) && hit(b, boss) && !(b.pierce && b.cd > 0)) {
      if (b.pierce) b.cd = 0.16; else gone = true;
      damageBoss(b.dmg, b.kind === 'flame' ? HIT_CD : 0);
      boom(b.x, b.y - 6, '#ffd34d', 7);
    }
    if (gone) bullets.splice(i, 1);
  }

  // --- 敌方子弹 ---
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (b.kind === 'seek') {                         // 追踪弹：拐弯咬住玩家
      const dx = player.x - b.x, dy = player.y - b.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const sp = 290;
      b.vx += (dx / d * sp - b.vx) * Math.min(1, dt * 4.4);
      b.vy += (dy / d * sp - b.vy) * Math.min(1, dt * 4.4);
    } else if (b.kind === 'beam' && Math.random() < dt * 46) {
      parts.push({ x: b.x + rnd(-3, 3), y: b.y - 26, vx: rnd(-16, 16), vy: 150,
        r: rnd(2, 4), c: pick(['#8fd6ff', '#fff', '#ffd34d']), life: 0.3, max: 0.3, rot: 0, spin: 0, star: false });
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 24 || b.x < -24 || b.x > W + 24) { ebullets.splice(i, 1); continue; }
    if (hit(b, player)) { boom(b.x, b.y, '#ff5f7a', 10); ebullets.splice(i, 1); hurt(); }
  }

  // --- 道具 ---
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.y += d.vy * dt;
    if (d.y > H + 20) { drops.splice(i, 1); continue; }
    if (hit(d, player)) {
      if (d.type === 'weapon') {                // 彩星：换一种子弹
        switchWeapon();
      } else if (d.type === 'power') {          // 蓝星：火力 +1
        if (player.power < 3) { powerTo(player.power + 1, false); SFX.power(); }
        else { score += 60; SFX.item(); }
      } else {                                  // 红心：补 1 条命
        if (lives < 3) lives++;
        bombs = Math.max(bombs, BOMBS_PER_LIFE);
        SFX.item();
      }
      boom(d.x, d.y, d.type === 'power' ? '#5fb0ff' : (d.type === 'weapon' ? '#ff5fa8' : '#ff5f5f'), 12);
      syncHud();
      drops.splice(i, 1);
    }
  }

  // --- 粒子与云 ---
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt;
    p.vx *= 0.98; p.rot += p.spin * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (const c of clouds) {
    c.y += (26 + c.s * 30) * dt;
    if (c.y > H + 40) { c.y = -40; c.x = rnd(0, W); c.s = rnd(0.5, 1.1); c.a = rnd(0.25, 0.6); }
  }
  if (shake > 0) shake = Math.max(0, shake - 30 * dt);
}

/* ================== 渲染 ================== */
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  ctx.clearRect(-20, -20, W + 40, H + 40);
  for (const c of clouds) drawCloud(ctx, c);
  for (const d of drops) drawDrop(ctx, d);
  for (const b of bolts) drawBolt(ctx, b);
  for (const e of enemies) drawEnemy(ctx, e, tick / 60);
  if (boss) drawEnemy(ctx, boss, tick / 60);
  for (const b of ebullets) drawEBullet(ctx, b);
  for (const b of bullets) drawBullet(ctx, b);
  if (player.alive) {
    const blink = player.inv > 0 ? (Math.floor(tick / 6) % 2 ? 0.35 : 1) : 1;
    drawJet(ctx, player.x, player.y, tick, blink);
  }
  for (const p of parts) drawPart(ctx, p);
  // BOSS 入场横幅（亮名字）
  if (boss && boss.entering) {
    ctx.fillStyle = 'rgba(15,10,40,.55)';
    ctx.fillRect(W / 2 - 150, 172, 300, 46);
    ctx.strokeStyle = 'rgba(255,211,77,.8)'; ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - 150, 172, 300, 46);
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 22px "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚠ ' + boss.n + ' 来了！', W / 2, 196);
  }
  // BOSS 大血条（含名字）
  if (boss && !boss.entering) {
    const w = 250, h = 17, x = (W - w) / 2, y = 14;
    const r = Math.max(0, boss.hp / boss.maxhp);
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.fillRect(x, y, w, h);
    const grd = ctx.createLinearGradient(x, 0, x + w, 0);
    if (r > 0.35) { grd.addColorStop(0, '#ffb03d'); grd.addColorStop(1, '#ff5f7a'); }
    else { grd.addColorStop(0, '#ff3b6b'); grd.addColorStop(1, '#ff8a3d'); }
    ctx.fillStyle = grd;
    ctx.fillRect(x, y, w * r, h);
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;   // 四段刻度
    for (let i = 1; i < 4; i++) {
      const sx = x + w * i / 4;
      ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx, y + h); ctx.stroke();
    }
    ctx.strokeStyle = (r < 0.3 && Math.floor(tick / 8) % 2) ? '#ff3b6b' : '#fff';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(boss.n + '  ' + Math.max(0, boss.hp) + ' / ' + boss.maxhp, W / 2, y + h / 2 + 0.5);
  }
  ctx.restore();
  // “换子弹啦！”飘字提示
  if (tipT > 0 && tipMsg) {
    const a = clamp(tipT / 0.45, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 22px "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,50,110,.55)';
    ctx.strokeText(tipMsg, W / 2, 150);
    ctx.fillStyle = '#ffd34d';
    ctx.fillText(tipMsg, W / 2, 150);
    ctx.restore();
  }
  // 炸弹白闪（放在 restore 之后，不跟着抖）
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.9, flash * 1.6).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ================== HUD 与覆盖层 ================== */
function heartSvg(fill) {
  return '<svg viewBox="0 0 24 24"><path d="M12 21S3 14.5 3 8.8C3 5.5 5.6 3 8.7 3c1.9 0 3.3 1.1 3.3 1.1S13.4 3 15.3 3C18.4 3 21 5.5 21 8.8 21 14.5 12 21 12 21z" fill="' +
    (fill ? '#ff5f5f' : 'rgba(120,110,160,.25)') + '" stroke="#fff" stroke-width="1.5"/></svg>';
}
function syncHud() {
  $('hLv').textContent = level + 1;
  $('hScore').textContent = score;
  // 当前子弹种类
  const w = weaponCfg();
  $('hWp').textContent = w.name;
  $('hWpBox').style.background = 'linear-gradient(' + w.color + ', #ff9a3d)';
  let h = '';
  for (let i = 0; i < 3; i++) h += heartSvg(i < lives);
  $('hHearts').innerHTML = h;
  // 火力等级
  let pw = '';
  for (let i = 0; i < 3; i++) pw += '<i class="' + (i < player.power ? 'on' : '') + '"></i>';
  $('hPw').innerHTML = pw;
  $('hPwBox').className = 'pw' + (player.power >= 3 ? ' max' : '');
  // 炸弹数量
  $('hBomb').textContent = bombs;
  $('btnBomb').className = 'btn-bomb' + (bombs <= 0 ? ' empty' : '');
  const L = LEVELS[level];
  let prog;
  if (boss) prog = 1 - boss.hp / boss.maxhp;
  else {
    const done = waveIdx / L.waves.length;
    const cur = (waveTotal ? (waveTotal - waveLeft) / waveTotal : 0) / L.waves.length;
    prog = done + cur;
  }
  $('hProg').style.width = Math.round(clamp(prog, 0, 1) * 100) + '%';
}
function showOverlay(html) { $('overlayBox').innerHTML = '<div class="overlay">' + html + '</div>'; }
function hideOverlay() { $('overlayBox').innerHTML = ''; }

/* ================== 输入 ================== */
const pointer = { active: false, x: W / 2, y: H - 130 };
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state !== 'playing') return;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  const p = toCanvas(e);
  pointer.active = true; pointer.x = p.x; pointer.y = p.y;
});
cv.addEventListener('pointermove', e => {
  if (!pointer.active) return;
  const p = toCanvas(e);
  pointer.x = p.x; pointer.y = p.y;
});
window.addEventListener('pointerup', () => { pointer.active = false; });
window.addEventListener('pointercancel', () => { pointer.active = false; });
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && (state === 'playing' || state === 'pause')) { e.preventDefault(); togglePause(); }
  if ((e.key === 'b' || e.key === 'B') && state === 'playing') { e.preventDefault(); useBomb(); }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') togglePause();
});

function togglePause() {
  if (state === 'playing') {
    state = 'pause'; pointer.active = false; bgmStop();
    showOverlay(
      '<div class="card">' +
        '<h2>暂停一下</h2>' +
        '<p class="small">· 手指按住屏幕拖动，歼-20 就会跟着走<br>' +
        '· 子弹是自动发射的，不用点<br>' +
        '· 打得多火力会升级：1 发 → 2 发 → 3 发<br>' +
        '· 蓝色的星星：火力 +1 级<br>' +
        '· 彩色的星星：换一种子弹（共 5 种）<br>' +
        '&nbsp;&nbsp;&nbsp;喷火龙 / 三连发 / 雷电 / 追踪弹 / 回旋镖<br>' +
        '· 红色的心：补回 1 条命<br>' +
        '· 炸弹：清掉所有火球，全场怪兽一起挨炸（随便炸）<br>' +
        '&nbsp;&nbsp;&nbsp;每条命配 30 颗炸弹（共 3 条命），被打中掉一级火力</p>' +
        '<button class="btn" id="ovResume">继续开打</button>' +
      '</div>'
    );
    $('ovResume').onclick = togglePause;
  } else if (state === 'pause') {
    state = 'playing'; hideOverlay();
    if (boss && !boss.entering) bgmStart();
  }
}
$('btnPause').onclick = togglePause;
$('btnBomb').onclick = () => { useBomb(); if (document.activeElement) document.activeElement.blur(); };

/* ================== 开始 ================== */
function showMenu() {
  state = 'menu';
  showOverlay(
    '<div class="card">' +
      '<h2>歼-20 打怪兽</h2>' +
      '<p>开着我们的隐形战斗机，<br>把天上的怪兽全部赶跑！</p>' +
      '<div class="wp-title">先挑一种子弹吧（一共 5 种）</div>' +
      '<div class="wp-grid">' +
        WEAPONS.map((w, i) =>
          '<div class="wp' + (i === weapon ? ' sel' : '') + '" data-w="' + i + '">' +
            '<svg class="ic" viewBox="0 0 26 26">' + weaponSvg(w.id) + '</svg>' +
            w.name + '<em>' + w.desc + '</em>' +
          '</div>').join('') +
      '</div>' +
      '<p class="small">· 手指按住屏幕，拖着飞机走<br>' +
      '· 子弹自动发射，你只管躲<br>' +
      '· 打得越多火力越猛：1 发 → 2 发 → 3 发<br>' +
      '· 吃到彩色星星会换成别的子弹<br>' +
      '· 你有 3 条命，每条命配 30 颗炸弹，点一下全场开花<br>' +
      '· 一共 3 关，每关最后有大怪兽 BOSS</p>' +
      '<button class="btn" id="ovStart">开始闯关</button>' +
    '</div>'
  );
  document.querySelectorAll('#overlayBox .wp').forEach(el => {
    el.onclick = () => {
      weapon = +el.getAttribute('data-w');
      document.querySelectorAll('#overlayBox .wp').forEach(x => x.classList.toggle('sel', x === el));
      syncHud();
      SFX.swap();
    };
  });
  $('ovStart').onclick = () => { try { ensureAudio(); actx.resume && actx.resume(); } catch (e) {} newGame(); };
}
function newGame() {
  score = 0; kills = 0; lives = 3;
  startTime = Date.now();
  player.alive = true;
  player.power = 1; player.pwExp = 0;   // 新的一局火力从 1 级开始
  bombs = BOMBS_PER_LIFE;
  startLevel(0);
}

resize();
showMenu();
requestAnimationFrame(loop);
setInterval(() => { if (state === 'playing') syncHud(); }, 400);
</script>
