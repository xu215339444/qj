<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>23-小小科学家实验室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1c2a4a;font-family:"Microsoft YaHei","PingFang SC",sans-serif;display:flex;justify-content:center;min-height:100vh;padding:8px}
#app{width:960px;max-width:100%}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#2b4f8f,#1d3a6e);border-radius:14px 14px 0 0;color:#fff}
#ttl{font-size:20px;font-weight:bold;flex:1;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.4)}
#topbar button{background:#ffd34d;border:none;border-radius:10px;padding:6px 14px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit}
#topbar button:active{transform:scale(.94)}
#stage{background:linear-gradient(#dff0ff,#f6fbff);border-radius:0 0 14px 14px;min-height:560px;position:relative;padding:18px;overflow:hidden}
/* 实验室全景 */
#lab{display:none}
#lab.show{display:block}
#badgeWall{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.badge{width:64px;height:64px;border-radius:50%;background:#e8e8ee;border:4px solid #c8c8d4;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative}
.badge.got{background:radial-gradient(circle at 35% 30%,#fff8d0,#ffd34d);border-color:#e0a800;box-shadow:0 0 14px rgba(255,200,60,.7)}
.badge .bl{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:12px;color:#556}
#stations{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.station{background:linear-gradient(#fff,#eaf4ff);border:3px solid #b8d8f0;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;position:relative;transition:transform .12s}
.station:hover{transform:translateY(-4px)}
.station.done{border-color:#8ac86a;background:linear-gradient(#f4ffe8,#e0f8d0)}
.station .ic{font-size:40px}
.station .nm{font-weight:bold;font-size:17px;color:#2a4a7a;margin-top:4px}
.station .ds{font-size:13px;color:#7a8aa0;margin-top:2px}
.station .st{position:absolute;top:-10px;right:-6px;font-size:16px;letter-spacing:-2px}
#robot{display:flex;gap:10px;align-items:flex-start;margin-top:22px}
#robotFace{width:58px;height:58px;flex:none}
#robotSay{background:#fff;border:3px solid #9ab8d8;border-radius:14px;padding:10px 14px;font-size:16px;color:#2a4a7a;min-height:52px;flex:1;line-height:1.6}
#robotSay b{color:#e2543e}
/* 实验界面 */
#exp{display:none}
#exp.show{display:block}
#expTitle{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#expTitle .nm{font-size:24px;font-weight:900;color:#2a4a7a}
#expGoal{font-size:15px;color:#5a7aa0;margin-bottom:12px}
#expArea{min-height:340px}
#expDoneBar{display:none;text-align:center;margin-top:14px}
#expDoneBar.show{display:block}
#expDoneBar button{font-family:inherit;font-size:18px;font-weight:bold;padding:10px 28px;border:none;border-radius:14px;background:linear-gradient(#ffd34d,#ff9d3c);color:#7a3c00;box-shadow:0 4px 0 #c96f12;cursor:pointer;margin:0 8px}
/* 通用卡片 */
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{width:110px;background:#fff;border:3px solid #c8d8e8;border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;user-select:none}
.card svg{width:84px;height:64px;display:block;margin:0 auto}
.card .lb{font-size:15px;font-weight:bold;color:#334;margin-top:2px}
.card.sel{border-color:#ffb63c;background:#fff8dc;box-shadow:0 0 0 3px rgba(255,182,60,.4)}
.card.right{border-color:#6ac86a;background:#eaffea}
.card.wrong{border-color:#e2543e;background:#ffeaea;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.dead{opacity:.3;pointer-events:none}
/* 分类篮 */
#baskets{display:flex;gap:18px;justify-content:center;margin-top:18px}
.basket{width:200px;min-height:130px;border-radius:16px;border:4px dashed #9ab8d8;background:#f0f7ff;padding:8px;text-align:center}
.basket h4{color:#2a4a7a;font-size:17px;margin-bottom:6px}
.basket .items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:60px}
.basket.dropHot{border-color:#ffb63c;background:#fff8dc}
.bkTag{display:inline-block;background:#fff;border:2px solid #9ab8d8;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:bold;color:#334}
/* 排序槽 */
#orderSlots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.oslot{width:130px;height:150px;border:3px dashed #9ab8d8;border-radius:14px;background:#f0f7ff;display:flex;align-items:center;justify-content:center;position:relative}
.oslot .num{position:absolute;top:-12px;left:-8px;background:#ff8a3c;color:#fff;width:26px;height:26px;border-radius:50%;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:14px}
.oslot.filled{border-style:solid;border-color:#6ac86a;background:#eaffea}
/* 水箱 */
#tank{width:420px;max-width:100%;height:220px;margin:10px auto;border:4px solid #7ab8d8;border-radius:0 0 20px 20px;background:linear-gradient(#bfe8ff,#8fd0f0);position:relative;overflow:hidden}
#tank .wline{position:absolute;top:12px;left:0;right:0;text-align:center;color:#fff;font-weight:bold;font-size:14px}
.toy{position:absolute;font-size:26px;transition:top 1s,left .3s}
#sinkQ{font-size:20px;font-weight:bold;color:#2a4a7a;text-align:center;margin-bottom:8px}
.choiceBtns{display:flex;gap:14px;justify-content:center;margin-top:14px}
.choiceBtns button{font-family:inherit;font-size:20px;font-weight:bold;padding:12px 34px;border:3px solid #b8d8f0;border-radius:14px;background:#fff;color:#2a4a7a;cursor:pointer}
.choiceBtns button:hover{background:#eaf4ff}
.choiceBtns button.right{border-color:#6ac86a;background:#eaffea}
.choiceBtns button.wrong{border-color:#e2543e;background:#ffeaea;animation:shake .3s}
#prog{font-size:14px;color:#7a8aa0;text-align:center;margin-top:10px}
/* 结算 */
#starsBig{font-size:44px;letter-spacing:4px;text-align:center;margin:6px 0}
#finalAward{display:none;text-align:center;background:linear-gradient(#fff8dc,#ffe9b0);border:4px solid #ffd34d;border-radius:18px;padding:20px;margin-top:14px}
#finalAward.show{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="homeBtn">🏠 大厅</button>
    <div id="ttl">🔬 小小科学家实验室</div>
    <button id="muteBtn">🔊</button>
  </div>
  <div id="stage">
    <div id="lab">
      <div id="badgeWall"></div>
      <div id="stations"></div>
      <div id="robot">
        <svg id="robotFace" viewBox="0 0 60 60"><rect x="10" y="12" width="40" height="36" rx="10" fill="#9ab8d8"/><rect x="16" y="20" width="28" height="16" rx="7" fill="#fff"/><circle cx="24" cy="28" r="3.4" fill="#2a4a7a"/><circle cx="36" cy="28" r="3.4" fill="#2a4a7a"/><rect x="22" y="40" width="16" height="4" rx="2" fill="#fff"/><line x1="30" y1="12" x2="30" y2="4" stroke="#9ab8d8" stroke-width="3"/><circle cx="30" cy="4" r="3.4" fill="#ffb63c"/></svg>
        <div id="robotSay">你好，小科学家！我是机器人豆豆 🤖 点击一个实验台开始做实验吧！每完成一个实验就能得到一枚<b>科学徽章</b>哦！</div>
      </div>
      <div id="finalAward"></div>
    </div>
    <div id="exp">
      <div id="expTitle"><button id="backLab">◀ 返回</button><span class="nm" id="expName"></span></div>
      <div id="expGoal"></div>
      <div id="expArea"></div>
      <div id="prog"></div>
      <div id="expDoneBar"></div>
    </div>
  </div>
</div>
<script>
(function(){

var muted=false;
document.getElementById('muteBtn').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';};
document.getElementById('homeBtn').onclick=function(){try{if(window.parent&&window.parent.goHome){window.parent.goHome();return;}}catch(e){}location.href='游戏大厅.html';};
function beep(f,d,t,v){try{if(muted)return;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!beep.ac)beep.ac=new AC();var ac=beep.ac;if(ac.state==='suspended'&&ac.resume)ac.resume();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.07;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+(d||0.14));o.stop(ac.currentTime+(d||0.14));}catch(e){}}
function sGood(){beep(660,.1);setTimeout(function(){beep(880,.12)},90);setTimeout(function(){beep(1175,.18)},190);}

function sPop(){beep(540,.08,'triangle',.07);}
function sWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,.16,'triangle',.08);},i*130);});}

SV.appleT='<svg viewBox="0 0 84 64" xmlns="http://www.w3.org/2000/svg"><path d="M42 22 C30 14 16 26 20 42 C23 54 34 58 42 54 C50 58 61 54 64 42 C68 26 54 14 42 22 Z" fill="#e2543e"/><path d="M42 22 Q41 14 36 12" stroke="#7a4a2a" stroke-width="3" fill="none"/></svg>';

/* ---------------- 通用答题引擎（逐题点击） ---------------- */
function askOne(item,onOk){
  var okFirst=true;
  item.el.classList.add('sel');sPop();
  var bar=area.querySelector('.choiceBtns');
  function done(ok){
    if(ok){item.el.classList.remove('sel');item.el.classList.add('right');item.el.classList.add('dead');
      if(okFirst){state.firstTry++;}
      state.total++;sGood();updateProg();onOk&&onOk(true);
    }else{okFirst=false;item.el.classList.add('wrong');sBad();setTimeout(function(){item.el.classList.remove('sel');item.el.classList.remove('wrong');},600);onOk&&onOk(false);}
  }
  return done;
}
function updateProg(){
  var txt='进度：'+state.total+' 题完成，首轮答对 '+state.firstTry;
  prog.textContent=txt;
}
function finishExp(d){
  var rate=state.total?state.firstTry/state.total:0;
  var s=rate>=0.9?3:rate>=0.55?2:1;
  if(!stars[d.id]||s>(stars[d.id]||0))stars[d.id]=s;
  badges[d.id]=true;
  sWin();
  area.innerHTML='<div style="text-align:center"><div style="font-size:52px">'+d.badge+'</div><div style="font-size:24px;font-weight:900;color:#2a4a7a">获得徽章：'+d.badgeName+'</div><div id="starsBig">'+'⭐'.repeat(s)+'<span style="opacity:.25">'+'⭐'.repeat(3-s)+'</span></div><div style="color:#5a7aa0">首轮答对 '+state.firstTry+'/'+state.total+'，'+(s===3?'完美实验！':s===2?'很棒！再试一次可以拿 3 星哦':'完成啦！再来一遍巩固一下吧')+'</div></div>';
  doneBar.innerHTML='<button id="againBtn">🔁 再做一次</button><button id="backBtn2">🏠 回实验室</button>';
  doneBar.classList.add('show');
  $('againBtn').onclick=function(){openExp(d.id);};
  $('backBtn2').onclick=function(){robot('做完了 '+d.name.replace(/^\S+\s/,'')+'，徽章到手！去试试下一个实验台吧！');renderLab();};
  robot('🎉 太厉害了！<b>'+d.badgeName+'</b>徽章属于你啦！'+(s<3?'再挑战一次能拿更多星星哦。':''));
  if(window.__T)window.__T.done=true;
}
/* ---------------- 实验 1：动物分类 ---------------- */
function expAnimal(){
  var groups={mam:{name:'哺乳动物',items:[]},bird:{name:'鸟类',items:[]},bug:{name:'昆虫',items:[]}};
  var placed=0;
  var pool=shuffle([
    {sv:SV.dog,lb:'小狗',g:'mam'},{sv:SV.cat,lb:'小猫',g:'mam'},{sv:SV.rabbit,lb:'兔子',g:'mam'},{sv:SV.pig,lb:'小猪',g:'mam'},
    {sv:SV.bird,lb:'小鸟',g:'bird'},{sv:SV.duck,lb:'鸭子',g:'bird'},
    {sv:SV.butterfly,lb:'蝴蝶',g:'bug'},{sv:SV.bee,lb:'蜜蜂',g:'bug'}]);
  area.innerHTML='<div style="font-size:17px;color:#2a4a7a;text-align:center;margin-bottom:10px">👆 <b>先点小动物</b>，再点它该去的篮子（提示：吃奶长大的是哺乳动物，有羽毛的是鸟类，六条腿的是昆虫）</div><div class="cards" id="anCards"></div><div id="baskets"></div>';
  var cardsEl=$('anCards'),bkEl=$('baskets');
  var sel=null;
  pool.forEach(function(p){
    var c=document.createElement('div');c.className='card';c.innerHTML=p.sv+'<div class="lb">'+p.lb+'</div>';
    c._g=p.g;c._lb=p.lb;
    c.onclick=function(){
      if(c.classList.contains('dead'))return;
      document.querySelectorAll('#anCards .card').forEach(function(x){x.classList.remove('sel');});
      c.classList.add('sel');sel=c;sPop();
      robot('你要把 <b>'+p.lb+'</b> 送到哪个篮子呢？');
    };
    cardsEl.appendChild(c);
  });
  Object.keys(groups).forEach(function(k){
    var b=document.createElement('div');b.className='basket';b.innerHTML='<h4>'+groups[k].name+'</h4><div class="items"></div>';
    b.onclick=function(){
      if(!sel)return;
      if(sel._g===k){
        sel.classList.remove('sel');sel.classList.add('right','dead');
        var t=document.createElement('span');t.className='bkTag';t.textContent=sel._lb;b.querySelector('.items').appendChild(t);
        state.total++;state.firstTry++;placed++;sGood();updateProg();
        sel=null;
        if(placed>=8){robot('所有小动物都回家啦！');setTimeout(function(){finishExp(EXP_DEFS[0]);},700);}
      }else{
        sel.classList.add('wrong');sBad();
        var hint=k==='mam'?'哺乳动物宝宝是喝奶长大的哦':k==='bird'?'鸟类有羽毛、会下蛋':'昆虫有六条腿';
        robot('不对哦～ <b>'+hint+'</b>。再想一想！');
        setTimeout(function(){sel&&sel.classList.remove('wrong');},600);
        state.total++;updateProg();
      }
    };
    bkEl.appendChild(b);
  });
  updateProg();
}
/* ---------------- 实验 2：植物排序 ---------------- */
function expPlant(){
  var order=[{sv:SV.seed,lb:'1. 种子'},{sv:SV.sprout,lb:'2. 发芽'},{sv:SV.leaf,lb:'3. 长叶'},{sv:SV.flower,lb:'4. 开花'}];
  var shuffled=shuffle(order.map(function(o,i){return {sv:o.sv,lb:o.lb.split('. ')[1],idx:i};}));
  area.innerHTML='<div style="font-size:17px;color:#2a4a7a;text-align:center;margin-bottom:10px">👆 按 <b>种子→发芽→长叶→开花</b> 的顺序，依次点击下面的卡片放进槽里</div><div id="orderSlots"></div><div class="cards" id="plCards"></div>';
  var slots=$('orderSlots'),cards=$('plCards');var nextIdx=0;
  for(var i=0;i<4;i++){var s=document.createElement('div');s.className='oslot';s.innerHTML='<span class="num">'+(i+1)+'</span>';slots.appendChild(s);}
  shuffled.forEach(function(p){
    var c=document.createElement('div');c.className='card';c.innerHTML=p.sv+'<div class="lb">'+p.lb+'</div>';
    c.onclick=function(){
      if(c.classList.contains('dead'))return;
      if(p.idx===nextIdx){
        c.classList.add('dead','right');sGood();
        var slot=slots.children[nextIdx];slot.classList.add('filled');slot.innerHTML='<span class="num">'+(nextIdx+1)+'</span>'+c.innerHTML;
        nextIdx++;state.total++;state.firstTry++;updateProg();
        if(nextIdx>=4){robot('🌱 排对啦！种子喝水晒太阳，慢慢长成小花！');setTimeout(function(){finishExp(EXP_DEFS[1]);},700);}
      }else{
        c.classList.add('wrong');sBad();state.total++;updateProg();
        robot('还不到它呢～想一想：先有种子，才会发芽哦！');
        setTimeout(function(){c.classList.remove('wrong');},600);
      }
    };
    cards.appendChild(c);
  });
  updateProg();
}

/* ---------------- 实验 4：沉与浮 ---------------- */
function expSink(){
  var items=shuffle([
    {sv:SV.rock,lb:'石头',sink:true},{sv:SV.wood,lb:'木头',sink:false},{sv:SV.key,lb:'铁钥匙',sink:true},
    {sv:SV.ball,lb:'皮球',sink:false},{sv:SV.leafW,lb:'树叶',sink:false},{sv:SV.coin,lb:'硬币',sink:true},
    {sv:SV.duckT,lb:'小黄鸭',sink:false},{sv:SV.appleT,lb:'苹果',sink:false}]);
  area.innerHTML='<div id="sinkQ">👇 猜一猜：把它放进水里，会<b>沉下去</b>还是<b>浮起来</b>？</div><div class="cards" id="skCards" style="min-height:118px"></div><div id="tank"><div class="wline">～ 水 池 ～</div></div><div class="choiceBtns"><button id="bSink">⬇ 沉下去</button><button id="bFloat">⬆ 浮起来</button></div>';
  var cards=$('skCards'),tank=$('tank');
  var cur2=null,queue=items.slice(),bs=$('bSink'),bf=$('bFloat');
  function drawCard(){
    cur2=queue.shift();
    if(!cur2){setTimeout(function(){finishExp(EXP_DEFS[3]);},600);return;}
    cards.innerHTML='';var c=document.createElement('div');c.className='card sel';c.innerHTML=cur2.sv+'<div class="lb">'+cur2.lb+'</div>';cards.appendChild(c);cur2.el=c;
    var toy=document.createElement('div');toy.className='toy';toy.innerHTML=cur2.lb==='石头'?'🪨':cur2.lb==='木头'?'🪵':cur2.lb==='铁钥匙'?'🔑':cur2.lb==='皮球'?'⚽':cur2.lb==='树叶'?'🍃':cur2.lb==='硬币'?'🪙':cur2.lb==='小黄鸭'?'🐤':'🍎';
    toy.id='toy';toy.style.left='195px';toy.style.top='-40px';tank.appendChild(toy);
    robot('观察 <b>'+cur2.lb+'</b>：它比较重还是比较轻？会不会吸水？');
  }
  function answer(sinkGuess){
    if(!cur2||cur2._a)return;
    cur2._a=true;
    var ok=(sinkGuess===cur2.sink);state.total++;if(ok)state.firstTry++;
    bs.classList.remove('right','wrong');bf.classList.remove('right','wrong');
    (sinkGuess?bs:bf).classList.add(ok?'right':'wrong');
    var toy=$('toy');if(toy){toy.style.top=cur2.sink?'150px':'18px';}
    if(ok){sGood();robot(cur2.sink?'✅ 对！'+cur2.lb+'比较重，沉下去啦！':'✅ 对！'+cur2.lb+'很轻，会浮在水面上！');}
    else{sBad();robot('❌ '+cur2.lb+(cur2.sink?'很重，会沉下去哦':'很轻，会浮起来哦'));setTimeout(function(){},0);}
    var it=cur2;setTimeout(function(){
      var t2=$('toy');if(t2)t2.remove();
      it.el.classList.add('dead');
      bs.classList.remove('right','wrong');bf.classList.remove('right','wrong');
      drawCard();
    },1100);
    updateProg();
  }
  bs.onclick=function(){answer(true);};bf.onclick=function(){answer(false);};
  drawCard();
}
/* ---------------- 实验 5：磁铁游戏 ---------------- */
function expMagnet(){
  var items=shuffle([
    {sv:SV.clip,lb:'回形针',yes:true},{sv:SV.nail,lb:'铁钉子',yes:true},{sv:SV.spoon,lb:'铁勺子',yes:true},
    {sv:SV.ruler,lb:'塑料尺',yes:false},{sv:SV.eraser,lb:'橡皮',yes:false},{sv:SV.glass,lb:'玻璃杯',yes:false},{sv:SV.paper,lb:'纸片',yes:false}]);
  var i=0,score0=0;
  area.innerHTML='';
  function next(){
    if(i>=items.length){setTimeout(function(){finishExp(EXP_DEFS[4]);},600);return;}
    var it=items[i];area.innerHTML='';
    var box=document.createElement('div');box.style.textAlign='center';
    box.innerHTML='<div style="font-size:40px">🧲</div><div class="card" style="display:inline-block;margin:6px auto">'+it.sv+'<div class="lb">'+it.lb+'</div></div><div style="font-size:20px;font-weight:bold;color:#2a4a7a;margin-top:8px">磁铁能吸住 <b style="color:#e2543e">'+it.lb+'</b> 吗？</div>';
    var cb=document.createElement('div');cb.className='choiceBtns';
    [['能吸住',true],['吸不住',false]].forEach(function(pair){
      var b=document.createElement('button');b.textContent=pair[0];
      b.onclick=function(){
        var ok=(pair[1]===it.yes);state.total++;if(ok){state.firstTry++;score0++;}
        b.classList.add(ok?'right':'wrong');
        if(ok){sGood();robot(it.yes?'✅ 对！'+it.lb+'是铁做的，磁铁最喜欢吸铁啦！':'✅ 对！磁铁只吸铁制品，'+it.lb+'不是铁做的。');}
        else{sBad();robot('🤔 '+it.lb+(it.yes?'可是铁做的，能被吸住哦':'不是铁做的，磁铁吸不住它'));state.total--;}
        i++;setTimeout(next,ok?1000:1400);
      };
      cb.appendChild(b);
    });
    box.appendChild(cb);area.appendChild(box);updateProg();
  }
  next();
}
/* ---------------- 实验 6：声音传播 ---------------- */

    {sv:SV.air,lb:'空气',yes:true,ex:'我们平时听到的声音就是穿过空气传来的'},{sv:SV.water,lb:'水',yes:true,ex:'在水里拍手，潜水的人也能听到哦'},
    {sv:SV.woodS,lb:'木头',yes:true,ex:'把耳朵贴在木头上敲，声音很清楚'},{sv:SV.table,lb:'课桌',yes:true,ex:'敲桌子，耳朵贴上去听听看！'},
    {sv:SV.rail,lb:'铁轨',yes:true,ex:'古代人把耳朵贴在铁轨上听火车'},{sv:SV.vacuum,lb:'真空',yes:false,ex:'真空里什么都没有，声音没法传播（所以太空里听不到声音）'}]);
  var i=0;
  area.innerHTML='';
  function next(){
    if(i>=items.length){setTimeout(function(){finishExp(EXP_DEFS[5]);},600);return;}
    var it=items[i];area.innerHTML='';
    var box=document.createElement('div');box.style.textAlign='center';
    box.innerHTML='<div style="font-size:40px">🔔🤏</div><div style="font-size:16px;color:#5a7aa0;margin-bottom:6px">铃铛响了！声音能穿过下面的东西传到你耳朵里吗？</div><div class="card" style="display:inline-block;margin:6px auto">'+it.sv+'<div class="lb">'+it.lb+'</div></div>';
    var cb=document.createElement('div');cb.className='choiceBtns';
    [['能传声 👂',true],['不能传声 🙉',false]].forEach(function(pair){
      var b=document.createElement('button');b.textContent=pair[0];
      b.onclick=function(){
        var ok=(pair[1]===it.yes);state.total++;
        if(ok){state.firstTry++;sGood();robot('✅ 对！'+it.ex);}

        i++;setTimeout(next,ok?1100:1700);

      cb.appendChild(b);
    });
    box.appendChild(cb);area.appendChild(box);updateProg();
  }
  next();
}
/* ---------------- 终极实验 ---------------- */
function expFinal(){
  var qs=shuffle([
    {q:'🐠 小金鱼是下面哪一类动物？',opts:['鸟类','鱼类','昆虫'],a:1,ex:'金鱼生活在水里、用鳃呼吸，是鱼类！'},
    {q:'🌱 植物长大最需要什么？',opts:['阳光和水','糖果','玩具'],a:0,ex:'植物靠阳光、水和空气长大！'},
    {q:'🌧️ 天空下雨是因为什么？',opts:['云朵哭了','水蒸气变成小水滴落下来','有人泼水'],a:1,ex:'水蒸气升上天空变成云，云里的水滴越来越大就下雨啦！'},
    {q:'⚽ 皮球放进水里会怎样？',opts:['沉下去','浮起来','消失'],a:1,ex:'皮球里面有空气很轻，会浮起来！'},
    {q:'🧲 磁铁能吸住什么？',opts:['铁钉','塑料尺','纸片'],a:0,ex:'磁铁喜欢吸铁制品！'}]);
  var i=0;
  area.innerHTML='';
  function next(){
    if(i>=qs.length){
      badges.final=true;sWin();
      area.innerHTML='<div style="text-align:center"><div style="font-size:56px">🏆</div><div style="font-size:26px;font-weight:900;color:#7a4a00">恭喜！你就是小小科学家！</div><div style="margin-top:8px;color:#5a7aa0">6 枚徽章 + 终极徽章全部收集完成！</div></div>';
      doneBar.innerHTML='<button id="backBtn3">🏠 回实验室看奖杯</button>';doneBar.classList.add('show');
      $('backBtn3').onclick=function(){renderLab();};
      robot('🏆 终极实验全部答对！从今天起，你就是名符其实的<b>小小科学家</b>啦！');
      if(window.__T)window.__T.done=true;
      return;
    }
    var q=qs[i];area.innerHTML='';
    var box=document.createElement('div');box.style.textAlign='center';
    box.innerHTML='<div style="font-size:15px;color:#8a7a4a">🏆 终极实验 第 '+(i+1)+'/'+qs.length+' 题</div><div style="font-size:22px;font-weight:bold;color:#2a4a7a;margin:10px 0 14px">'+q.q+'</div>';
    var cb=document.createElement('div');cb.className='choiceBtns';
    q.opts.forEach(function(o,k){
      var b=document.createElement('button');b.textContent=o;
      b.onclick=function(){
        state.total++;
        if(k===q.a){state.firstTry++;b.classList.add('right');sGood();robot('✅ '+q.ex);i++;setTimeout(next,900);}
        else{b.classList.add('wrong');sBad();robot('🤖 别急，终极实验答错也没关系～再选一次试试！');setTimeout(function(){b.classList.remove('wrong');},600);}
        updateProg();
      };
      cb.appendChild(b);
    });
    box.appendChild(cb);area.appendChild(box);updateProg();
  }
  next();
}
