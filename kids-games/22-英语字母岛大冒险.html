<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>22-英语字母岛大冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#123059;font-family:"Microsoft YaHei","PingFang SC",sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:flex-start;padding:8px}
#app{width:960px;max-width:100%;position:relative}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#2b4f8f,#1d3a6e);border-radius:14px 14px 0 0;color:#fff}
#ttl{font-size:20px;font-weight:bold;flex:1;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.4)}
#topbar button{background:#ffd34d;border:none;border-radius:10px;padding:6px 14px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit}
#topbar button:active{transform:scale(.94)}
#cv{display:block;width:100%;background:#8ed0f0;border-radius:0 0 14px 14px}
/* ---- 答题浮层 ---- */
#quizWrap{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:560px;max-width:94%;background:linear-gradient(#fffef5,#fff3cf);border:4px solid #ffb63c;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.45);padding:14px 16px;z-index:9;display:none}
#quizWrap.show{display:block;animation:pop .22s}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#qTag{display:inline-block;background:#ff8a3c;color:#fff;font-size:13px;border-radius:8px;padding:2px 10px;margin-bottom:6px}
#qPrompt{font-size:22px;font-weight:bold;color:#3a4a8a;text-align:center;min-height:34px;margin-bottom:8px}
#qBig{font-size:52px;font-weight:900;color:#e2543e;text-align:center;font-family:Georgia,serif;line-height:1.1}
#qPic{text-align:center;margin:4px 0 8px}
#qPic svg{width:150px;height:112px;background:#eaf6ff;border-radius:14px;border:3px solid #bfe3ff}
#qSpeak{text-align:center;margin:4px 0}
#qSpeak button{background:#4db6e2;border:none;color:#fff;font-size:16px;border-radius:10px;padding:6px 18px;cursor:pointer;font-weight:bold;font-family:inherit}
#qOpts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#qOpts button{font-family:inherit;min-width:130px;padding:12px 10px;font-size:21px;font-weight:bold;border-radius:14px;border:3px solid #ffb63c;background:#fff;cursor:pointer;color:#3a4a8a}
#qOpts button .num{color:#ff8a3c;margin-right:6px}
#qOpts button:not(.dead):hover{background:#ffe9b0}
#qOpts button.dead{opacity:.25;text-decoration:line-through;pointer-events:none}
#qHintLine{text-align:center;font-size:14px;color:#8a7a4a;margin-top:8px;min-height:18px}
/* ---- 全屏浮层（菜单/结算） ---- */
#overlay{position:absolute;inset:0;background:rgba(10,26,52,.86);border-radius:0 0 14px 14px;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
#overlay.show{display:flex}
#ovTitle{font-size:40px;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.5);margin-bottom:10px}
#ovText{font-size:19px;line-height:1.9;margin-bottom:18px;max-width:640px}
#ovBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#ovBtns button{font-family:inherit;font-size:20px;font-weight:bold;padding:12px 30px;border:none;border-radius:14px;cursor:pointer;background:linear-gradient(#ffd34d,#ff9d3c);color:#7a3c00;box-shadow:0 4px 0 #c96f12}
#ovBtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #c96f12}
#ovBtns button.blue{background:linear-gradient(#6ec9ff,#3a8fd8);color:#fff;box-shadow:0 4px 0 #1f5e99}
.charCard{width:150px;padding:12px;border-radius:16px;background:#fff;color:#333;cursor:pointer;border:4px solid transparent}
.charCard.sel{border-color:#ffd34d;background:#fff8dc}
.charCard div{font-size:17px;font-weight:bold;margin-top:6px}
.charCard svg{width:96px;height:96px;display:block;margin:0 auto}
</style>
</head>

    <button id="homeBtn">🏠 大厅</button>

    <button id="muteBtn">🔊</button>

    <div id="ovTitle"></div>
    <div id="ovText"></div>
    <div id="ovBtns"></div>

var COLORS=[{w:'red',zh:'红色'},{w:'blue',zh:'蓝色'},{w:'green',zh:'绿色'},{w:'yellow',zh:'黄色'},{w:'orange',zh:'橙色'},{w:'purple',zh:'紫色'}];
var FILLS=[{p:'c _ t',a:'a',zh:'猫 cat'},{p:'d _ g',a:'o',zh:'狗 dog'},{p:'r _ d',a:'e',zh:'红色 red'},{p:'b _ g',a:'a',zh:'书包 bag'},{p:'p _ g',a:'i',zh:'猪 pig'},{p:'s _ n',a:'u',zh:'太阳 sun'},{p:'c _ p',a:'a',zh:'帽子 cap'},{p:'h _ t',a:'a',zh:'帽子 hat'}];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function mkLetterQ(letter,pool){ /* 听发音选字母 */
  var ds=pool.filter(function(c){return c!==letter;});
  ds=shuffle(ds).slice(0,2);ds.push(letter);ds=shuffle(ds);
  return {type:'hear',tag:'听发音',letter:letter,opts:ds,ans:ds.indexOf(letter),speakText:letter};
}
function mkFindQ(letter,pool){ /* 找出字母 */
  var ds=pool.filter(function(c){return c!==letter;});
  ds=shuffle(ds).slice(0,2);ds.push(letter);ds=shuffle(ds);
  return {type:'find',tag:'找字母',letter:letter,opts:ds,ans:ds.indexOf(letter)};
}
function mkCaseQ(letter){ /* 大小写配对 */
  var low=letter.toLowerCase();var others=[low];var conf=CONF[low];if(conf)others.push(conf);
  var pool2='abcdefghijklmnopqrstuvwxyz'.split('').filter(function(c){return c!==low&&c!==conf&&c!==letter.toLowerCase();});
  while(others.length<3){var c=pick(pool2);if(others.indexOf(c)<0)others.push(c);}
  others=shuffle(others);
  return {type:'case',tag:'大小写',letter:letter,opts:others,ans:others.indexOf(low)};
}
function mkCaseLowQ(low){ /* 小写→大写 */
  var up=low.toUpperCase();var others=[up];
  var pool2=LVLS2.filter(function(c){return c!==up;});
  while(others.length<3){var c=pick(pool2);if(others.indexOf(c)<0)others.push(c);}
  others=shuffle(others);
  return {type:'caseUp',tag:'大小写',letter:low,opts:others,ans:others.indexOf(up)};
}
function mkAnimalQ(){var a=pick(ANIMALS);var ds=shuffle(ANIMALS.filter(function(x){return x.w!==a.w;})).slice(0,2);ds.push(a);ds=shuffle(ds);return {type:'pic',tag:'看图选词',pic:a.svg,word:a.w,zh:a.zh,opts:ds.map(function(x){return x.w;}),ans:ds.indexOf(a),speakText:a.w};}
function mkFruitQ(){var a=pick(FRUITS);var ds=shuffle(FRUITS.filter(function(x){return x.w!==a.w;})).slice(0,2);ds.push(a);ds=shuffle(ds);return {type:'pic',tag:'看图选词',pic:a.svg,word:a.w,zh:a.zh,opts:ds.map(function(x){return x.w;}),ans:ds.indexOf(a),speakText:a.w};}
function mkColorQ(){var a=pick(COLORS);var ds=shuffle(COLORS.filter(function(x){return x.w!==a.w;})).slice(0,2);ds.push(a);ds=shuffle(ds);return {type:'color',tag:'颜色单词',color:SWATCH[a.w],zh:a.zh,opts:ds.map(function(x){return x.w;}),ans:ds.indexOf(a),speakText:a.w};}
function mkFillQ(){var a=pick(FILLS);var others='aeiou'.split('').filter(function(c){return c!==a.a;});others=shuffle(others).slice(0,2);others.push(a.a);others=shuffle(others);return {type:'fill',tag:'补全单词',pat:a.p,zh:a.zh,opts:others,ans:others.indexOf(a.a),speakText:a.zh+' '+a.p.replace(/_/g,a.a)};}
function bossQs(li){
  if(li===0){var a=shuffle(LVLS).slice(0,3);return a.map(function(L){return mkLetterQ(L,LVLS);});}
  if(li===1){var a2=shuffle(LVLS2).slice(0,3);return a2.map(function(L){return mkCaseQ(L);});}
  if(li===2){var picked=shuffle(ANIMALS).slice(0,5);return picked.map(function(a3){var ds=shuffle(ANIMALS.filter(function(x){return x.w!==a3.w;})).slice(0,2);ds.push(a3);ds=shuffle(ds);return {type:'pic',tag:'看图选词',pic:a3.svg,word:a3.w,zh:a3.zh,opts:ds.map(function(x){return x.w;}),ans:ds.indexOf(a3),speakText:a3.w};});}
  var qs=shuffle(FRUITS).slice(0,2).map(function(){return mkFruitQ();});
  qs=qs.concat(shuffle(COLORS).slice(0,2).map(function(){return mkColorQ();}));
  qs=qs.concat(shuffle(FILLS).slice(0,2).map(function(){return mkFillQ();}));
  return shuffle(qs);
}

/* ================= 物理 ================= */
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function stepPlayer(dt){
  var p=player;
  var acc=520,maxV=250;
  if(KEYS.left){p.vx-=acc*dt;p.face=-1;}
  if(KEYS.right){p.vx+=acc*dt;p.face=1;}
  if(!KEYS.left&&!KEYS.right)p.vx*=Math.pow(0.0008,dt);
  p.vx=Math.max(-maxV,Math.min(maxV,p.vx));
  if(KEYS.up&&p.onG){p.vy=-(rocketT>0?640:470);p.onG=false;sJump();if(rocketT>0){addFloat(p.x,p.y-20,'🚀 火箭跳!','#ff8a3c');}}
  p.vy+=1350*dt;if(p.vy>620)p.vy=620;
  /* X 步进 */
  p.x+=p.vx*dt;
  p.x=Math.max(0,Math.min(world.w-p.w,p.x));
  var box={x:p.x,y:p.y,w:p.w,h:p.h};
  world.plats.forEach(function(pl){if(pl.one)return;if(aabb(box,pl)){
    if(p.vx>0){p.x=pl.x-p.w;}else if(p.vx<0){p.x=pl.x+pl.w;}
    box.x=p.x;p.vx=0;}});
  /* 门也算墙 */
  var g=world.gate;
  if(!g.open&&aabb({x:p.x,y:p.y,w:p.w,h:p.h},{x:g.x,y:g.y,w:g.w,h:g.h})){
    if(p.vx>0)p.x=g.x-p.w;else if(p.vx<0)p.x=g.x+g.w;
    if(g.cool<=0){openGateQuiz();return;}
    box.x=p.x;
  }
  /* Y 步进 */
  p.y+=p.vy*dt;p.onG=false;
  world.plats.forEach(function(pl){
    if(!aabb({x:p.x,y:p.y,w:p.w,h:p.h},pl))return;
    if(p.vy>=0&&p.y+p.h-p.vy*dt<=pl.y+1){ /* 从上方落下（单向平台也允许） */
      p.y=pl.y-p.h;p.vy=0;p.onG=true;
    }else if(!pl.one){
      if(p.vy<0&&p.y<pl.y){p.y=pl.y+pl.h;p.vy=0;}
      else{p.y=pl.y-p.h;p.vy=0;p.onG=true;}
    }
  });
  if(p.y>H+80){p.y=300;p.x=Math.max(20,p.x-60);p.vy=0;hurt('摔了一跤');} /* 不即死，回弹 */
  p.anim+=dt*Math.abs(p.vx)/60;
  if(p.inv>0)p.inv-=dt;
  if(p.cool>0)p.cool-=dt;
}
function hurt(reason){
  if(player.inv>0)return;
  if(shields>0){shields--;addFloat(player.x,player.y-30,'🛡 盾牌挡住了!','#6ec9ff');sPop();player.inv=1;return;}
  hearts--;player.inv=1.4;sBad();
  addFloat(player.x,player.y-30,'⚠ '+(reason||'小心')+' -1❤','#ff5a6e');
  if(hearts<=0){hearts=0;gameOver();}
}
var hearts=3;

function collectWorld(dt){
  var p=player;
  var box={x:p.x,y:p.y,w:p.w,h:p.h};
  world.gems.forEach(function(gm){if(gm.taken)return;if(aabb(box,{x:gm.x-16,y:gm.y-16,w:32,h:32})){gm.taken=true;score+=10;sGem();addFloat(gm.x,gm.y-24,gm.letter+' +10','#ffd34d');}});
  world.stars.forEach(function(st){if(st.taken)return;if(aabb(box,{x:st.x-16,y:st.y-18,w:32,h:36})){st.taken=true;totalStars++;score+=30;sGood();addFloat(st.x,st.y-24,'⭐ +30','#ffdd55');}});
  world.items.forEach(function(it){if(it.taken)return;if(aabb(box,{x:it.x-15,y:it.y-15,w:30,h:30})){it.taken=true;sPop();
    if(it.type==='hint'){hints++;addFloat(it.x,it.y-24,'💡 提示卡+1','#ffd34d');}
    if(it.type==='shield'){shields++;addFloat(it.x,it.y-24,'🛡 护盾+1','#6ec9ff');}
    if(it.type==='rocket'){rocketT=10;addFloat(it.x,it.y-24,'🚀 火箭鞋 10s!','#ff8a3c');}}});
  world.enemies.forEach(function(e){
    if(!e.alive)return;
    if(e.cool>0){e.cool-=dt;return;}
    if(aabb(box,{x:e.x,y:e.y,w:e.w,h:e.h})&&p.cool<=0){
      openMonsterQuiz(e);
    }
  });
  if(world.portal&&aabb(box,{x:world.portal.x-20,y:world.portal.y-44,w:40,h:88})){levelClear();}
  if(!world.boss.active&&!world.bossDone&&p.x>world.L.bossX){startBoss();}
}

var qWrap=document.getElementById('quizWrap'),qTag=document.getElementById('qTag'),qPrompt=document.getElementById('qPrompt'),qBig=document.getElementById('qBig'),qPic=document.getElementById('qPic'),qSpeak=document.getElementById('qSpeak'),qOpts=document.getElementById('qOpts'),qHintLine=document.getElementById('qHintLine');
function showQuiz(q,ctxType,ctxRef){
  quiz={q:q,ctxType:ctxType,ctxRef:ctxRef,answered:false};
  state='quiz';
  qTag.textContent=q.tag||'题目';
  qBig.textContent='';qPic.innerHTML='';qSpeak.innerHTML='';qHintLine.textContent='';
  if(q.type==='hear'){
    qPrompt.textContent='🔊 听一听，这是哪个字母？';
    if(speakOK){var btn=document.createElement('button');btn.textContent='▶ 再听一遍';btn.onclick=function(){speak(q.speakText);};qSpeak.appendChild(btn);setTimeout(function(){speak(q.speakText);},300);}
    else{qBig.textContent=q.letter;} /* 无语音时直接看字母 */
  }else if(q.type==='find'){
    qPrompt.textContent='找出字母「'+q.letter+'」';
  }else if(q.type==='case'){
    qPrompt.textContent='大写「'+q.letter+'」对应的小写是？';qBig.textContent=q.letter;
  }else if(q.type==='caseUp'){
    qPrompt.textContent='小写「'+q.letter+'」对应的大写是？';qBig.textContent=q.letter;
  }else if(q.type==='pic'){
    qPrompt.textContent='这是什么呀？(它是'+q.zh+')';qPic.innerHTML=q.pic;
    if(speakOK){var b2=document.createElement('button');b2.textContent='🔊 听发音';b2.onclick=function(){speak(q.speakText);};qSpeak.appendChild(b2);}
  }else if(q.type==='color'){
    qPrompt.textContent='「'+q.zh+'」的英文是？';
    var sw=document.createElement('div');sw.style.cssText='width:80px;height:52px;margin:4px auto;border-radius:12px;border:3px solid #ccc;background:'+q.color;qPic.appendChild(sw);
  }else if(q.type==='fill'){
    qPrompt.textContent='补全单词：'+q.zh;qBig.textContent=q.pat;
  }
  qOpts.innerHTML='';
  var usedHint=false;
  q.opts.forEach(function(o,i){
    var b=document.createElement('button');
    b.innerHTML='<span class="num">'+(i+1)+'.</span>'+o;
    b.onclick=function(){answerQ(i);};
    qOpts.appendChild(b);
  });
  if(hints>0){qHintLine.textContent='💡 有提示卡：自动帮你去掉一个错误选项';setTimeout(function(){if(quiz&&!quiz.answered&&hints>0){hints--;useHint();}},700);}
  qWrap.classList.add('show');
}
function useHint(){
  if(!quiz||quiz.answered)return;
  var q=quiz.q,btns=qOpts.children,dead=0;
  var order=[];
  for(var i=0;i<q.opts.length;i++){if(i!==q.ans&&!btns[i].classList.contains('dead'))order.push(i);}
  if(order.length>1){var kill=order[Math.floor(Math.random()*order.length)];btns[kill].classList.add('dead');sPop();qHintLine.textContent='💡 已去掉一个错误答案！';}
}
function answerQ(i){
  if(!quiz||quiz.answered)return;
  quiz.answered=true;
  var ok=(i===quiz.q.ans);
  var btns=qOpts.children;
  for(var k=0;k<btns.length;k++){btns[k].style.pointerEvents='none';if(k===quiz.q.ans){btns[k].style.background='#c8f0c0';btns[k].style.borderColor='#4caf50';}else if(k===i&&!ok){btns[k].style.background='#f8c8c8';btns[k].style.borderColor='#e2543e';}}
  if(ok){
    sGood();score+=25;
    qHintLine.textContent='🎉 太棒了！答对啦！';
    resolveQuiz(true);
  }else{
    sBad();
    qHintLine.textContent=pick(['没关系，再想一想！','加油，你可以的！','差一点点，继续努力！']);
    resolveQuiz(false);
  }
  setTimeout(function(){if(state==='quiz'||quiz){closeQuiz();}},ok?650:1300);
}
function closeQuiz(){
  if(!quiz)return;
  qWrap.classList.remove('show');
  quiz=null;
  if(state==='quiz')state='play';
}
function resolveQuiz(ok){
  var t=quiz.ctxType,r=quiz.ctxRef;
  if(t==='gate'){
    var g=world.gate;
    if(ok){g.open=true;addFloat(g.x,g.y-10,'🚪 门开了!','#ffd34d');}
    else{g.cool=1.6;hurt('答错啦');}
  }else if(t==='monster'){
    if(ok){r.alive=false;score+=40;addFloat(r.x,r.y-10,'击败! +40','#ffd34d');confettiBurst(r.x,r.y,8);}
    else{r.cool=2.2;player.cool=1.2;hurt('答错啦');}
  }else if(t==='boss'){
    var b=world.boss;
    if(ok){
      b.hp--;b.flash=0.5;score+=50;confettiBurst(b.x,b.y-30,10);
      addFloat(b.x,b.y-70,'-1 ❤','#ff5a6e');
      if(b.hp<=0){b.defeated=true;world.bossDone=true;bossDefeated();return;}
    }else{hurt('答错啦');}
  }
}
function openGateQuiz(){var q=genQ();showQuiz(q,'gate',null);}
function openMonsterQuiz(e){player.cool=1;var q=genQ();showQuiz(q,'monster',e);}
function startBoss(){
  var b=world.boss;b.active=true;
  addFloat(b.x,b.y-110,'⚔ '+world.L.bossName+' 出现！答对 '+b.maxHp+' 题打败它！','#ff5a6e');
  sBad();
  b.cool=1.6;
}
function bossDefeated(){
  confettiBurst(world.boss.x,world.boss.y,26);
  score+=200;
  addFloat(world.boss.x,world.boss.y-80,'🎉 Boss 被打败啦！','#ffd34d');
  world.boss.active=false;
  setTimeout(function(){levelClear();},900);
}
function genQ(){
  var li=level;
  if(li===0)return Math.random()<0.5?mkLetterQ(pick(LVLS),LVLS):mkFindQ(pick(LVLS),LVLS);
  if(li===1)return Math.random()<0.6?mkCaseQ(pick(LVLS2)):mkCaseLowQ(pick(LVLS2).toLowerCase());
  if(li===2)return mkAnimalQ();
  var r=Math.random();
  if(r<0.35)return mkFruitQ();if(r<0.7)return mkColorQ();return mkFillQ();
}

    [['再玩一次',startRun],['回到开始',menuScreen]]);
}
function confettiBurst(x,y,n){
  for(var i=0;i<n;i++){confetti.push({x:x,y:y,vx:(Math.random()-0.5)*260,vy:-Math.random()*260-60,c:pick(['#ff8a8a','#ffd34d','#8ae68a','#8ad0ff','#c9a8ff','#fff']),t:1.1});}
}

/* ================= 主循环 ================= */
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  if(!world){ctx.fillStyle='#123059';ctx.fillRect(0,0,W,H);return;}
  world.t=(world.t||0)+dt;
  if(rocketT>0)rocketT=Math.max(0,rocketT-dt);
  if(state==='play'){
    stepPlayer(dt);
    if(state==='play')collectWorld(dt);
    world.enemies.forEach(function(e){
      if(!e.alive)return;
      if(e.kind===1||e.kind===3){e.ph+=0;}else{e.x+=e.dir*e.sp*dt;if(e.x<e.home-70||e.x>e.home+70)e.dir*=-1;}
    });
  }
  world.gate.cool=Math.max(0,(world.gate.cool||0)-dt);
  if(world.boss.flash>0)world.boss.flash-=dt;
  if(world.boss.active&&!quiz){
    world.boss.cool-=dt;
    if(world.boss.cool<=0&&state==='play'){showQuiz(genQ(),'boss',null);world.boss.cool=1.2;}
  }
  /* 相机 */
  camX+=((player.x-380)-camX)*Math.min(1,dt*5);
  camX=Math.max(0,Math.min(world.w-W,camX));
  /* 绘制 */
  drawBG();
  ctx.save();ctx.translate(-camX,0);
  drawGround();
  world.plats.slice(1).forEach(drawPlat);
  /* 装饰 */
  if(world.T.deco==='beach'){drawPalm(180,470);drawPalm(760,470);drawPalm(1500,470);
    ctx.fillStyle='#fff';for(var s=0;s<6;s++){var sx=(s*300+60);ctx.beginPath();ctx.ellipse(sx,492,14,6,0,0,7);ctx.fill();}}
  if(world.T.deco==='forest'){drawTree(120,470,1.2);drawTree(700,470,1);drawTree(1300,470,1.3);drawTree(1860,470,1);}
  if(world.T.deco==='farm'){drawFence(100,470,300);drawFence(1600,470,260);
    ctx.fillStyle='#d8b86a';for(var h2=0;h2<3;h2++){ctx.beginPath();ctx.ellipse(520+h2*460,460,34,22,0,Math.PI,0);ctx.fill();ctx.fillStyle='#c9a45a';}}
  if(world.T.deco==='castle'){ctx.fillStyle='#e8dcff';ctx.fillRect(1770,240,120,230);ctx.fillStyle='#d0bff0';ctx.fillRect(1750,220,30,250);ctx.fillRect(1880,220,30,250);ctx.fillStyle='#b8a0e8';ctx.beginPath();ctx.moveTo(1745,220);ctx.lineTo(1765,170);ctx.lineTo(1785,220);ctx.fill();ctx.beginPath();ctx.moveTo(1875,220);ctx.lineTo(1895,170);ctx.lineTo(1915,220);ctx.fill();ctx.fillStyle='#ffdf8a';ctx.beginPath();ctx.arc(1830,320,16,0,7);ctx.fill();ctx.fillStyle='#8a6ab8';ctx.beginPath();ctx.moveTo(1790,470);ctx.lineTo(1830,420);ctx.lineTo(1870,470);ctx.fill();}
  world.gems.forEach(function(gm){if(!gm.taken)drawGem(gm);});
  world.stars.forEach(function(st){if(!st.taken)drawStar(st);});
  world.items.forEach(function(it){if(!it.taken)drawItem(it);});
  world.enemies.forEach(function(e){if(e.alive)drawEnemy(e);});
  drawGate();
  drawBoss();
  if(world.portal)drawPortal(world.portal);
  if(state!=='menu')drawPlayer();
  /* 飘字 */
  for(var f=floaters.length-1;f>=0;f--){var fl=floaters[f];fl.t-=dt;fl.y-=40*dt;if(fl.t<=0){floaters.splice(f,1);continue;}
    ctx.globalAlpha=Math.min(1,fl.t*2);ctx.fillStyle=fl.c;ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.fillText(fl.txt,fl.x,fl.y);ctx.globalAlpha=1;}
  for(var c=confetti.length-1;c>=0;c--){var cf=confetti[c];cf.t-=dt;cf.vy+=600*dt;cf.x+=cf.vx*dt;cf.y+=cf.vy*dt;if(cf.t<=0){confetti.splice(c,1);continue;}
    ctx.globalAlpha=Math.min(1,cf.t*2);ctx.fillStyle=cf.c;ctx.fillRect(cf.x-3,cf.y-3,6,6);ctx.globalAlpha=1;}
  ctx.restore();
  drawHUD();
  if(state==='play'&&!quiz){
    ctx.fillStyle='rgba(0,0,0,.25)';rr(W/2-150,H-36,300,26,13);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('← → 移动 · ↑ 跳跃 · 碰到门/小怪要答题',W/2,H-18);
  }
}
requestAnimationFrame(frame);
menuScreen();

/* ================= 键盘 ================= */
document.addEventListener('keydown',function(ev){
  var k=ev.key;
  if(state==='quiz'){
    if(quiz&&!quiz.answered){var n=parseInt(k,10);if(n>=1&&n<=3){ev.preventDefault();answerQ(n-1);}}
    return;
  }
  if(k==='ArrowLeft'||k==='a'||k==='A')KEYS.left=true;
  if(k==='ArrowRight'||k==='d'||k==='D')KEYS.right=true;
  if(k==='ArrowUp'||k==='w'||k==='W'||k===' '){KEYS.up=true;ev.preventDefault();}
});
document.addEventListener('keyup',function(ev){
  var k=ev.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')KEYS.left=false;
  if(k==='ArrowRight'||k==='d'||k==='D')KEYS.right=false;
  if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')KEYS.up=false;
});

/* ================= 测试钩子 ================= */
if(window.__TEST__){
  window.__T={
    startRun:function(){charSel=0;startRun();},
    buildLevel:buildLevel,
    answer:function(i){answerQ(i);},
    curQ:function(){return quiz?quiz.q:null;},
    getState:function(){return {state:state,level:level,score:score,stars:totalStars,hearts:hearts,hints:hints,shields:shields,rocketT:rocketT,bossActive:world?world.boss.active:false,bossHp:world?world.boss.hp:0,quiz:quiz?quiz.ctxType:null,gateOpen:world?world.gate.open:false,px:player?Math.round(player.x):0,py:player?Math.round(player.y):0};},
    step:function(){stepPlayer(1/60);collectWorld(1/60);},
    goRight:function(){KEYS.right=true;KEYS.left=false;},
    goLeft:function(){KEYS.left=true;KEYS.right=false;},
    stop:function(){KEYS.left=KEYS.right=false;},
    jump:function(){KEYS.up=true;},
    jumpOff:function(){KEYS.up=false;},
    frame:frame,
    setLevel:function(li){level=li;buildLevel(li);state='play';},
    hurt:hurt,
    toBoss:function(){if(world){player.x=world.L.bossX+10;}},
    closeQuiz:closeQuiz
  };
}
/* 记录敌人初始巡逻基准 */
var __origBuild=buildLevel;
buildLevel=function(li){__origBuild(li);world.enemies.forEach(function(e){e.home=e.x;});};
if(window.__T)window.__T.buildLevel=buildLevel;
})();
</script>
