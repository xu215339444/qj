<style>

  html, body {

  .hud { flex: none; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.65);

  #touchPad { position: absolute; left: 6px; bottom: 6px; z-index: 4; display: none; gap: 6px; }
  #touchPad button { width: 54px; height: 54px; border-radius: 50%; border: none; font-size: 22px; font-weight: 900;

  #touchPad button:active { background: #ffd34d; }
  #touchJump { position: absolute; right: 10px; bottom: 6px; z-index: 4; display: none;

    background: rgba(30,40,90,.5); border-radius: 14px; }
  .overlay.show { display: flex; }
  .panel { background: #fff; border-radius: 22px; padding: 18px 22px; text-align: center; max-width: 92%;

  #qCard .opt .k { position:absolute; left:7px; top:5px; font-size:11px; font-style:normal; opacity:.85;

  .herolist { display:flex; gap:8px; justify-content:center; margin:8px 0; }
  .herobtn { flex:none; border:3px solid #dcd6ee; background:#f6f3ff; border-radius:16px; padding:6px 14px;

<script>
(function(){
'use strict';
/* roundRect 兼容 polyfill：旧内核浏览器无此 API，缺失会导致每帧绘制抛错、角色消失 */
if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (Array.isArray(r)) r = r[0] || 0;
    r = Math.min(Number(r) || 0, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
let muted=false, voiceOn=false, AC=null;
function beep(f,d,type,v){ if(muted) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=f; g.gain.value=v||0.1;
  o.connect(g); g.connect(AC.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d); o.stop(AC.currentTime+d);
}catch(e){} }
function noise(d,vol){ if(muted) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const n=Math.max(1,Math.floor(AC.sampleRate*d)),buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const g=AC.createGain(); g.gain.value=vol||.18;
  s.connect(g); g.connect(AC.destination); s.start();
}catch(e){} }
const S={
  ok(){ beep(880,.09); setTimeout(()=>beep(1320,.12),80); },
  bad(){ beep(200,.2,'sawtooth',.08); },
  jump(){ beep(500,.07,'sine',.05); },
  coin(){ beep(1046,.08); setTimeout(()=>beep(1568,.11),75); },
  frag(){ [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*80)); },
  hurt(){ beep(130,.3,'sawtooth',.16); noise(.16,.14); },
  open(){ beep(392,.13); setTimeout(()=>beep(523,.18),110); },
  buy(){ beep(880,.09); setTimeout(()=>beep(1175,.12),80); },
  hit(){ beep(180,.13,'sawtooth',.1); noise(.1,.08); },
  bossIn(){ [196,233,294,392].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.1),i*150)); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.26),i*120)); }
};
function toggleSnd(){ muted=!muted; $('sndBtn').textContent=muted?'🔇音':'🔊音'; }
function toggleVoice(){ voiceOn=!voiceOn; $('voiceBtn').textContent=voiceOn?'🔊读题':'🔇读题'; try{localStorage.setItem('hzVoice',voiceOn?'1':'0');}catch(e){} }
function goLobby(){ try{ if(window.parent&&window.parent.goHome){ window.parent.goHome(); return; } }catch(e){} location.href='游戏大厅.html'; }
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function speak(txt){
  if(!voiceOn||!txt) return;
  try{
    const u=new SpeechSynthesisUtterance(txt); u.lang='zh-CN'; u.rate=.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
let skinUnlock=false;
try{ skinUnlock=(parseInt(load('hzUnlock','0'),10)||0)>=1; }catch(e){}

/* ==================== 题库 ==================== */

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toQ(level){
  /* 按关卡随机生成一题，返回 {tag,big,sub,icon?,opts,ans,say} */
  const pickBad=(bads,n)=>{
    const got=[], pool=bads.slice();
    for(let i=0;i<n&&pool.length;i++){
      const j=rnd(pool.length);
      if(!got.includes(pool[j])) got.push(pool[j]);
      pool.splice(j,1);
    }
    return got;
  };
  if(level===0){
    const o=pick(POOL.l1);
    const bads=shuffle(POOL.l1.filter(x=>x.z!==o.z)).slice(0,2).map(x=>x.py);
    // 防干扰项重复
    const b=[];
    POOL.l1.forEach(x=>{ if(x.z!==o.z && x.py!==o.py && !b.includes(x.py)) b.push(x.py); });
    while(b.length>2) b.pop();
    const opts=shuffle([o.py].concat(b));
    return {tag:'认字 · 读拼音',big:o.z,sub:'这个字读什么？',opts,ans:opts.indexOf(o.py),say:o.z+'，读什么？'};
  }
  if(level===1){
    if(Math.random()<.55){
      const o=pick(POOL.l2w);
      const opts=shuffle([o.a].concat(pickBad(o.bad,2)));
      return {tag:'补全词语',big:o.q,sub:'选一个字填进去',opts,ans:opts.indexOf(o.a),say:o.q+'，选哪个字？'};
    }
    const o=pick(POOL.l2pic);
    const opts=shuffle([o.w].concat(o.bad));
    return {tag:'看图选词',big:'',sub:'图上画的是什么？',icon:o.s,opts,ans:opts.indexOf(o.w),say:'看图选词'};
  }
  const t=rnd(3);
  if(t===0){
    const o=pick(POOL.l3py);
    const b=[]; POOL.l3py.forEach(x=>{ if(x.z!==o.z&&x.py!==o.py&&!b.includes(x.z)) b.push(x.z); });
    while(b.length>2) b.pop();
    const opts=shuffle([o.z].concat(b));
    return {tag:'看拼音选字',big:o.py,sub:'选汉字',opts,ans:opts.indexOf(o.z),say:o.py+'，选哪个字？'};
  }
  if(t===1){
    const o=pick(POOL.fan);
    const opts=shuffle([o.a].concat(o.bad));
    return {tag:'反义词',big:o.q,sub:'选反义词',opts,ans:opts.indexOf(o.a),say:o.q};
  }
  const o=pick(POOL.sent);
  const opts=shuffle([o.a].concat(o.bad));
  return {tag:'句子填空',big:o.q,sub:'选字填进去',opts,ans:opts.indexOf(o.a),say:o.q+'，选哪个字？'};
}

function resize(){
  const wrap=$('cvwrap');
  const aw=wrap.clientWidth||640, ah=wrap.clientHeight||400;
  const aspect=aw/ah;
  cw = clamp(Math.round(ah*Math.min(2.0,Math.max(.9,aspect))), 640, 1200);
  ch = Math.round(cw/(Math.min(2.0,Math.max(.9,aspect))));
  if(ch>ah){ ch=ah; cw=Math.round(ch*Math.min(2.0,Math.max(.9,aspect))); }
  cv.width=cw; cv.height=ch;
  scaleCss=Math.min(aw/cw, ah/ch);
  cv.style.width=(cw*scaleCss)+'px'; cv.style.height=(ch*scaleCss)+'px';
}

  const plats=L.plats.map(p=>({x:p.x, y:p.y, w:p.w, h:22}));
  const frags=L.frag.map(f=>{
    const onGround = (f[1]>=GY-2);
    const py = onGround? GY-30 : f[1]-30;
    return {x:f[0]-14, y:py, w:28, h:28, taken:false};
  });
  const gates=L.gate.map(g=>({x:g, open:false}));
  const chests=L.chest.map(c=>({x:c-22, y:GY-48, w:44, h:48, opened:false}));
  const enemies=L.en.map((e,i)=>{
    const kind=lv;
    if(kind===2){ // 蝙蝠：空中飞，浮动范围
      return {kind, baseX:e[0], x:e[0], y:GY-130, w:52, h:44, alive:true, t:rnd(10), speed:80};
    }
    if(kind===1){ // 石头人：贴地走
      return {kind, baseX:e[0], x:e[0], y:GY-64, w:60, h:64, alive:true, t:rnd(10), speed:45};
    }
    return {kind, baseX:e[0], x:e[0], y:GY-58, w:54, h:58, alive:true, t:rnd(10), speed:55};
  });

}

/* ==================== 玩家物理 ==================== */
const GRAV=2500, JUMPV=-1080, MV=430, MAXFALL=1600;
function stepPlayer(dt){
  const p=player;
  if(!p) return;
  let mv=0;
  if(KEYS.left||KEYS.a) mv-=1;
  if(KEYS.right||KEYS.d) mv+=1;
  const acc=(p.onGround? 3400: 2200);
  if(mv!==0) p.vx=clamp(p.vx+mv*acc*dt, -MV, MV);
  else p.vx*=Math.pow(0.0004,dt);
  if(p.vx>-.5&&p.vx<.5) p.vx=0;
  if(mv!==0) p.face=mv;
  if(KEYS.up&&p.onGround){ p.vy=JUMPV; p.onGround=false; S.jump(); }
  p.vy=Math.min(MAXFALL,p.vy+GRAV*dt);
  // X
  p.x+=p.vx*dt;
  const solids=[world.ground].concat(world.plats);
  for(const pl of solids){
    if(p.x+p.w<=pl.x||p.x>=pl.x+pl.w) continue;
    const prevB=p.y+p.h-p.vy*dt;
    if(prevB<=pl.y+1 && p.y+p.h>=pl.y){ // 已落上台
      p.y=pl.y-p.h; p.onGround=true; if(p.vy>0) p.vy=0;
    }
  }
  // 平台只能从上面落（单向），再跑一次更稳的落地判定
  let landing=false;
  p.y+=p.vy*dt;
  for(const pl of world.plats.concat([world.ground])){
    if(p.x+p.w<=pl.x||p.x>=pl.x+pl.w) continue;
    const prevB=p.y+p.h-p.vy*dt;
    if(p.vy>=0 && prevB<=pl.y+2 && p.y+p.h>=pl.y){
      p.y=pl.y-p.h; p.vy=0; p.onGround=true; landing=true; break;
    }
    if(p.vy<0 && p.y<=pl.y+pl.h && p.y+p.h>=pl.y){ // 头顶撞平台
      p.y=pl.y+pl.h; p.vy=0;
    }
  }
  if(!landing){
    // 离开平台检测
    let any=false;
    for(const pl of world.plats.concat([world.ground])){
      if(p.y+p.h<=pl.y+2 && p.y+p.h>=pl.y-2 && p.x+p.w>pl.x+2 && p.x<pl.x+pl.w-2){ any=true; break; }
    }
    if(!any) p.onGround=false;
  }
  p.x=clamp(p.x,0,world.L.len-40);
  // 相机
  const target=p.x+p.w/2-cw*.5;
  camX=clamp(target,0,world.L.len-cw);
}

function touchEnemy(){
  const p=player;

    if(!e.alive) continue;
    if(rectHit(p,e) && !lockInput && state==='play'){
      startQuest('enemy', e);
      return;
    }
  }
}
function rectHit(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function touchItems(){
  const p=player;
  for(const f of world.frags){
    if(f.taken) continue;
    if(rectHit(p,f)){ f.taken=true; frags++; S.frag(); pop(f.x+14,f.y+14,'frag'); checkSkin(); renderHUD();
      floats.push({x:f.x+14-camX,y:f.y-10,txt:'🧩+1',t:1,col:'#ffd34d'}); }
  }
  for(const c of world.chests){
    if(c.opened) continue;
    if(rectHit(p,c)){ startQuest('chest', c); return; }
  }
}

/* ==================== 答题流程 ==================== */
function startQuest(type, src){
  if(lockInput) return;
  if(type==='enemy'&&!src.alive) return;
  lockInput=true; running=false; questSrc={type,src};
  const q=toQ(level);
  curQ=q;

}
function showCard(type,q){
  state='quest';
  const tag = type==='enemy'?('📕 '+world.L.name+' · 打败'+'小怪'):
             type==='gate'?'🚪 汉字门 · 答对开门':
             type==='chest'?'🎁 宝箱 · 答对得宝':('👑 '+boss.name);
  $('qTag').textContent=tag;
  const big=$('qBig');
  big.innerHTML='';
  if(q.icon){ const im=document.createElement('img'); im.className='icon';
    /* SVG 作为独立图片加载必须有 xmlns 命名空间，否则破图 */
    const svg = q.icon.includes('xmlns=') ? q.icon : q.icon.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); big.appendChild(im); }
  else big.textContent=q.big;
  $('qSub').textContent=q.sub;
  const box=$('qOpts'); box.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt o'+i;
    b.innerHTML='<i class="k">'+(i+1)+'</i>'+o;
    b.onclick=()=>answerQ(i);
    box.appendChild(b);
  });
  $('qCard').className='';
  $('qHint').textContent='💡 提示'+(hintCards>0?'×'+hintCards:'');
  $('qHint').disabled=hintCards<=0;
  showOv('qOv',true);
  if(voiceOn) setTimeout(()=>speak(q.say||q.big+'，'+(q.sub||'')),150);
}
function answerQ(i){
  if(!curQ||state!=='quest'||!questSrc) return;   // 修复: questSrc 缺失时兜底
  const q=curQ, right=(i===q.ans);
  const box=$('qOpts');
  [...box.children].forEach((b,j)=>{ b.disabled=true; if(j===q.ans) b.style.border='4px solid #7ad46b'; else b.style.opacity=.35; });
  const cardEl=$('qCard');
  if(right){
    cardEl.classList.add('right');
    S.ok();
    const t=questSrc.type, src=questSrc.src;
    if(t==='enemy'){
      src.alive=false; pop(src.x+src.w/2, src.y+src.h/2,'poof');
      const n=doubleT>0?4:2; coins+=n; S.coin();
      floats.push({x:src.x+src.w/2-camX,y:src.y-20,txt:'+'+n+'🪙',t:1,col:'#ffd34d'});
      if(Math.random()<.2){ hintCards++; updateChips(); floats.push({x:src.x+src.w/2-camX,y:src.y-42,txt:'💡+1',t:1.2,col:'#a97fe0'}); }
    } else if(t==='gate'){
      src.open=true; S.open(); coins+=doubleT>0?2:1;
      floats.push({x:src.x-camX,y:300,txt:'门开啦！',t:1,col:'#5fb2f0'});
    } else if(t==='chest'){
      src.opened=true; S.open();
      const n=doubleT>0?6:3; coins+=n; S.coin();
      floats.push({x:src.x+22-camX,y:src.y-10,txt:'+'+n+'🪙',t:1.1,col:'#ffd34d'});
      if(Math.random()<.5){ frags++; pop(src.x+22,src.y-10,'frag'); checkSkin(); floats.push({x:src.x+22-camX,y:src.y-30,txt:'🧩+1',t:1.2,col:'#ffd34d'}); }
    } else if(t==='boss'){
      boss.hp--; S.hit(); pop(boss.x+boss.w/2,boss.y,'hit');
      $('bossHp').style.width=Math.max(0,boss.hp/boss.need*100)+'%';
      if(boss.hp<=0){ bossWin(); return; }
      // 下一题
      curQ=null;
      const q2=toQ(level); curQ=q2; showCard('boss',q2);
      return;
    }
    renderHUD();
    setTimeout(()=>{ closeQ(); },480);
  } else {
    cardEl.classList.add('wrong');
    S.bad(); vibrate(60);
    // 答错处理
    const t=questSrc.type;
    if(t==='boss'){
      if(!hasShield){ hearts--; S.hurt(); vibrate(120); pop(boss.x+boss.w/2,boss.y+30,'fire'); renderHUD();
        if(hearts<=0){ curQ=null; state='over'; running=false; setTimeout(()=>{ showOv('overOv',true); $('bossBar').style.display='none'; },500); return; } }
      else { hasShield=false; updateChips(); toast('🛡 护盾挡住啦'); S.open(); }
      curQ=null;
      const q2=toQ(level); curQ=q2; showCard('boss',q2);
      return;
    }
    if(t==='chest'){ // 宝箱答错不扣血，直接关
      toast('打不开宝箱…再试试别的路');
      setTimeout(()=>{ closeQ(); },700);
      return;
    }
    // enemy/gate 答错扣一颗心并弹开
    loseHeart();
    if(state==='over'){ return; }
    toast('再想想哦～');
    const p=player; p.x-=50; p.vx=-140; if(p.onGround) p.vy=-260;
    curQ=null;
    const q2=toQ(level); curQ=q2; showCard('enemy',q2);
  }
}
function loseHeart(){
  if(hasShield){ hasShield=false; updateChips(); toast('🛡 护盾挡住啦'); S.open(); return; }
  hearts--; renderHUD(); S.hurt(); vibrate(120);
  if(hearts<=0){ state='over'; running=false; showOv('overOv',true); }
}

/* ==================== 特效/渲染辅助 ==================== */
function pop(x,y,kind){
  const cols=['#ffd34d','#ff9a3d','#fff','#ff8fa3','#7ad46b'];
  const n = kind==='boom'?36:(kind==='fire'?18:12);
  for(let i=0;i<n;i++){
    parts.push({x,y,life:.5+rnd(6)/10,vx:(Math.random()-.5)*360,vy:-rnd(300)-60,col:pick(cols)});
  }
}
function toast(t){
  const el=$('toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1600);
}
function showOv(id,on){ $(id).classList.toggle('show',on); }

function updateChips(){
  $('chipHint').textContent='💡提示×'+hintCards;
  $('chipHint').disabled=hintCards<=0;

/* ==================== 绘制 ==================== */
function drawScene(){
  ctx.clearRect(0,0,cw,ch);
  drawSky();
  drawPropsBack();
  drawPlats();
  drawChestsFrags();
  drawGates();
  world.enemies.forEach(e=>{ if(e.alive) drawEnemy(e); });
  drawBossFig();
  drawHeroFig();
  drawParts();
}
function drawSky(){
  const th=level;
  let top,mid,bot;
  if(th===0){ top='#87c7f0'; mid='#c9ecff'; bot='#d9f3c8'; }
  else if(th===1){ top='#a8c8f5'; mid='#ddeeff'; bot='#d8c8e8'; }
  else { top='#1d2350'; mid='#35327a'; bot='#6a4a9a'; }
  const g=ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,top); g.addColorStop(.62,mid); g.addColorStop(1,bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  ctx.save(); ctx.translate(-camX*.35,0);
  if(th===0){
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<14;i++){ const x=(i*230+60)%3600,y=40+(i*37)%120;
      ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.arc(x+22,y+5,14,0,7); ctx.arc(x-20,y+5,14,0,7); ctx.fill(); }
  } else if(th===1){
    ctx.fillStyle='rgba(120,150,200,.45)';
    for(let i=0;i<6;i++){ const x=i*560-120; ctx.beginPath();
      ctx.moveTo(x,ch); ctx.lineTo(x+260,ch-240); ctx.lineTo(x+560,ch); ctx.fill(); }
  } else {
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<70;i++){ const x=(i*173)%4000, y=(i*97)%250; ctx.fillRect(x,y,2,2); }
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(0,0,cw,ch);
  }
  ctx.restore();
  if(th===2){
    ctx.fillStyle='rgba(20,16,60,.5)';
    for(let i=0;i<7;i++){ const x=i*480-140-camX*.4;
      ctx.fillRect(x,ch-230,120,230); ctx.fillRect(x+26,ch-290,68,60); }
  }
}
function drawPropsBack(){

  ctx.save(); ctx.translate(-camX*.7,0);

    for(let i=0;i<10;i++){ const x=i*300+60,y=GY;
      if(x<camX-300||x>camX+cw+300) continue;
      ctx.fillStyle='#7a5230'; ctx.fillRect(x+16,y-60,12,60);
      ctx.fillStyle='#4f9e58'; ctx.beginPath(); ctx.arc(x+22,y-84,34,0,7); ctx.fill();

    for(let i=0;i<16;i++){ const x=i*220+30,y=GY;
      if(x<camX-220||x>camX+cw+220) continue;
      ctx.fillStyle='rgba(120,110,140,.55)'; ctx.beginPath();

function drawPlats(){
  const th=level;
  const topCol=['#5fa852','#9a6a48','#7a7090'][th];
  const bodyCol=['#79c06e','#b98a5c','#6e6690'][th];
  ctx.save(); ctx.translate(-camX,0);
  // 地面
  const gd=world.ground;
  ctx.fillStyle=bodyCol; ctx.fillRect(gd.x,gd.y,gd.w,gd.h);
  ctx.fillStyle=topCol; ctx.fillRect(gd.x,gd.y,gd.w,16);
  if(th===0){ ctx.fillStyle='#4f9e58';
    for(let x=Math.max(0,camX);x<Math.min(gd.x+gd.w,camX+cw);x+=22){ ctx.beginPath();
      ctx.moveTo(x,gd.y); ctx.lineTo(x+6,gd.y-9); ctx.lineTo(x+12,gd.y); ctx.fill(); } }
  else if(th===2){ ctx.strokeStyle='rgba(0,0,0,.14)'; ctx.lineWidth=1;
    for(let x=Math.max(0,camX);x<Math.min(gd.x+gd.w,camX+cw);x+=26){ ctx.beginPath(); ctx.moveTo(x,gd.y); ctx.lineTo(x,gd.y+14); ctx.stroke(); } }
  // 悬浮台
  for(const pl of world.plats){
    if(pl.x+pl.w<camX||pl.x>camX+cw) continue;
    ctx.fillStyle=bodyCol; ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    ctx.fillStyle=topCol; ctx.fillRect(pl.x,pl.y,pl.w,8);
  }
  ctx.restore();
}
function drawChestsFrags(){
  ctx.save(); ctx.translate(-camX,0);
  for(const c of world.chests){
    if(c.opened) continue;
    if(c.x+c.w<camX||c.x>camX+cw) continue;
    ctx.fillStyle='#9a5a28'; ctx.fillRect(c.x+2,c.y+16,c.w-4,30); // 箱体
    ctx.fillStyle='#c98a3f'; ctx.fillRect(c.x,c.y+8,c.w,14);      // 盖
    ctx.fillStyle='#ffd34d'; ctx.fillRect(c.x+c.w/2-3,c.y+4,6,34); // 锁
    ctx.strokeStyle='#7a4a20'; ctx.lineWidth=2; ctx.strokeRect(c.x,c.y+8,c.w,38);
  }
  for(const f of world.frags){
    if(f.taken) continue;
    if(f.x+f.w<camX||f.x>camX+cw) continue;
    const tw=Math.sin(Date.now()/360+f.x)*.15;
    ctx.save(); ctx.translate(f.x+f.w/2,f.y+f.h/2);
    ctx.rotate(tw);
    ctx.fillStyle='#ffd34d'; ctx.beginPath();
    ctx.moveTo(0,-11); ctx.lineTo(8,-5); ctx.lineTo(0,-1); ctx.lineTo(-8,-5); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('字',0,-4);
    ctx.restore();
  }
  ctx.restore();
}
function drawGates(){
  ctx.save(); ctx.translate(-camX,0);
  for(const g of world.gates){
    if(g.x<camX-100||g.x>camX+cw+100) continue;
    const x=g.x,y=GY;
    if(g.open){
      ctx.globalAlpha=.5;
      ctx.fillStyle='#8a5a2f'; ctx.fillRect(x-26,y-170,52,170);
      ctx.globalAlpha=1;
      ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
      ctx.fillText('已开门',x,y-60);
      continue;
    }
    ctx.fillStyle='#7a5230'; ctx.fillRect(x-6,y-176,12,176);   // 侧柱

    ctx.fillStyle='#b98a5c'; ctx.fillRect(x-40,y-200,90,24);   // 门楣
    ctx.fillStyle='#5a3a20'; ctx.fillRect(x-26,y-176,50,176);  // 门板

}

function drawHeroFig(){
  const p=player; if(!p) return;
  const hx=p.x+p.w/2-camX, hy=p.y+p.h;
  if(p.hurtT>0 && Math.floor(p.hurtT*14)%2===0) return; // 受伤闪烁
  ctx.save(); ctx.translate(hx,hy);
  if(p.face<0) ctx.scale(-1,1);
  const isN=heroSel==='nz';
  const body=isN?'#ff6a6a':'#ffd34d';
  const legSwing= p.onGround? Math.sin(p.anim*10)*3 : 4;
  // 脚
  ctx.fillStyle='#3a4a8a';
  ctx.fillRect(-14,legSwing-2,8,16-legSwing);
  ctx.fillRect(6,-legSwing-2,8,16+legSwing);
  // 身体
  ctx.fillStyle=body; ctx.beginPath(); ctx.roundRect(-15,-56,30,40,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(-12,-52,8,30);
  // 尾巴/披风
  if(isN){ ctx.fillStyle='#e8443a'; ctx.beginPath(); ctx.moveTo(15,-40); ctx.lineTo(34,-28); ctx.lineTo(15,-16); ctx.closePath(); ctx.fill(); }
  else { ctx.fillStyle='#d33'; ctx.fillRect(6,-74,4,40); }
  // 头
  ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(0,-64,13,0,7); ctx.fill();
  // 眼
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(5,-66,2.6,0,7); ctx.fill();

    ctx.fillStyle='#e8443a'; ctx.beginPath(); ctx.arc(0,-80,7,0,7); ctx.fill();

  }
  ctx.restore();
}
function drawParts(){
  parts.forEach(pr=>{
    const x=pr.x-camX;
    ctx.globalAlpha=Math.min(1,pr.life*2);
    ctx.fillStyle=pr.col; ctx.beginPath(); ctx.arc(x,pr.y,4,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
  floats.forEach(f=>{
    if(f.t<=0) return;
    ctx.globalAlpha=Math.min(1,f.t*2);
    ctx.font='bold 17px sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillText(f.txt,f.x+1.2,f.y+1.2);
    ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.globalAlpha=1;
}

/* ==================== 主循环 ==================== */
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastT) lastT=ts;
  const dt=Math.min(.033,(ts-lastT)/1000); lastT=ts;
  if(!world){ if(state==='menu') drawLogo(); return; }
  // 特效总是在动
  parts.forEach(pr=>{ pr.life-=dt; pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.vy+=700*dt; });
  parts=parts.filter(pr=>pr.life>0);
  floats.forEach(f=>{ f.t-=dt; f.y-=34*dt; });
  floats=floats.filter(f=>f.t>0);
  if(player){ player.anim+=dt; if(player.hurtT>0) player.hurtT-=dt; }
  if(state==='play'&&!lockInput&&running){
    stepPlayer(dt);
    // 敌人动
    world.enemies.forEach(e=>{
      if(!e.alive) return;
      if(e.kind===2){ e.t+=dt; e.x=e.baseX+Math.sin(e.t*1.3)*130; }
      else { e.t+=dt; const dir=e.baseX>camX+ (e.x>=e.baseX)?1:-1;
        e.x+=e.speed*dir*dt;
        if(Math.abs(e.x-e.baseX)>150) e.speed*=-1;
      }
    });
    touchEnemy();
    touchItems();
    // 门检测：撞到未开的门 → 答题
    const p=player;
    for(const g of world.gates){
      if(g.open) continue;
      if(p.x+p.w>=g.x-4 && p.x<=g.x+26 && state==='play'&&!lockInput){
        startQuest('gate', g); break;
      }
    }
    if(!lockInput && state==='play'){
      const bx=world.L.boss;
      if(p.x+p.w>=bx-10) startBoss();
    }
  }
  if(state==='play'&&doubleT>0){ doubleT-=dt; if(doubleT<=0){ doubleT=0; updateChips(); } }
  drawScene();
}
function drawLogo(){
  ctx.clearRect(0,0,cw,ch);
  const g=ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#87c7f0'); g.addColorStop(1,'#d9f3c8');
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='rgba(90,70,140,.85)';
  ctx.textAlign='center';
  ctx.font='900 '+Math.min(42,ch*.12)+'px "PingFang SC",sans-serif';
  ctx.fillText('🐒 汉字勇士大闯关',cw/2,ch*.42);
  ctx.font='700 '+Math.min(20,ch*.06)+'px "PingFang SC",sans-serif';
  ctx.fillText('识字 · 拼词 · 拼音 · 冒险',cw/2,ch*.55);
}

/* ==================== 输入 ==================== */
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A') KEYS.left=true;
  else if(k==='ArrowRight'||k==='d'||k==='D') KEYS.right=true;
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ') KEYS.up=true;
  else if(k==='1'&&state==='quest') answerQ(0);
  else if(k==='2'&&state==='quest') answerQ(1);
  else if(k==='3'&&state==='quest') answerQ(2);
  if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(k)) e.preventDefault();
});
document.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A') KEYS.left=false;
  else if(k==='ArrowRight'||k==='d'||k==='D') KEYS.right=false;
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ') KEYS.up=false;
});
function bindTouch(id,key){
  const el=$(id);
  const dn=ev=>{ KEYS[key]=true; ev.preventDefault(); };
  const up=()=>{ KEYS[key]=false; };
  el.addEventListener('pointerdown',dn);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
}
bindTouch('btnL','left'); bindTouch('btnR','right'); bindTouch('touchJump','up');

function heroMini(who){
  const s=who==='wk'?
    '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#ffd9b3"/><path d="M6 26a15 15 0 0 1 28 0z" fill="#ffd34d"/><circle cx="15" cy="18" r="2.6" fill="#333"/><circle cx="25" cy="18" r="2.6" fill="#333"/><path d="M15 27q5 4 10 0" stroke="#c96a55" stroke-width="2" fill="none"/><path d="M20 26l5-2v4z" fill="#333"/></svg>':
    '<svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="13" fill="#ffd9b3"/><circle cx="15" cy="20" r="2.6" fill="#333"/><circle cx="25" cy="20" r="2.6" fill="#333"/><path d="M15 28q5 4 10 0" stroke="#c96a55" stroke-width="2" fill="none"/><path d="M6 26a14 14 0 0 0 28 0z" fill="#ff6a6a"/><circle cx="20" cy="4" r="4" fill="#ffd9b3"/><path d="M15 5q5-6 10 0" stroke="#ff5f7a" stroke-width="2" fill="none"/><rect x="8" y="26" width="24" height="6" rx="3" fill="#e8443a" transform="rotate(-8 20 29)"/></svg>';
  return '<div style="width:60px;height:60px;margin:auto">'+s+'</div>';
}
function renderHeroList(){
  const hl=$('heroList'); hl.innerHTML='';
  const list=[['wk','悟空','汉字勇士'],['nz','哪吒', skinUnlock?'已解锁':'需5🧩']];
  list.forEach(o=>{
    const b=document.createElement('button');
    b.className='herobtn'+(heroSel===o[0]?' cur':'')+(o[1]==='哪吒'&&!skinUnlock?' lock':'');
    b.innerHTML=heroMini(o[0])+'<b>'+o[1]+'</b><span>'+o[2]+'</span>';
    b.onclick=()=>{ if(o[0]==='nz'&&!skinUnlock){ toast('集齐 5 个🧩碎片解锁哪吒！'); return; } heroSel=o[0]; renderHeroList(); };
    hl.appendChild(b);
  });
}
function startRun(){
  showOv('menuOv',false);
  level=0; hearts=3; coins=0; frags=0; hintCards=0; hasShield=false; doubleT=0;
  updateChips();
  beginLevel();
}
function beginLevel(){
  world=buildWorld(level);
  player={x:60,y:GY-80,w:40,h:56,vx:0,vy:0,onGround:false,face:1,anim:0,hurtT:0};
  camX=0; lockInput=false; running=true; boss=null; curQ=null;
  $('bossBar').style.display='none';
  showOv('overOv',false); showOv('clearOv',false); showOv('qOv',false); showOv('winOv',false);
  state='play'; lastT=0;
  renderHUD();
  toast('📕 '+LEVELS[level].name+'！'+'答对题开门打怪，收齐🧩碎片！');
  if(level===0) setTimeout(()=>{ if(state==='play') toast('← → 移动，⬆ 跳，碰到小怪答题'); },1400);
}
function levelNext(){
  showOv('clearOv',false);
  if(level<2){ level++; hearts=3; renderHUD(); beginLevel(); }
  else { finishGame(); }
}
function finishGame(){
  state='win'; running=false;
  $('winInfo').textContent='你打败了三位大王，真勇敢！';
  $('winFrag').textContent='🧩 碎片 '+frags+' /15'+(frags>=5?'（🎉 哪吒已解锁！）':'（集齐5🧩解锁哪吒）');
  if(frags>=5){ skinUnlock=true; store('hzUnlock','1'); }
  S.win();
  showOv('winOv',true);
}
function retryLevel(){ showOv('overOv',false); hearts=3; renderHUD(); beginLevel(); }

/* ==================== 初始化 ==================== */
function init(){
  renderHeroList();
  try{ voiceOn=load('hzVoice','1')==='1'; $('voiceBtn').textContent=voiceOn?'🔊读题':'🔇读题'; }catch(e){}
  $('sndBtn').onclick=toggleSnd;
  $('voiceBtn').onclick=toggleVoice;
  $('backBtn').onclick=goLobby;
  $('backBtn2').onclick=goLobby;
  $('startBtn').onclick=startRun;
  $('retryBtn').onclick=retryLevel;
  $('againBtn').onclick=()=>{ showOv('winOv',false); startRun(); };
  $('winBack').onclick=goLobby;
  $('overBack').onclick=goLobby;
  $('clearBack').onclick=goLobby;
  $('nextBtn').onclick=levelNext;
  $('qHint').onclick=()=>{
    if(!curQ||hintCards<=0||state!=='quest') return;
    hintCards--; updateChips();
    const bads=[0,1,2].filter(i=>i!==curQ.ans);
    const rm=bads[rnd(bads.length)];
    const kids=$('qOpts').children;
    kids[rm].disabled=true; kids[rm].style.opacity=.25;
    $('qHint').disabled=hintCards<=0; $('qHint').textContent='💡 提示×'+hintCards;
    S.open();
  };
  $('qVoice').onclick=()=>{ if(curQ) speak(curQ.say||curQ.big); };
  $('chipHint').onclick=()=>{ if(hintCards>0) toast('💡 答题时按“提示”按钮使用'); };
  $('chipShield').onclick=()=>{ toast(hasShield?'🛡 护盾已就位':'🛡 暂无护盾，去小卖部买一个'); };
  $('chipDouble').onclick=()=>{ if(coins>=2&&doubleT<=0){ coins-=2; doubleT=10; S.buy(); renderHUD(); updateChips(); toast('💰 10秒双倍金币！'); } else if(doubleT>0) toast('已经生效中'); else toast('金币不够(需2)'); };
  // 测试钩子
  if(window.__TEST__){
    window.__T={startRun,beginLevel,answerQ,startQuest,toQ,buildWorld,getState:()=>({state,world,player,hearts,coins,frags,hintCards,hasShield,boss,level}),
      key:(k,v)=>{KEYS[k]=v;}, goRight:()=>{KEYS.right=true;KEYS.left=false;}, stop:()=>{KEYS.right=false;KEYS.left=false;KEYS.up=false;}, jump:()=>KEYS.up=true, jumpOff:()=>KEYS.up=false,
      answer:(i)=>answerQ(i), curQ:()=>curQ, move:()=>stepPlayer(1/60), step:()=>frame2(1/60), resize, levelClear, finishGame};
    // 供测试逐帧
    window.__T.frame=()=>{ const dt=1/60; if(state==='play'&&!lockInput&&running){ stepPlayer(dt); } };
  }
  resize();
  requestAnimationFrame(frame);
}
function frame2(dt){ if(state==='play'&&!lockInput&&running){ stepPlayer(dt); } }

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
</body>
</html>
