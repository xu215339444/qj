  var a = seed >>> 0;

];

/* ================= 迷宫生成 ================= */
function genMaze(seed, w, h, braid) {
  var R = mulberry32(seed);
  var m = [];
  for (var y = 0; y < h; y++) {
    m[y] = [];
    for (var x = 0; x < w; x++) m[y][x] = { N: 1, E: 1, S: 1, W: 1, vis: 0 };
  }
  var stack = [[0, 0]]; m[0][0].vis = 1;
  var dirs = [[0, -1, 'N', 'S'], [1, 0, 'E', 'W'], [0, 1, 'S', 'N'], [-1, 0, 'W', 'E']];
  while (stack.length) {
    var cur = stack[stack.length - 1], cx = cur[0], cy = cur[1], opts = [];
    for (var i = 0; i < 4; i++) {
      var d = dirs[i], nx = cx + d[0], ny = cy + d[1];
      if (nx >= 0 && ny >= 0 && nx < w && ny < h && !m[ny][nx].vis) opts.push(i);
    }
    if (!opts.length) { stack.pop(); continue; }
    var di = opts[Math.floor(R() * opts.length)], d2 = dirs[di];
    var nx2 = cx + d2[0], ny2 = cy + d2[1];
    m[cy][cx][d2[2]] = 0;
    m[ny2][nx2][d2[3]] = 0;
    m[ny2][nx2].vis = 1;
    stack.push([nx2, ny2]);
  }
  var count = Math.round(w * h * braid);
  for (var b = 0; b < count; b++) {
    var bx = Math.floor(R() * w), by = Math.floor(R() * h);
    var v = Math.floor(R() * 4), dd = dirs[v];
    var nx3 = bx + dd[0], ny3 = by + dd[1];
    if (nx3 >= 0 && ny3 >= 0 && nx3 < w && ny3 < h && m[by][bx][dd[2]]) {
      m[by][bx][dd[2]] = 0;
      m[ny3][nx3][dd[3]] = 0;
    }
  }
  return m;
}

/* ================= BFS 寻路（含传送门边） ================= */
function neighStatic(x, y) {
  var out = [];
  if (y > 0 && !maze[y][x].N) out.push([x, y - 1, 0]);
  if (x < mw - 1 && !maze[y][x].E) out.push([x + 1, y, 0]);
  if (y < mh - 1 && !maze[y][x].S) out.push([x, y + 1, 0]);
  if (x > 0 && !maze[y][x].W) out.push([x - 1, y, 0]);
  // 传送门：踩上传送格立即到伙伴格
  for (var p = 0; p < portals.length; p++) {
    if (portals[p].a[0] === x && portals[p].a[1] === y) { out.push([portals[p].b[0], portals[p].b[1], 1]); break; }
    if (portals[p].b[0] === x && portals[p].b[1] === y) { out.push([portals[p].a[0], portals[p].a[1], 1]); break; }
  }
  return out;
}
function bfsStatic(sx, sy, ignorePortal) {
  var d = [], par = [];
  for (var y = 0; y < mh; y++) { d[y] = []; par[y] = []; for (var x = 0; x < mw; x++) { d[y][x] = -1; par[y][x] = null; } }
  var q = [[sx, sy]]; d[sy][sx] = 0;
  for (var qi = 0; qi < q.length; qi++) {
    var c = q[qi], cx = c[0], cy = c[1];
    var ns = neighStatic(cx, cy);
    for (var i = 0; i < ns.length; i++) {
      var nx = ns[i][0], ny = ns[i][1];
      if (ignorePortal && ns[i][2]) continue;
      if (d[ny][nx] < 0) {
        d[ny][nx] = d[cy][cx] + 1;
        par[ny][nx] = [cx, cy];
        q.push([nx, ny]);
      }
    }
  }
  return { d: d, par: par };
}
function pathTo(sx, sy, gx, gy) {
  var r = bfsStatic(sx, sy, false);
  if (r.d[gy][gx] < 0) return null;
  var path = [], x = gx, y = gy;
  while (x !== sx || y !== sy) {
    path.push([x, y]);
    var pr = r.par[y][x];
    if (!pr) break;
    x = pr[0]; y = pr[1];
  }
  path.push([sx, sy]);
  return path.reverse();
}
function mainPathCells() {
  var s = {};
  var p = pathTo(0, 0, mw - 1, mh - 1);
  if (p) for (var i = 0; i < p.length; i++) s[p[i][0] + ',' + p[i][1]] = 1;
  return s;
}
function dirFrom(a, b) {
  if (b[0] === a[0] + 1) return 'right';
  if (b[0] === a[0] - 1) return 'left';
  if (b[1] === a[1] + 1) return 'down';
  if (b[1] === a[1] - 1) return 'up';
  return null;
}
function portalPartner(x, y) {
  for (var p = 0; p < portals.length; p++) {
    if (portals[p].a[0] === x && portals[p].a[1] === y) return portals[p].b;
    if (portals[p].b[0] === x && portals[p].b[1] === y) return portals[p].a;
  }
  return null;
}

/* ================= 本关布置 ================= */
function isFreeCell(x, y, occ) {
  if (x === 0 && y === 0) return false;
  if (x === mw - 1 && y === mh - 1) return false;
  if (occ[x + ',' + y]) return false;
  if (maze[y][x].N + maze[y][x].E + maze[y][x].S + maze[y][x].W === 4) return false; // 不放进死墙角
  return true;
}
function randFreeCells(R, n, occ, pathSet, wantAway) {
  var cells = [], tries = 0;
  while (cells.length < n && tries < 400) {
    tries++;
    var x = Math.floor(R() * mw), y = Math.floor(R() * mh);
    if (!isFreeCell(x, y, occ)) continue;
    if (pathSet && pathSet[x + ',' + y]) {
      if (wantAway) continue;                 // 想放"岔路深处"
      // 放主线附近也可，但别放起点出口紧邻

/* ================= 主循环 ================= */
function update(dt) {
  tick++;
  if (msgT > 0) msgT -= dt;
  if (hintOn > 0) hintOn -= dt;
  if (stuckT > 0) stuckT -= dt;
  if (state === 'play') {
    // 计时
    if (!timeOut) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0; timeOut = true;
        showMsg('⏰ 时间到！慢慢走也能到出口', '#ffb0b0');
      } else if (timeLeft < 15 && !timeWarned) {
        timeWarned = true;
        showMsg('还剩 15 秒！', '#ffb0b0');
      }
    }
    // 每帧刷新倒计时显示
    var _tv = fmtTime(timeLeft);
    if ($('tmTxt').textContent !== _tv) $('tmTxt').textContent = _tv;
    updateMvWalls(dt);
    if (moving) {
      moveT += dt / 0.15;
      if (moveT >= 1) { moveT = 1; moving = false; arrive(); }
      walkPhase += dt * 11;
    } else if (slidePending && !stuckT) {
      slideT -= dt;
      if (slideT <= 0) {
        var dir = slidePending; slidePending = null;
        var blk = blockedEdge(px, py, dir);
        if (!blk) { tx = px + (dir === 'left' ? -1 : dir === 'right' ? 1 : 0); ty = py + (dir === 'up' ? -1 : dir === 'down' ? 1 : 0); moving = true; moveT = 0; sfxStep(); }
      }
    }
  }
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.y -= 26 * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (var j = confetti.length - 1; j >= 0; j--) {
    var cf = confetti[j];
    cf.x += cf.vx * dt; cf.y += cf.vy * dt; cf.vy += 300 * dt; cf.rot += cf.spin * dt; cf.life -= dt;
    if (cf.life <= 0) confetti.splice(j, 1);
  }
}
function lerpP(a, b, t) { return a + (b - a) * t; }
function playerX() { return lerpP(px, tx, moveT) * CS + OX + CS / 2; }
function playerY() { return lerpP(py, ty, moveT) * CS + OY + CS / 2; }

/* ================= 绘制 ================= */
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function cellVis(x, y) {
  // 返回 0 隐藏 / 1 已探索(暗) / 2 当前可见
  var L = LEVELS[level];
  if (mapRevealed || !L.dark) return 2;
  if (Math.abs(x - px) <= 2 && Math.abs(y - py) <= 2) return 2;
  return explored[y] && explored[y][x] ? 1 : 0;
}
function drawFloor() {
  var L = LEVELS[level];
  var bg = theme.bg;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, bg[0]); g.addColorStop(1, bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 主题装饰斜纹
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1;
  for (var sx2 = -40; sx2 < W; sx2 += 40) { ctx.beginPath(); ctx.moveTo(sx2, 0); ctx.lineTo(sx2 + 14, H); ctx.stroke(); }
  // 地板
  for (var y = 0; y < mh; y++) {
    for (var x = 0; x < mw; x++) {
      var vis = cellVis(x, y);
      if (vis === 0) continue;
      var x0 = OX + x * CS, y0 = OY + y * CS;
      ctx.save();
      ctx.globalAlpha = vis === 1 ? 0.16 : 1;
      ctx.fillStyle = theme.floor;
      roundRectPath(x0 + 1, y0 + 1, CS - 2, CS - 2, 4); ctx.fill();
      if ((x + y) % 2 === 0) {
        ctx.fillStyle = theme.fl2;
        roundRectPath(x0 + 2, y0 + 2, CS - 4, CS - 4, 3); ctx.fill();
      }
      ctx.restore();
    }
  }
}
function isEdgeBetween(x1, y1, x2, y2, ex, ey) {
  // 判断指定格(ey=出口侧已不必) 简化：由调用方直接比较
  return (x1 === ex && y1 === ey) || (x2 === ex && y2 === ey);
}
function drawWalls() {
  var t = Math.max(4, CS * 0.17);
  function wall(x, y, w, h, dark) {
    ctx.save();
    ctx.globalAlpha = dark ? 0.18 : 1;
    ctx.fillStyle = theme.wall;
    roundRectPath(x, y, w, h, Math.min(w, h) * 0.5); ctx.fill();
    ctx.fillStyle = theme.wallTop;
    roundRectPath(x, y, w, h * 0.4, Math.min(w, h) * 0.5); ctx.fill();
    ctx.restore();
  }
  // 外框
  for (var y = 0; y < mh; y++) {
    for (var x = 0; x < mw; x++) {
      var c = maze[y][x];
      var vv = cellVis(x, y);
      var dark = vv === 1;
      if (vv === 0) continue;
      var x0 = OX + x * CS, y0 = OY + y * CS;
      if (c.N && y === 0) wall(x0 - 2, y0 - t / 2, CS + 4, t, dark);
      if (c.E && x === mw - 1) wall(x0 + CS - t / 2, y0 - 2, t, CS + 4, dark);
      if (c.S && y === mh - 1) wall(x0 - 2, y0 + CS - t / 2, CS + 4, t, dark);
      if (c.W && x === 0) wall(x0 - t / 2, y0 - 2, t, CS + 4, dark);
    }
  }
  // 内部墙（每格画 E/S，避免重复）
  for (var y2 = 0; y2 < mh; y2++) {
    for (var x2 = 0; x2 < mw; x2++) {
      var c2 = maze[y2][x2];
      var v1 = cellVis(x2, y2);
      var x0 = OX + x2 * CS, y0 = OY + y2 * CS;
      if (c2.E && x2 < mw - 1) {
        var v2 = cellVis(x2 + 1, y2);
        if (v1 || v2) wall(x0 + CS - t / 2, y0 - 2, t, CS + 4, (v1 === 1 || v2 === 1));
      }
      if (c2.S && y2 < mh - 1) {
        var v3 = cellVis(x2, y2 + 1);

    }
  }
}

function drawPortal(cell, hue) {

function drawDoorEdge(x1, y1, x2, y2, open, kind) {

  var px0 = OX + cx * CS + CS / 2, py0 = OY + cy * CS + CS / 2;
  var horiz = y1 === y2;      // 门是竖直方向的横隔（连接左右格）

  if (chest.open) {
    ctx.rotate(-0.25);
    ctx.fillStyle = '#c98a3f';
    roundRectPath(-s, -s * 1.2, s * 2, s * 0.5, 3); ctx.fill();
    ctx.restore(); ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#a06a2c';
    ctx.strokeStyle = '#5f3a1e'; ctx.lineWidth = 2;
    roundRectPath(-s, -s * 0.7, s * 2, s * 1.4, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffca28';
    ctx.font = '900 ' + Math.round(s * 0.7) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 0);
    ctx.textBaseline = 'alphabetic';
  } else {
    ctx.fillStyle = '#a06a2c';
    ctx.strokeStyle = '#5f3a1e'; ctx.lineWidth = 2;
    roundRectPath(-s, -s * 0.7, s * 2, s * 1.4, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c98a3f';
    roundRectPath(-s, -s * 0.9, s * 2, s * 0.5, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd34d';
    roundRectPath(-s * 0.22, -s * 0.18, s * 0.44, s * 0.36, 3); ctx.fill();
  }
  ctx.restore();
}
function drawGuideArrows() {
  if (!hintOn) return;
  var from = { x: px, y: py };
  var route = pathTo(px, py, mw - 1, mh - 1);
  if (!route || route.length < 2) return;
  // 终点前需钥匙时先引导拿钥匙
  var need = keyCells.length ? keyCells[0] : null;
  var target = (need && keysGot < keyTotal) ? need : [mw - 1, mh - 1];
  route = pathTo(px, py, target[0], target[1]);
  if (!route) return;
  ctx.save();
  ctx.globalAlpha = clamp(hintOn, 0, 1) * 0.5;
  ctx.strokeStyle = '#ffe28a'; ctx.lineWidth = CS * 0.15;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(playerX(), playerY());
  for (var i = 1; i < route.length; i++) {
    var jump = false;
    var pp = portalPartner(route[i][0], route[i][1]);
    if (pp && route[i - 1] && (pp[0] !== route[i - 1][0] || pp[1] !== route[i - 1][1])) jump = true;
    ctx.lineTo(OX + route[i][0] * CS + CS / 2, OY + route[i][1] * CS + CS / 2);
    if (jump && route[i + 1]) {
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(OX + route[i][0] * CS + CS / 2, OY + route[i][1] * CS + CS / 2);
    }
  }
  ctx.stroke();
  ctx.restore();
}
function drawPlayer() {
  var x = playerX(), y = playerY();
  var s = CS * 0.72;
  var bob = moving ? Math.abs(Math.sin(walkPhase)) * CS * 0.07 : 0;
  var L = LEVELS[level];
  ctx.save();
  ctx.translate(x, y - bob);
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.beginPath(); ctx.ellipse(0, s * 0.46, s * 0.3, s * 0.09, 0, 0, 7); ctx.fill();
  // 腿
  var legSwing = moving ? Math.sin(walkPhase) * s * 0.16 : 0;
  ctx.strokeStyle = '#4a5f8a'; ctx.lineWidth = s * 0.12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s * 0.1, s * 0.3); ctx.lineTo(-s * 0.1 + legSwing, s * 0.48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s * 0.1, s * 0.3); ctx.lineTo(s * 0.1 - legSwing, s * 0.48); ctx.stroke();
  // 身体
  ctx.fillStyle = '#ffd34d';
  roundRectPath(-s * 0.3, -s * 0.2, s * 0.6, s * 0.55, s * 0.1); ctx.fill();
  // 头
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath(); ctx.arc(0, -s * 0.42, s * 0.3, 0, 7); ctx.fill();
  // 探险帽
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -s * 0.52, s * 0.32, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
  ctx.fillStyle = '#e8c36a';
  roundRectPath(-s * 0.36, -s * 0.56, s * 0.72, s * 0.1, 4); ctx.fill();
  // 眼睛
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(s * 0.1, -s * 0.4, s * 0.045, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.26, -s * 0.4, s * 0.045, 0, 7); ctx.fill();
  // 嘴巴（微笑）
  ctx.strokeStyle = '#c96a55'; ctx.lineWidth = s * 0.05; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(s * 0.12, -s * 0.32, s * 0.1, 0.15, Math.PI - 0.4); ctx.stroke();
  ctx.restore();
  // 暗室手电光
  if (L.dark && !mapRevealed) {
    var g = ctx.createRadialGradient(x, y, CS * 0.3, x, y, CS * 2.7);
    g.addColorStop(0, 'rgba(255,236,170,.28)');
    g.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.save();
    ctx.fillStyle = g;
    ctx.fillRect(x - CS * 3, y - CS * 3, CS * 6, CS * 6);
    ctx.restore();
  }
}
function drawMiniMap() {
  if (!miniOn) return;
  var pad = 8;
  var maxW = Math.min(W * 0.3, 120);
  var cw = Math.min(9, Math.floor(maxW / mw));
  var mw2 = cw * mw, mh2 = cw * mh;
  var x0 = W - mw2 - pad, y0 = pad;
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = 'rgba(15,30,20,.55)';
  roundRectPath(x0 - 5, y0 - 5, mw2 + 10, mh2 + 10, 7); ctx.fill();
  for (var y = 0; y < mh; y++) {
    for (var x = 0; x < mw; x++) {
      if (!explored[y][x]) continue;
      ctx.fillStyle = theme.floor;
      ctx.fillRect(x0 + x * cw, y0 + y * cw, cw - 1, cw - 1);
    }
  }
  // 门/墙简略
  ctx.fillStyle = theme.wallLo;
  for (var y2 = 0; y2 < mh; y2++) {
    for (var x2 = 0; x2 < mw; x2++) {
      if (!explored[y2][x2]) continue;
      var c = maze[y2][x2];
      var xx = x0 + x2 * cw, yy = y0 + y2 * cw;
      if (c.N && y2 === 0) ctx.fillRect(xx, yy - 1, cw, 2);
      if (c.S && y2 === mh - 1) ctx.fillRect(xx, yy + cw - 1, cw, 2);
      if (c.W && x2 === 0) ctx.fillRect(xx - 1, yy, 2, cw);
      if (c.E && x2 === mw - 1) ctx.fillRect(xx + cw - 1, yy, 2, cw);
    }
  }
  // 玩家
  var pxx = x0 + px * cw + cw / 2, pyy = y0 + py * cw + cw / 2;
  ctx.fillStyle = '#ff5f6d';
  ctx.beginPath(); ctx.arc(pxx, pyy, Math.max(2.4, cw * 0.36), 0, 7); ctx.fill();
  ctx.restore();
}
function drawMsg() {
  if (msgT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(msgT / 0.4, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '900 ' + Math.round(clamp(W * 0.045, 16, 24)) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(20,40,25,.8)';
    ctx.strokeText(msgTxt, W / 2, H * 0.14);
    ctx.fillStyle = msgCol; ctx.fillText(msgTxt, W / 2, H * 0.14);
    ctx.restore();
  }
  for (var k = 0; k < parts.length; k++) {
    var p = parts[k];
    ctx.save();
    ctx.globalAlpha = clamp(p.life / 0.5, 0, 1);
    ctx.font = '900 ' + Math.round(clamp(W * 0.05, 18, 26)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,40,25,.8)';
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y);
    ctx.restore();
  }
  for (var c2 = 0; c2 < confetti.length; c2++) {
    var cf = confetti[c2];
    ctx.save();
    ctx.globalAlpha = clamp(cf.life / 0.6, 0, 1);
    ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot);
    ctx.fillStyle = cf.c;
    ctx.fillRect(-cf.s / 2, -cf.s / 3, cf.s, cf.s * 0.66);
    ctx.restore();
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu' || state === 'clear' || state === 'done') return;
  drawFloor();
  drawWalls();
  drawFloorSpecials();
  drawMoveWalls();
  drawEntities();
  drawGuideArrows();
  if (invincibleT() <= 0 || Math.floor(tick / 5) % 2 === 0) drawPlayer();
  drawMsg();
  drawMiniMap();
}
function invincibleT() { return 0; }

/* ================= 输入 ================= */
function pos(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
var swipeSX = 0, swipeSY = 0, swipeT0 = 0;
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); audio();
  swipeSX = pos(e).x; swipeSY = pos(e).y; swipeT0 = Date.now();
});
cv.addEventListener('pointerup', function (e) {
  e.preventDefault();
  var p = pos(e);
  var dx = p.x - swipeSX, dy = p.y - swipeSY;
  if (Date.now() - swipeT0 < 900 && Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
    if (Math.abs(dx) > Math.abs(dy)) step(dx > 0 ? 'right' : 'left');
    else step(dy > 0 ? 'down' : 'up');
  }
});
var padRepeat = null;
function padPress(dir) {
  audio();
  if (stuckT > 0) { stuckT = 0; sfxTick(); }
  step(dir);
  clearInterval(padRepeat);
  padRepeat = setInterval(function () { step(dir); }, 280);
}
function padRelease() { clearInterval(padRepeat); padRepeat = null; }
$('pad').addEventListener('pointerdown', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  padPress(b.getAttribute('data-d'));
});
$('pad').addEventListener('pointerup', padRelease);
$('pad').addEventListener('pointercancel', padRelease);
$('pad').addEventListener('pointerleave', padRelease);
window.addEventListener('keydown', function (e) {
  if (state !== 'play') return;
  var k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { if (stuckT > 0) stuckT = 0; step('up'); e.preventDefault(); }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { if (stuckT > 0) stuckT = 0; step('down'); e.preventDefault(); }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (stuckT > 0) stuckT = 0; step('left'); e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (stuckT > 0) stuckT = 0; step('right'); e.preventDefault(); }
});
$('hintBtn').onclick = function () {
  audio(); sfxTick();
  if (state !== 'play') return;
  hintOn = 3.5; hintUsed = true;
  showMsg('跟着金线走！', '#ffe28a');
};
$('mapBtn').onclick = function () {
  audio(); sfxTick();
  miniOn = !miniOn;
  syncHud();
};
$('menuBtn').onclick = function () { audio(); sfxTick(); showMenu(); };

/* ================= 测试钩子 ================= */
window.__T = {
  getState: function () {
    return {
      state: state, level: level, levelName: LEVELS[level].name, mw: mw, mh: mh,
      pos: { x: px, y: py }, steps: steps, best: best,
      gems: { got: gemsGot, total: totalGems }, keys: { got: keysGot, total: keyTotal },
      pieces: { got: piecesGot, total: totalPieces }, mapRevealed: mapRevealed,
      chest: chest ? { open: chest.open } : null, chestBonus: chestBonus,
      timeLeft: timeLeft, timeOut: timeOut,
      ice: iceCells.length, mvWalls: mvWalls.length, portals: portals.length,
      traps: trapCells.length, switches: switchCells.length, dark: !!LEVELS[level].dark,
      stars: save.stars ? save.stars.slice() : [], unlocked: save.unlocked,
      gemPct: gemPct()
    };
  },
  start: function (lv) { startFrom(lv === undefined ? (save.unlocked < LEVELS.length ? save.unlocked : 0) : lv); },
  toLevel: function (n) { level = clamp(n, 0, LEVELS.length - 1); levelSeed = level + 1; startLevel(); },
  move: function (d) { step(d); },
  hint: function () { $('hintBtn').onclick(); },
  toggleMap: function () { miniOn = !miniOn; },
  solveNext: function () {
    // 单步寻路（含传送），返回方向；若需瞬移由 autoPlay 处理
    var goal = null;
    if (keyCells.length && keysGot < keyTotal) goal = keyCells[0];
    else if (chest && !chest.open) goal = [chest.x, chest.y];
    else goal = [mw - 1, mh - 1];
    var route = pathTo(px, py, goal[0], goal[1]);
    if (!route || route.length < 2) return null;
    var step2 = route[1];
    if (step2[0] === px) return step2[1] < py ? 'up' : 'down';
    return step2[0] < px ? 'left' : 'right';
  },
  autoPlay: function () {
    var guard = 0;
    var self = this;
    function pickGoal() {
      if (keyCells.length && keysGot < keyTotal) return { g: keyCells[0], t: 'key' };
      // 先按所有没按的开关（有些宝箱需要开关）
      for (var s = 0; s < switchCells.length; s++) if (!switchCells[s].pressed) return { g: [switchCells[s].x, switchCells[s].y], t: 'sw' };
      if (chest && !chest.open) return { g: [chest.x, chest.y], t: 'chest' };
      return { g: [mw - 1, mh - 1], t: 'exit' };
    }
    while (state === 'play' && guard++ < 4000) {
      stuckT = 0;
      var goal = pickGoal();
      var route = pathTo(px, py, goal.g[0], goal.g[1]);
      if (!route || route.length < 2) {
        if (state === 'play') return { state: state, stuck: true };
      }
      var st = route[1];
      var dx = st[0] - px, dy = st[1] - py;
      // 传送跳变：相邻不在一步内 → 直接瞬移到伙伴格
      if (Math.abs(dx) + Math.abs(dy) > 1) {
        var pp = portalPartner(px, py);
        if (pp && pp[0] === st[0] && pp[1] === st[1]) {
          px = pp[0]; py = pp[1]; tx = px; ty = py;
          sfxPortal();
          onLand(px, py, true);
          continue;
        }
        return { state: state, stuck: true };
      }
      var dir = dx === 0 ? (dy < 0 ? 'up' : 'down') : (dx < 0 ? 'left' : 'right');
      var blk = blockedEdge(px, py, dir);
      if (blk === 'mvwall') {
        var waited = 0;
        while (blk === 'mvwall' && waited++ < 600) { updateMvWalls(0.15); blk = blockedEdge(px, py, dir); }
        if (blk) return { state: state, stuck: true };
      } else if (blk) { return { state: state, stuck: true }; }
      step(dir);
      if (moving) { moving = false; moveT = 1; arrive(); }
    }
    return { state: state, level: level, solved: state === 'clear' || state === 'done' };
  },
  _dbg: function () {
    return {
      maze: maze.map(function (row) { return row.map(function (c) { return (c.N ? 1 : 0) + (c.E ? 2 : 0) + (c.S ? 4 : 0) + (c.W ? 8 : 0); }); }),
      gems: gems, keys: keyCells, pieces: pieceCells, chest: chest, portals: portals,
      mvWalls: mvWalls, swDoors: swDoors, switches: switchCells, ice: iceCells, traps: trapCells
    };
  }
};

/* ================= 启动 ================= */
function loop(t) {
  var dt = Math.min((t - lastT) / 1000 || 0.016, 0.05);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', function () { resize(); });
resize();
setupLevel();       // 垫默认迷宫避免首帧空数组
showMenu();
requestAnimationFrame(loop);
})();
</script>
