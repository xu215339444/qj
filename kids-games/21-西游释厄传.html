<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>21-西游释厄传</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1f33; touch-action: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }   /* 手机浏览器地址栏不挤压画面 */
  #app { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  @supports (height: 100dvh) { #app { height: 100dvh; } }
  /* 返回大厅（手机上没有浏览器返回键也能退出） */
  #home {
    position: fixed; z-index: 21; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px));
    padding: 7px 13px; border-radius: 999px; background: rgba(10,14,30,.55);
    border: 2px solid rgba(255,255,255,.28); color: #dce7ff; font: bold 13px/1 sans-serif;
    text-decoration: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #home:active { filter: brightness(1.5); }
  #stage { position: relative; width: 100%; max-width: 960px; max-height: 100%; aspect-ratio: 16/9; flex: 0 0 auto; }
  canvas#cv { width: 100%; height: 100%; display: block; border-radius: 10px; background: #000; }
  /* ===== 触屏控件：固定贴屏幕底部左右两侧，中间画面完全留空 ===== */
  :root { --u: 52px; }                                  /* 按钮基准尺寸 */
  @media (orientation: landscape) { :root { --u: min(9vh, 54px); } }
  @media (orientation: portrait)  { :root { --u: min(6.2vh, 47px); } }  /* 竖屏宽度有限，确保整行按钮+十字键都留在屏内 */
  @media (orientation: portrait) and (max-width: 350px) { :root { --u: 40px; } }  /* 超窄屏兜底 */
  #pads {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 0 2.5vw calc(1.8vh + env(safe-area-inset-bottom, 0px));
    display: none; justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  body.touch #pads { display: flex; }
  #dpad { position: relative; width: calc(var(--u) * 2.95); height: calc(var(--u) * 2.95); pointer-events: auto; }
  .dbtn {
    position: absolute; width: var(--u); height: var(--u); border-radius: 28%;
    background: rgba(14,20,44,.4); border: 2px solid rgba(255,255,255,.34);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--u) * .4); color: rgba(255,255,255,.88); user-select: none;
  }
  #dU { left: 50%; top: 0; transform: translateX(-50%); }
  #dD { left: 50%; bottom: 0; transform: translateX(-50%); }
  #dL { left: 0; top: 50%; transform: translateY(-50%); }
  #dR { right: 0; top: 50%; transform: translateY(-50%); }
  .padgrp { display: flex; align-items: flex-end; gap: calc(var(--u) * .2); pointer-events: auto; }
  .abtn {
    position: relative; width: var(--u); height: var(--u); border-radius: 50%;
    background: rgba(255,120,60,.4); border: 2px solid rgba(255,200,120,.7);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    color: #fff; font-size: calc(var(--u) * .25); font-weight: 900;
    display: flex; align-items: center; justify-content: center; user-select: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  #bJmp { width: calc(var(--u) * 1.16); height: calc(var(--u) * 1.16); background: rgba(255,170,60,.42); }
  #bAtk { width: calc(var(--u) * 1.34); height: calc(var(--u) * 1.34); font-size: calc(var(--u) * .3); background: rgba(255,90,70,.48); border-color: rgba(255,175,145,.85); }
  #bFab { background: rgba(120,90,220,.42); border-color: rgba(180,160,255,.75); }
  /* 手指热区外扩（视觉不变，判定更大） */
  .dbtn::after, .abtn::after { content: ''; position: absolute; left: -7px; right: -7px; top: -7px; bottom: -7px; }
  .dbtn:active, .abtn:active { filter: brightness(1.55); transform: scale(.93); }
  /* 竖屏：画面靠上，下方整片留给拇指操作区 */
  @media (orientation: portrait) { #app { align-items: flex-start; padding-top: 5vh; } }
  #tip {
    display: none; position: fixed; left: 50%; transform: translateX(-50%); z-index: 25;
    bottom: calc(var(--u) * 3.5 + env(safe-area-inset-bottom, 0px));
    background: rgba(10,14,30,.74); color: #ffe08a; font: bold 13px/1.4 sans-serif;
    padding: 7px 15px; border-radius: 999px; pointer-events: none; white-space: nowrap;
    animation: tipfade 7s forwards;
  }
  @media (orientation: portrait) { body.touch #tip { display: block; } }
  @keyframes tipfade { 0%, 72% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
</div></div>
<div id="tip">把手机横过来，画面会大很多哦 📱</div>
<a id="home" href="游戏大厅.html">← 大厅</a>
<div id="pads">
  <div id="dpad">
    <div class="dbtn" id="dU">▲</div><div class="dbtn" id="dL">◀</div>
    <div class="dbtn" id="dR">▶</div><div class="dbtn" id="dD">▼</div>
  </div>
  <div class="padgrp">
    <div class="abtn" id="bFab">法宝</div>
    <div class="abtn" id="bJmp">跳</div>
    <div class="abtn" id="bAtk">攻</div>
  </div>
</div>
<script>
'use strict';
/* ==================================================================
   西游释厄传 · 儿童街机版（清版动作 Belt-Scroll Beat'em Up）
   —— 自研引擎：八向平面走位 · 三段连击 · 蓄气大招(元神出窍) · 法宝 · 3关3Boss
   ================================================================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 960, H = 540, FT = 356, FB = 516;           // 画面宽高与地面纵深上下界
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const sgn = v => v < 0 ? -1 : 1;
/* 自定义圆角矩形（不依赖原生 ctx.roundRect，兼容旧内核） */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
/* ============================ 音效 ============================ */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { } } return AC; }
function tone(f0, f1, dur, type, vol, delay) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || .08, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const S = {
  atk: () => tone(520, 220, .08, 'square', .05),
  hit: () => { tone(180, 70, .1, 'sawtooth', .09); tone(700, 900, .05, 'square', .04); },
  down: () => tone(300, 60, .3, 'sawtooth', .09),
  hur: () => { tone(220, 90, .25, 'triangle', .12); tone(110, 55, .3, 'sawtooth', .07, .05); },
  pick: () => { tone(660, 660, .07, 'square', .07); tone(990, 990, .1, 'square', .07, .07); },
  big: () => { tone(150, 40, .5, 'sawtooth', .13); tone(90, 30, .6, 'square', .1, .05); },
  fanfare: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .16, 'square', .08, i * .13)); },
  lose: () => { [392, 330, 262, 196].forEach((f, i) => tone(f, f, .2, 'triangle', .09, i * .16)); }
};
/* ============================ 输入 ============================ */
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
const keys = {};
let tdx = 0, tdy = 0; const tz = { atk: false, jmp: false, fab: false };
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true; ac();
  if (e.key === 'Enter') menuKey();
});
addEventListener('keyup', e => { keys[e.key] = false; });
let inp = { dx: 0, dy: 0, atk: false, jmp: false, fab: false, atkP: false, atkR: false, jmpP: false, fabP: false };
let oldBtn = { atk: false, jmp: false, fab: false };
function pollInput() {
  const dx = clamp((keys.ArrowLeft || keys.a || keys.A ? -1 : 0) + (keys.ArrowRight || keys.d || keys.D ? 1 : 0) + tdx, -1, 1);
  const dy = clamp((keys.ArrowUp || keys.w || keys.W ? -1 : 0) + (keys.ArrowDown || keys.s || keys.S ? 1 : 0) + tdy, -1, 1);
  const atk = !!(keys.j || keys.J || tz.atk), jmp = !!(keys.k || keys.K || tz.jmp), fab = !!(keys.l || keys.L || tz.fab);
  inp = { dx, dy, atk, jmp, fab, atkP: atk && !oldBtn.atk, atkR: !atk && oldBtn.atk, jmpP: jmp && !oldBtn.jmp, fabP: fab && !oldBtn.fab };
  oldBtn = { atk, jmp, fab };
}
/* 触屏绑定 */
(function bindTouch() {
  if (TOUCH) document.body.classList.add('touch');
  const hold = (id, dn, up) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      /* 指针捕获：手指按住后滑出按钮也不丢输入，避免走位中途"断触" */
      try { el.setPointerCapture(e.pointerId); } catch (err) { }
      dn(); ac();
    });
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
  };
  hold('dU', () => tdy = -1, () => tdy = 0); hold('dD', () => tdy = 1, () => tdy = 0);
  hold('dL', () => tdx = -1, () => tdx = 0); hold('dR', () => tdx = 1, () => tdx = 0);
  hold('bAtk', () => tz.atk = true, () => tz.atk = false);
  hold('bJmp', () => tz.jmp = true, () => tz.jmp = false);
  hold('bFab', () => tz.fab = true, () => tz.fab = false);
})();
/* ============================ 关卡数据 ============================ */
const STAGES = [
  {
    name: '第一关 · 花果山', len: 4200, boss: 'hunshun', bossX: 3500,
    sky: ['#a8dcff', '#e8f8d8'], far: '#8fc47f', mid: '#6ea862', gnd: ['#8fca7a', '#67a054'], line: '#578c45',
    waves: [{ x: 700, g: ['m1', 'm1', 'm2'] }, { x: 1500, g: ['m1', 'm2', 'm1', 'm3'] }, { x: 2300, g: ['m2', 'm2', 'm1', 'm3', 'm1'] }]
  },
  {
    name: '第二关 · 南天门', len: 4400, boss: 'juling', bossX: 3600,
    sky: ['#bcd8ff', '#f2f7ff'], far: '#c9d6ea', mid: '#9fb2cf', gnd: ['#e8e2d0', '#c9c0a8'], line: '#b3a88e',
    waves: [{ x: 700, g: ['m2', 'm3', 'm1'] }, { x: 1550, g: ['m3', 'm2', 'm2', 'm3'] }, { x: 2450, g: ['m2', 'm1', 'm3', 'm2', 'm3', 'm1'] }]
  },
  {
    name: '第三关 · 凌霄宝殿', len: 4600, boss: 'erlang', bossX: 3700,
    sky: ['#ffd9a0', '#ffefc9'], far: '#e0b070', mid: '#c89050', gnd: ['#e8c060', '#cf9a3e'], line: '#b5822e',
    waves: [{ x: 720, g: ['m2', 'm3', 'm2'] }, { x: 1600, g: ['m3', 'm3', 'm2', 'm1', 'm2'] }, { x: 2550, g: ['m2', 'm3', 'm2', 'm3', 'm2', 'm3'] }]
  }
];
const FOE_DEF = {
  m1: { hp: 4, spd: 1.25, col: '#5fae5a', col2: '#3f8a3c', size: 1.0, name: '小妖' },
  m2: { hp: 6, spd: 1.75, col: '#d95f4e', col2: '#a83c30', size: 1.05, name: '妖兵' },
  m3: { hp: 5, spd: 2.3, col: '#8a7fbf', col2: '#5f5494', size: .95, name: '狼妖' }
};
const BOSS_DEF = {
  hunshun: { hp: 42, spd: 1.25, col: '#4a5a8a', col2: '#2f3a5f', size: 1.5, name: '混世魔王' },
  juling: { hp: 58, spd: 1.05, col: '#c8952d', col2: '#8f6415', size: 1.7, name: '巨灵神' },
  erlang: { hp: 76, spd: 1.5, col: '#3f7d5a', col2: '#27543b', size: 1.6, name: '二郎神' }
};
/* ============================ 全局状态 ============================ */
let state = 'title', score = 0, lives = 5, fabao = 1, stageIdx = 0;
let camX = 0, camLock = false, foes = [], items = [], fx = [], boss = null;
let banner = '', bannerT = 0, clearT = -1, shakeT = 0, flashA = 0, gtime = 0;
let P = null;
function mkPlayer() {
  return { wx: 130, y: 470, jy: 0, vy: 0, face: 1, atkT: 0, combo: 0, comboT: 0, charging: false, charge: 0, hurtT: 0, invT: 0, kvx: 0, dive: false, bob: 0 };
}
function mkFoe(t, wx, y) {
  const d = FOE_DEF[t];
  return { t, ...d, hp: d.hp, maxhp: d.hp, wx, y, jy: 0, face: -1, atkT: 0, hurtT: 0, kvx: 0, downT: 0, cool: rnd(20, 60), bob: rnd(0, 6), dead: false };
}
function mkBoss(t, wx) {
  const d = BOSS_DEF[t];
  return { t, ...d, hp: d.hp, maxhp: d.hp, wx, y: 450, jy: 0, vy: 0, face: -1, st: 'approach', tmr: 50, cd: 60, ph: 1, inv: 0, hurtT: 0, kvx: 0, dvx: 0, dead: false, bob: 0 };
}
/* ============================ 特效 ============================ */
function poof(x, y, col, n) { for (let i = 0; i < (n || 8); i++) fx.push({ k: 'p', x, y, vx: rnd(-3, 3), vy: rnd(-4, .5), r: rnd(3, 8), life: rnd(18, 34), col: col || '#fff' }); }
function spark(x, y) { fx.push({ k: 's', x, y, life: 10 }); }
function floatTxt(x, y, txt, col) { fx.push({ k: 't', x, y, txt, col: col || '#ffd54a', life: 42 }); }
function shockRing(x, y) { fx.push({ k: 'ring', x, y, r: 14, hit: false }); }
/* ============================ 战斗判定 ============================ */
function swingHit(c) {
  const reach = c === 2 ? 92 : 66, dmg = c === 2 ? 3 : 2;
  const x0 = P.wx + P.face * 14, x1 = P.wx + P.face * reach;
  let hitAny = false;
  for (const f of foes) {
    if (f.dead || f.hurtT > 0) continue;
    const dx = f.wx - P.wx;
    if (dx * P.face > 4 && Math.abs(dx) < reach + 16 && Math.abs(f.y - P.y) < 34 && Math.abs(f.jy - P.jy) < 60) {
      damageFoe(f, dmg, P.face * (c === 2 ? 7 : 2.5), c === 2); hitAny = true;
    }
  }
  if (boss && !boss.dead && boss.hurtT <= 0) {
    const dx = boss.wx - P.wx;
    if (dx * P.face > 4 && Math.abs(dx) < reach + boss.size * 14 && Math.abs(boss.y - P.y) < 52) { damageBoss(dmg, P.face * (c === 2 ? 4 : 1)); hitAny = true; }
  }
  if (hitAny) S.hit(); else S.atk();
}
function groundHit() {
  let hitAny = false;
  for (const f of foes) {
    if (f.dead || f.hurtT > 0) continue;
    if (Math.abs(f.wx - P.wx) < 95 && Math.abs(f.y - P.y) < 40) { damageFoe(f, 3, sgn(f.wx - P.wx) * 6, true); hitAny = true; }
  }
  if (boss && !boss.dead && Math.abs(boss.wx - P.wx) < 110 && Math.abs(boss.y - P.y) < 50) { damageBoss(3, sgn(boss.wx - P.wx) * 3); hitAny = true; }
  shakeT = 6; shockRing(P.wx, P.y); if (hitAny) S.hit();
}
function damageFoe(f, dmg, kv, down) {
  f.hp -= dmg; f.hurtT = down ? 42 : 20; f.kvx = kv; if (down) f.downT = 42;
  spark(f.wx, f.y - 46 * f.size); score += 30;
  if (f.hp <= 0) {
    f.dead = true; score += 100; poof(f.wx, f.y - 30 * f.size, f.col, 12); S.down();
    floatTxt(f.wx, f.y - 60 * f.size, '+100', '#ffd54a');
    const r = Math.random();
    if (r < .16) items.push({ t: 'fan', wx: f.wx, y: f.y, bob: 0 });
    else if (r < .24) items.push({ t: 'peach', wx: f.wx, y: f.y, bob: 0 });
  }
}
function damageBoss(dmg, kv) {
  if (boss.inv > 0) return;
  boss.hp -= dmg; boss.hurtT = Math.max(boss.hurtT, 12); boss.kvx = kv;
  spark(boss.wx, boss.y - 60 * boss.size); score += 30;
  if (boss.hp <= 0) killBoss();
}
function killBoss() {
  boss.dead = true; score += 2000; S.big(); shakeT = 20;
  poof(boss.wx, boss.y - 50, boss.col, 26); floatTxt(boss.wx, boss.y - 110, '+2000', '#ffd54a');
  clearT = 80;
}
function hurtPlayer(fromX) {
  if (P.invT > 0 || P.hurtT > 0 || state !== 'play') return;
  lives--; P.hurtT = 34; P.kvx = sgn(P.wx - fromX) * 6.5; P.invT = 110;
  P.charging = false; P.charge = 0; P.atkT = 0;
  S.hur(); shakeT = 10; spark(P.wx, P.y - 44, '#ff8a80', 6);
  if (lives <= 0) { state = 'over'; S.lose(); }
}
function yuanShen() {
  S.big(); flashA = .8; shakeT = 14;
  fx.push({ k: 'aura', x: P.wx, y: P.y, r: 10, life: 26 });
  let n = 0;
  for (const f of foes) {
    if (f.dead) continue;
    if (Math.abs(f.wx - P.wx) < 340) { damageFoe(f, 8, sgn(f.wx - P.wx) * 8, true); n++; }
  }
  if (boss && !boss.dead && Math.abs(boss.wx - P.wx) < 360) { damageBoss(8, sgn(boss.wx - P.wx) * 5); n++; }
  score += n * 20;
  floatTxt(P.wx, P.y - 120, '元神出窍！', '#8ecbff');
}
function useFabao() {
  if (fabao <= 0) return;
  fabao--; S.big(); flashA = 1; shakeT = 12;
  for (const f of foes) { if (!f.dead) damageFoe(f, 10, sgn(f.wx - P.wx || 1) * 7, true); }
  if (boss && !boss.dead) damageBoss(10, sgn(boss.wx - P.wx || 1) * 4);
  floatTxt(P.wx, P.y - 130, '芭蕉扇！', '#a5f0c0');
  poof(P.wx, P.y - 50, '#bfe8ff', 14);
}
/* ============================ 更新：玩家 ============================ */
function upPlayer() {
  const p = P;
  p.bob += .18;
  if (p.invT > 0) p.invT--;
  if (p.comboT > 0) p.comboT--; else if (p.combo) p.combo = 0;
  /* 受击硬直 */
  if (p.hurtT > 0) {
    p.hurtT--; p.wx += p.kvx; p.kvx *= .9;
    if (p.jy > 0 || p.vy !== 0) { p.vy -= .55; p.jy += p.vy; if (p.jy <= 0) { p.jy = 0; p.vy = 0; } }
    clampPlayer(); return;
  }
  /* 跳跃 */
  if (p.jy > 0 || p.vy !== 0) {
    p.vy -= .55; p.jy += p.vy;
    if (p.jy <= 0) {
      p.jy = 0; p.vy = 0;
      if (p.dive) { p.dive = false; groundHit(); }
    }
  }
  /* 攻击动画推进 */
  if (p.atkT > 0) {
    p.atkT--;
    if (p.atkT === (p.combo === 2 ? 13 : 15)) swingHit(p.combo);
    if (p.atkT === 0) {
      if (inp.atk) { p.charging = true; p.charge = 0; }
    }
  } else if (p.charging) {
    if (inp.atk) {
      p.charge = Math.min(64, p.charge + 1);
      if (p.charge % 12 === 0 && p.charge > 0) fx.push({ k: 'p', x: p.wx + rnd(-14, 14), y: p.y - 40 - p.jy, vx: 0, vy: -1.4, r: 4, life: 16, col: '#ffe082' });
    } else {
      p.charging = false;
      if (p.charge >= 44) yuanShen();
      p.charge = 0;
    }
  }
  /* 出招/跳攻 */
  if (inp.atkP) {
    if (p.jy > 0) { p.dive = true; p.vy = -7; S.atk(); }
    else if (!p.charging && p.atkT <= 0) {
      p.combo = p.comboT > 0 ? (p.combo + 1) % 3 : 0;
      p.atkT = 22; p.comboT = 46; p.face = inp.dx !== 0 ? sgn(inp.dx) : p.face;
    }

function drawWukong() {
  const p = P, s = .82 + .22 * (p.y - FT) / (FB - FT);
  const bx = p.wx - camX, by = p.y - p.jy;
  if (p.invT > 0 && Math.floor(p.invT / 4) % 2 === 0 && p.hurtT <= 0) return;
  shadow(bx, p.y, s);
  ctx.save(); ctx.translate(bx, by); ctx.scale(s * p.face, s);
  const bob = Math.sin(p.bob) * 2;
  const atk = p.atkT > 0, chg = p.charging;
  /* 蓄气光环 */
  if (chg) {
    ctx.globalAlpha = .5 + Math.sin(gtime * .3) * .2;
    ctx.strokeStyle = '#ffe082'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -38, 40 + p.charge * .3, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (ART21.wk) {
    /* 图片版悟空（18号同款） */
    const wr = ART21.wk.width / ART21.wk.height || .74;
    const ih = 96, iw = ih * wr;
    ctx.save(); ctx.rotate(bob * .012);
    ctx.drawImage(ART21.wk, -iw / 2, -ih + bob * .3, iw, ih);
    ctx.restore();
  } else {
  /* 尾巴 */
  ctx.strokeStyle = '#c88a3c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -22 + bob); ctx.quadraticCurveTo(-30, -34 + bob, -24, -52 + bob); ctx.stroke();
  /* 腿 */
  ctx.fillStyle = '#8a5a24';
  const lg = atk || chg ? 0 : Math.sin(p.bob) * 5;
  rr(ctx, -13, -20 + lg * .3, 10, 22, 4); ctx.fill();
  rr(ctx, 3, -20 - lg * .3, 10, 22, 4); ctx.fill();
  /* 身体（虎皮裙） */
  ctx.fillStyle = '#c88a3c'; rr(ctx, -14, -46 + bob * .4, 28, 30, 9); ctx.fill();
  ctx.fillStyle = '#e8a44a'; rr(ctx, -15, -26 + bob * .4, 30, 10, 5); ctx.fill();
  ctx.fillStyle = '#5d3a14';
  for (let i = 0; i < 4; i++) ctx.fillRect(-14 + i * 8, -25 + bob * .4, 4, 8);
  /* 红围巾 */
  ctx.fillStyle = '#e04a3a'; rr(ctx, -12, -50 + bob * .5, 24, 8, 4); ctx.fill();
  ctx.fillRect(p.face > 0 ? 8 : -18, -50 + bob * .5, 10, 5);
  /* 头 */
  const hy = -62 + bob * .6;
  ctx.fillStyle = '#e8b06a'; ctx.beginPath(); ctx.arc(0, hy, 15, 0, 7); ctx.fill();
  /* 耳朵 */
  ctx.beginPath(); ctx.arc(-14, hy - 2, 5, 0, 7); ctx.arc(14, hy - 2, 5, 0, 7); ctx.fill();
  /* 金箍 */
  ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.arc(0, hy - 4, 14.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  /* 脸 */

/* 小怪 */
function drawFoe(f) {

  if (f.hurtT > 0 && !down) ctx.translate(rnd(-2, 2), 0);
  if (ART21[f.t]) {
    /* 图片版小怪 */
    const fr = ART21[f.t].width / ART21[f.t].height;
    const ih = 86, iw = ih * fr;
    ctx.drawImage(ART21[f.t], -iw / 2, -ih + bob * .4, iw, ih);

  rr(ctx, 2, -16 - lg * .3, 9, 18, 4); ctx.fill();

  /* 肚皮 */

  /* 头 + 角 */
  const hy = -52 + bob * .6;
  ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(0, hy, 13, 0, 7); ctx.fill();
  ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8, hy - 10); ctx.lineTo(-12, hy - 19); ctx.moveTo(8, hy - 10); ctx.lineTo(12, hy - 19); ctx.stroke();
  /* 眼与嘴 */
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(4, hy - 1, 3.4, 0, 7); ctx.arc(-4, hy - 1, 3.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#222';

  ctx.strokeStyle = '#5a1f14'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(1, hy + 6, 4, .15, Math.PI - .15); ctx.stroke();
  /* 爪/武器挥击 */
  if (f.atkT > 0 && f.atkT < 18) {
    ctx.strokeStyle = f.col2; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(10, -34); ctx.lineTo(26, -40); ctx.stroke();
  }
  }
  ctx.restore();
  /* 血条 */
  if (f.hp < f.maxhp) {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(ctx, bx - 20, by - (ART21[f.t] ? 90 : 76) * s, 40, 5, 2); ctx.fill();
    ctx.fillStyle = '#7CFC00'; rr(ctx, bx - 19, by - (ART21[f.t] ? 89 : 75) * s, 38 * (f.hp / f.maxhp), 3, 1.5); ctx.fill();
  }
}
/* Boss */
function drawBoss(b) {
  const s = (.82 + .22 * (b.y - FT) / (FB - FT)) * b.size;
  const bx = b.wx - camX, by = b.y - b.jy;
  shadow(bx, b.y, s);
  if (b.inv > 0 && Math.floor(b.inv / 4) % 2 === 0) return;
  ctx.save(); ctx.translate(bx, by); ctx.scale(s * b.face, s);
  const bob = Math.sin(b.bob) * 2.4;
  const bimg = ART21[b.t === 'hunshun' ? 'boss1' : b.t === 'juling' ? 'boss2' : 'boss3'];
  if (bimg) {
    /* 图片版 BOSS */
    const br = bimg.width / bimg.height;
    const ih = 116, iw = ih * br;
    ctx.drawImage(bimg, -iw / 2, -ih + bob * .4, iw, ih);
  } else {
  /* 腿 */
  ctx.fillStyle = b.col2;
  const lg = b.st === 'wind' ? 0 : Math.sin(b.bob) * 5;
  rr(ctx, -16, -22 + lg * .3, 13, 24, 5); ctx.fill();
  rr(ctx, 3, -22 - lg * .3, 13, 24, 5); ctx.fill();
  /* 身体+铠甲 */
  ctx.fillStyle = b.col; rr(ctx, -19, -54 + bob * .4, 38, 36, 12); ctx.fill();
  ctx.fillStyle = b.col2; rr(ctx, -20, -46 + bob * .4, 40, 12, 6); ctx.fill();
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath(); ctx.arc(0, -40 + bob * .4, 5, 0, 7); ctx.fill();
  /* 头 */
  const hy = -68 + bob * .6;
  ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(0, hy, 17, 0, 7); ctx.fill();
  if (b.t === 'juling') {           /* 巨灵神：金盔 */
    ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(0, hy - 5, 17.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-18, hy - 6, 36, 5);
    ctx.fillStyle = '#e04a3a'; ctx.beginPath(); ctx.moveTo(0, hy - 26); ctx.lineTo(5, hy - 15); ctx.lineTo(-5, hy - 15); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#e04a3a'; ctx.beginPath(); ctx.ellipse(2, hy - 2, 3, 5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2b4a36'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-16, hy + 6); ctx.lineTo(-30, hy + 14); ctx.stroke();
  } else {                          /* 混世魔王：双角 */
    ctx.strokeStyle = '#e8e0d0'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, hy - 12); ctx.quadraticCurveTo(-20, hy - 24, -14, hy - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, hy - 12); ctx.quadraticCurveTo(20, hy - 24, 14, hy - 30); ctx.stroke();
  }
  /* 眼嘴 */
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, hy - 2, 3.8, 0, 7); ctx.arc(-4, hy - 2, 3.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.arc(7, hy - 2, 1.8, 0, 7); ctx.arc(-3, hy - 2, 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-6, hy + 7); ctx.lineTo(8, hy + 7); ctx.lineTo(1, hy + 13); ctx.closePath(); ctx.fill();
  /* 攻击爪 */
  if (b.st === 'wind' && b.tmr < 14) {
    ctx.strokeStyle = b.col2; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(14, -46); ctx.lineTo(34, -54); ctx.stroke();
  }
  }
  ctx.restore();
  /* 血条（大） */
  const bw = 110;
  const bTop = bimg ? 124 : 96;
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(ctx, bx - bw / 2, by - bTop * s, bw, 9, 4); ctx.fill();
  const cgr = ctx.createLinearGradient(bx - bw / 2, 0, bx + bw / 2, 0);
  cgr.addColorStop(0, '#ffca28'); cgr.addColorStop(1, '#ff5252');
  ctx.fillStyle = cgr; rr(ctx, bx - bw / 2 + 1, by - (bTop - 1) * s, (bw - 2) * Math.max(0, b.hp / b.maxhp), 7, 3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(b.name, bx, by - (bTop + 4) * s);

/* 掉落物 */
function drawItem(it) {

/* 特效 */
function drawFx() {
  for (const e of fx) {
    const x = e.x - (e.x > -999 && e.k !== 'ring' ? 0 : 0);
    const dx = e.k === 'aura' ? e.x - camX : (e.x !== undefined ? e.x - camX : 0);
    if (e.k === 'p') {
      ctx.globalAlpha = clamp(e.life / 20, 0, 1);
      ctx.fillStyle = e.col;
      ctx.beginPath(); ctx.arc(e.x - camX, e.y, e.r, 0, 7); ctx.fill();
    } else if (e.k === 's') {
      ctx.globalAlpha = clamp(e.life / 10, 0, 1);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + .5;
        ctx.beginPath(); ctx.moveTo(e.x - camX + Math.cos(a) * 4, e.y + Math.sin(a) * 4);
        ctx.lineTo(e.x - camX + Math.cos(a) * 12, e.y + Math.sin(a) * 12); ctx.stroke();
      }
    } else if (e.k === 't') {
      ctx.globalAlpha = clamp(e.life / 24, 0, 1);
      ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
      ctx.strokeText(e.txt, e.x - camX, e.y); ctx.fillStyle = e.col; ctx.fillText(e.txt, e.x - camX, e.y);
    } else if (e.k === 'ring') {
      ctx.globalAlpha = clamp(1 - e.r / 210, 0, 1);
      ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(e.x - camX, e.y, e.r, e.r * .38, 0, 0, 7); ctx.stroke();
    } else if (e.k === 'aura') {
      ctx.globalAlpha = clamp(e.life / 26, 0, 1) * .8;
      ctx.strokeStyle = '#8ecbff'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(e.x - camX, e.y - 40, e.r, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

/* ============================ 绘制主函数 ============================ */
function draw() {
  ctx.save();
  if (shakeT > 0) ctx.translate(rnd(-5, 5), rnd(-4, 4));
  drawBG();
  /* 深度排序绘制 */
  const ents = [];
  for (const it of items) ents.push({ y: it.y, d: () => drawItem(it) });
  for (const f of foes) ents.push({ y: f.y, d: () => drawFoe(f) });
  if (boss && !boss.dead) ents.push({ y: boss.y, d: () => drawBoss(boss) });
  if (P && state !== 'title') ents.push({ y: P.y, d: drawWukong });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) e.d();
  drawFx();
  if (P && state !== 'title') drawHUD();
  ctx.restore();
  if (state !== 'play') drawPanel();
}
/* ============================ 流程控制 ============================ */
function startGame() {
  score = 0; lives = 5; fabao = 1; stageIdx = 0;
  startStage(0); state = 'play';
}
function startStage(i) {
  stageIdx = i;
  const st = STAGES[i];
  st.waves.forEach(w => w.done = false); st.bossDone = false;
  foes = []; items = []; fx = []; boss = null;
  camX = 0; camLock = false; clearT = -1;
  P = mkPlayer();
  lives = Math.max(lives, 5);
  banner = st.name; bannerT = 120;
}
function nextStage() {
  if (stageIdx < 2) { lives = 5; startStage(stageIdx + 1); state = 'play'; }
  else { state = 'win'; S.fanfare(); }
}
function continueGame() { lives = 5; startStage(stageIdx); state = 'play'; }
function menuKey() {
  ac();
  if (state === 'title') startGame();
  else if (state === 'clear') nextStage();
  else if (state === 'over') continueGame();
  else if (state === 'win') { state = 'title'; }
}

  location.href = '游戏大厅.html';
});
/* ============================ 主循环 ============================ */
function tick() { pollInput(); update(); draw(); }
let rafId = 0;
function loop() { tick(); rafId = requestAnimationFrame(loop); }
P = mkPlayer();
loop();
/* ============================ 测试钩子 ============================ */
window.__T = {
  info: () => ({ state, score, lives, fabao, stage: stageIdx, cam: Math.round(camX), px: P ? Math.round(P.wx) : -1, py: P ? Math.round(P.y) : -1, foes: foes.length, boss: boss && !boss.dead ? { hp: boss.hp, ph: boss.ph, st: boss.st } : null, fxn: fx.length }),
  key: (k, v) => { keys[k] = v; },
  touch: (n, v) => { tz[n] = v; },
  frame(n) { for (let i = 0; i < (n || 1); i++) tick(); },
  start: startGame, next: nextStage, cont: continueGame,
  killFoes() { for (const f of foes) if (!f.dead) damageFoe(f, 999, 0, true); },
  hurtBoss(d) { if (boss) damageBoss(d || 10, 0); },
  give(n) { lives = n == null ? 5 : n; fabao = 3; },
  setStage(i) { startStage(i); state = 'play'; }
};
</script>
