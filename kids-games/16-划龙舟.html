<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>划龙舟</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: #2a6fb8; color: #fff; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  #hud {
    flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px; background: rgba(10,40,80,.55); z-index: 5;
  }
  .hudbox {
    display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,.18);
    border-radius: 11px; padding: 5px 11px; font-size: 14px; font-weight: 800; white-space: nowrap;
  }
  #menuBtn { margin-left: auto; border: 0; cursor: pointer; font-family: inherit; font-weight: 800;
    font-size: 13px; padding: 6px 12px; border-radius: 11px; background: rgba(255,255,255,.22); color: #fff; }
  #stage { flex: 1; min-height: 0; position: relative; display: flex; }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,30,60,.72); z-index: 20; padding: 16px; overflow-y: auto; }
  .card {
    background: #fffdf6; color: #3a4a6a; border-radius: 28px; padding: 22px 24px;
    max-width: 430px; width: 100%; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .card h1 { margin: 0 0 8px; font-size: 30px; color: #d8481e; }
  .card h2 { margin: 0 0 8px; font-size: 27px; color: #e08a12; }
  .stars { font-size: 34px; letter-spacing: 6px; color: #ffca28; margin: 6px 0 10px; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .rule { font-size: 15px; font-weight: 700; line-height: 1.8; color: #5a6a8a; }
  .rule b { color: #e06a20; }
  .small { font-size: 12.5px; font-weight: 700; color: #90a0b8; margin-top: 6px; line-height: 1.7; }
  .rows { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0 2px; }
  .pill { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 5px 12px; background: #e0ecff; color: #3a5fd9; }
  .pill.y { background: #fff3d6; color: #b57a10; }
  .pill.g { background: #e8f6e0; color: #3d8c4a; }
  .bigbtn {
    display: block; width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ff8a4a, #e05a1e); color: #fff; font-family: inherit;
    font-size: 23px; font-weight: 900; box-shadow: 0 6px 0 #a83a10; cursor: pointer;
  }
  .bigbtn.blue { background: linear-gradient(180deg,#5fb0ff,#2b7fd8); box-shadow: 0 6px 0 #17558f; }
  .bigbtn:active { transform: translateY(3px); box-shadow: none; }
  .smallbtn {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border: 0; border-radius: 999px;
    background: #eef1f6; color: #5b6a8a; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
  }
  /* 对手介绍卡 */
  .foeRow { display: flex; align-items: center; gap: 10px; margin: 10px 0; text-align: left;
    background: #f4f0ff; border-radius: 14px; padding: 8px 12px; }
  .foeRow svg { width: 40px; height: 40px; flex: none; }
  .foeRow .fn { font-size: 15px; font-weight: 900; color: #4a3b6b; }
  .foeRow .fd { font-size: 12px; font-weight: 700; color: #8a7ab0; }
  .homelink {
    position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%); z-index: 99;
    color: rgba(255,255,255,.85); font-size: 13px; text-decoration: none;
    background: rgba(0,0,0,.35); padding: 4px 14px; border-radius: 999px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hudbox" id="raceTxt">第 1 场</div>
    <div class="hudbox" id="distTxt">还剩 150m</div>
    <div class="hudbox" id="spdTxt">速度 0</div>
    <div class="hudbox" id="energyTxt">冲刺 0%</div>
    <button id="menuBtn">菜单</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="overlayBox"></div>
</div>
<a class="homelink" href="游戏大厅.html" target="_top">← 游戏大厅</a>

<script>
(function () {
'use strict';
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rnd(a, b) { return a + Math.random() * (b - a); }

/* ================= 音效 ================= */
var AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
  return AC;
}
function tone(f, d, ty, v, delay) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + (delay || 0);
    o.type = ty || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}
var sfxPaddle = function () { tone(300 + Math.random() * 80, 0.06, 'sine', 0.14); };
var sfxDrum  = function () { tone(140, 0.09, 'square', 0.26); tone(90, 0.12, 'sine', 0.22, 0.01); };
var sfxSprint = function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.18, 'triangle', 0.26, i * 0.05); }); };
var sfxWin   = function () { [523, 659, 784, 1047, 1319, 1568].forEach(function (f, i) { tone(f, 0.26, 'triangle', 0.3, i * 0.1); }); };
var sfxLose  = function () { [440, 392, 330, 262].forEach(function (f, i) { tone(f, 0.22, 'sine', 0.24, i * 0.1); }); };
var sfxTick  = function () { tone(660, 0.05, 'triangle', 0.16); };

/* ================= 队伍 ================= */
var TEAMS = [
  { name: '水獭队',  color: '#8a6a3a', speed: 2.4, look: 'otter',  desc: '慢悠悠，刚学会划桨' },
  { name: '海豚队',  color: '#3a7bd5', speed: 2.9, look: 'dolphin', desc: '游得快，但划桨一般' },
  { name: '狐狸队',  color: '#e07a2a', speed: 3.4, look: 'fox',     desc: '狡猾的对手，别小看' },
  { name: '老虎队',  color: '#d8481e', speed: 3.9, look: 'tiger',   desc: '力气大，划得飞快' },
  { name: '神龙队',  color: '#9b6bd6', speed: 4.3, look: 'dragon', desc: '传说中最快的队伍！' }
];
var RACES = [
  { dist: 120, foes: [0, 1],        label: '热身赛' },
  { dist: 150, foes: [1, 2],        label: '小组赛' },
  { dist: 180, foes: [2, 3, 1],     label: '半决赛' },
  { dist: 200, foes: [3, 4, 2],     label: '决赛' },
  { dist: 220, foes: [4, 4, 3],     label: '冠军赛' }
];

/* ================= 状态 ================= */
var cv = $('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
var race = 0, state = 'menu';         // menu | countdown | play | over
var boats = [];                        // {name,color,look,dist,speed,base,phase,bob,isMe,burstT}
var myBoat = null;
var raceDist = 150, finishX = 0;
var mySpeed = 0, energy = 0, sprintT = 0;
var paddleT = 0, drumT = 0, drumHit = 0;
var myTime = 0, raceTime = 0, rank = 0;
var splash = [], parts = [], confetti = [];
var countdown = 0;
var msgT = 0, msgTxt = '', msgCol = '#fff';
var lastT = 0, tick = 0, gameClock = 0;
var roundId = 0;
var PXM = 3;                            // 像素/米（动态算）
var LANE0 = 0, LANEH = 0, LANES = 4;

/* ================= 布局 ================= */
function resize() {
  var r = $('stage').getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  LANE0 = Math.round(H * 0.08);
  LANEH = Math.round(H * 0.72);
  LANES = 4;
  PXM = (W - 40) / raceDist;
  finishX = W - 18;
}
function laneY(i) {
  return LANE0 + (LANEH / LANES) * (i + 0.5);
}

/* ================= 比赛 ================= */
function startRace() {
  var R = RACES[race];
  raceDist = R.dist;
  boats = [];
  var idx = 0;
  // 我的船在最后一条道
  var myLane = LANES - 1;
  for (var i = 0; i < LANES; i++) {
    if (i === myLane) {
      myBoat = { name: '我们队', color: '#e53935', look: 'kid', dist: 0, speed: 0.4, base: 0, phase: rnd(0, 7), bob: 0, isMe: true, burstT: 0, lane: i };
      boats.push(myBoat);
    } else {
      var foeIdx = R.foes[idx++ % R.foes.length];
      var T = TEAMS[foeIdx];
      boats.push({ name: T.name, color: T.color, look: T.look, dist: 0, speed: T.speed, base: T.speed, phase: rnd(0, 7), bob: 0, isMe: false, burstT: rnd(2, 7), lane: i });
    }
  }
  mySpeed = 0.4; energy = 0; sprintT = 0;
  myTime = 0; raceTime = 0; rank = 0;
  paddleT = 0; drumT = 0; drumHit = 0;
  splash = []; parts = []; confetti = [];
  countdown = 3;
  gameClock = 0; paddleT = 0;
  state = 'countdown';
  hideOverlay();
  resize();
  syncHud();
  showMsg('第 ' + (race + 1) + ' 场 · ' + R.label, '#ffd34d');
  sfxTick();
}
function startGame() { race = 0; startRace(); }

function paddle() {
  if (state !== 'play') return;
  if (gameClock - paddleT < 0.09) return;   // 点击上限（用游戏时钟，测试可复现）
  paddleT = gameClock;
  mySpeed = Math.min(mySpeed + 0.9, 6.2);
  if (sprintT <= 0) energy = Math.min(100, energy + 4);
  sfxPaddle();
  drumHit++;
  // 水花
  splash.push({ x: boatX(myBoat) - 30, y: laneY(myBoat.lane) + 10, vx: rnd(-60, 20), vy: rnd(-80, -30), life: rnd(0.3, 0.5), max: 0.5 });
  splash.push({ x: boatX(myBoat) + 30, y: laneY(myBoat.lane) + 10, vx: rnd(-20, 60), vy: rnd(-80, -30), life: rnd(0.3, 0.5), max: 0.5 });
  // 能量满 → 冲刺
  if (energy >= 100 && sprintT <= 0) {
    energy = 0; sprintT = 1.4;
    sfxSprint();
    showMsg('冲刺！', '#ffca28');
  }
  // 鼓点
  if (drumHit % 2 === 0) { sfxDrum(); drumT = 0.15; }
  syncHud();
}
function boatX(b) {
  return 22 + b.dist * PXM;
}

function update(dt) {
  tick++;
  gameClock += dt;
  if (msgT > 0) msgT -= dt;
  if (state === 'countdown') {
    countdown -= dt;
    if (countdown <= 0) { state = 'play'; showMsg('开始！', '#a5f39a'); sfxDrum(); }
    return;
  }
  if (state !== 'play') return;

  raceTime += dt;
  myTime = raceTime;
  // 我的速度衰减
  if (sprintT > 0) {
    sprintT -= dt;
    mySpeed = Math.min(6.8, mySpeed + 2.2 * dt);
  } else {
    // 按比例衰减：越快掉得越快 → 点多快就游多快
    mySpeed = Math.max(0.35, mySpeed - mySpeed * 1.6 * dt);
  }
  myBoat.dist += mySpeed * dt;
  myBoat.phase += dt * (2.5 + mySpeed * 1.4);
  // 鼓声随速度
  if (drumT > 0) drumT -= dt;

  // 对手
  for (var i = 0; i < boats.length; i++) {
    var b = boats[i];
    if (b.isMe) continue;
    b.phase += dt * (2.5 + b.speed * 1.4);
    b.burstT -= dt;
    var sp = b.base + Math.sin(b.phase * 0.35) * 0.15;
    if (b.burstT <= 0) {
      b.burstT = rnd(4, 8);
      b.speed = b.base + rnd(0.25, 0.5);   // 小爆发
      b.burst = 1.2;
    }
    if (b.burst > 0) { b.burst -= dt; if (b.burst <= 0) b.speed = b.base; }
    b.dist += sp * dt;
  }

  // 到终点
  if (myBoat.dist >= raceDist) {
    myBoat.dist = raceDist;
    finishRace();
    return;
  }
  syncHud();
}
function finishRace() {
  state = 'over';
  // 名次：比完成时间。我的时间 = raceTime；对手预计时间 = raceDist/平均速度
  var myT = raceTime;
  var ahead = 0;
  for (var i = 0; i < boats.length; i++) {
    var b = boats[i];
    if (b.isMe) continue;
    // 已经到终点的对手：必然在我前面；没到的按当前速度估算
    var est = (b.dist >= raceDist) ? myT - 1 : (raceDist - b.dist) / Math.max(0.5, b.base) + myT;
    if (est < myT - 0.001) ahead++;
  }
  rank = ahead + 1;
  var first = rank === 1;
  sfxWin();
  var rid = ++roundId;
  if (first) {
    var last = race >= RACES.length - 1;
    $('overlayBox').innerHTML =
      '<div class="overlay"><div class="card">' +
        '<h2>第一名！</h2>' +
        '<div class="stars">★★★</div>' +
        '<div class="rule">你划到了 <b>第 1 名</b>！<br>用时 <b>' + myT.toFixed(1) + '</b> 秒</div>' +
        (last
          ? '<button class="bigbtn" id="ovAgain">领奖杯！</button>'
          : '<button class="bigbtn blue" id="ovNext">下一场</button>') +
        '<button class="smallbtn" id="ovReplay">再划一次</button>' +
      '</div></div>';
    $('ovNext') && ($('ovNext').onclick = function () { if (rid !== roundId) return; race++; showIntro(); });
    $('ovAgain') && ($('ovAgain').onclick = function () { if (rid !== roundId) return; showFinal(); });
    $('ovReplay').onclick = function () { if (rid !== roundId) return; startRace(); };
  } else {
    $('overlayBox').innerHTML =
      '<div class="overlay"><div class="card">' +
        '<h2>第 ' + rank + ' 名</h2>' +
        '<div class="rule">差一点点就第一啦！<br>手指再快一点，就能追上！</div>' +
        '<button class="bigbtn blue" id="ovRetry">再冲一次！</button>' +
        '<button class="smallbtn" id="ovMenu2">回菜单</button>' +
      '</div></div>';
    $('ovRetry').onclick = function () { if (rid !== roundId) return; startRace(); };
    $('ovMenu2').onclick = function () { if (rid !== roundId) return; showMenu(); };
  }
}
function showIntro() {
  // 下一场：先亮出对手
  state = 'over';
  var R = RACES[race];
  var foes = {};
  var foeList = [];
  for (var i = 0; i < R.foes.length; i++) {
    if (!foes[R.foes[i]]) { foes[R.foes[i]] = 1; foeList.push(TEAMS[R.foes[i]]); }
  }
  var html = '<div class="overlay"><div class="card">' +
    '<h2>第 ' + (race + 1) + ' 场 · ' + R.label + '</h2>' +
    '<div class="rule">距离 <b>' + R.dist + '</b> 米，和这些队比赛：</div>';
  for (var j = 0; j < foeList.length; j++) {
    var T = foeList[j];
    html += '<div class="foeRow">' + teamIcon(T.look, T.color) +
      '<div><div class="fn">' + T.name + '</div><div class="fd">' + T.desc + '</div></div></div>';
  }
  html += '<button class="bigbtn blue" id="ovGo">出发！</button>' +
    '<button class="smallbtn" id="ovMenu3">回菜单</button></div></div>';
  $('overlayBox').innerHTML = html;
  var rid = ++roundId;
  $('ovGo').onclick = function () { if (rid !== roundId) return; startRace(); };
  $('ovMenu3').onclick = function () { if (rid !== roundId) return; showMenu(); };
}
function showFinal() {
  state = 'over';
  sfxWin();
  var rid = ++roundId;
  $('overlayBox').innerHTML =
    '<div class="overlay"><div class="card">' +
      '<h1>龙舟冠军！</h1>' +
      '<div class="stars">★★★</div>' +
      '<div class="rule">5 场比赛全部第一名！<br>你和你的 10 个队员是最棒的！</div>' +
      '<button class="bigbtn" id="ovAgain2">再比一次</button>' +
      '<button class="smallbtn" id="ovMenu4">回菜单</button>' +
    '</div></div>';
  $('ovAgain2').onclick = function () { if (rid !== roundId) return; startGame(); };
  $('ovMenu4').onclick = function () { if (rid !== roundId) return; showMenu(); };
}
function showMenu() {
  state = 'menu';
  hideOverlay();
  $('overlayBox').innerHTML =
    '<div class="overlay"><div class="card">' +
      '<h1>划龙舟</h1>' +
      '<div class="rule">你的龙舟上有 <b>10 个队员</b>（左右各 5 个）<br>快快点屏幕划桨，<b>按得越快划得越快</b>！</div>' +
      '<div class="rows">' +
        '<span class="pill">5 场比赛</span><span class="pill y">对手越来越快</span><span class="pill g">连击攒冲刺</span>' +
      '</div>' +
      '<div class="small">能量满了自动冲刺！赢 5 场拿到第一名</div>' +
      '<button class="bigbtn" id="ovStart">开始划！</button>' +
    '</div></div>';
  $('ovStart').onclick = function () { audio(); startGame(); };
}
function hideOverlay() { $('overlayBox').innerHTML = ''; }
function syncHud() {
  $('raceTxt').textContent = '第 ' + (race + 1) + ' 场';
  $('distTxt').textContent = '还剩 ' + Math.max(0, Math.ceil(raceDist - myBoat.dist)) + 'm';
  $('spdTxt').textContent = '速度 ' + mySpeed.toFixed(1);
  $('energyTxt').textContent = '冲刺 ' + Math.round(energy) + '%';
}
function showMsg(t, c) { msgT = 1.5; msgTxt = t; msgCol = c || '#fff'; }
function teamIcon(look, color) {
  var c = color;
  if (look === 'otter') return '<svg viewBox="0 0 48 48"><ellipse cx="24" cy="28" rx="17" ry="13" fill="' + c + '"/><circle cx="24" cy="22" r="9" fill="#d9a06a"/><circle cx="20" cy="20" r="2.2" fill="#333"/><circle cx="28" cy="20" r="2.2" fill="#333"/><ellipse cx="17" cy="26" rx="2.6" ry="1.8" fill="#5b3a1e"/><ellipse cx="31" cy="26" rx="2.6" ry="1.8" fill="#5b3a1e"/></svg>';
  if (look === 'dolphin') return '<svg viewBox="0 0 48 48"><path d="M6 28 Q10 12 30 14 Q44 16 42 26 Q40 34 30 30 Q18 26 6 28 Z" fill="' + c + '"/><path d="M34 18 Q42 10 40 20" stroke="' + c + '" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="30" cy="19" r="2.4" fill="#fff"/><circle cx="31" cy="19" r="1.2" fill="#333"/></svg>';
  if (look === 'fox') return '<svg viewBox="0 0 48 48"><path d="M12 10 L6 22 L12 18 L12 40 Q12 44 16 44 H32 Q36 44 36 40 L36 18 L42 22 L36 10 L30 20 H18 Z" fill="' + c + '"/><path d="M18 20 L14 30 L20 27" fill="#fff"/><circle cx="20" cy="26" r="2.2" fill="#333"/><circle cx="29" cy="26" r="2.2" fill="#333"/><path d="M20 32 q4 3 8 0" stroke="#5b3a1e" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  if (look === 'tiger') return '<svg viewBox="0 0 48 48"><circle cx="24" cy="25" r="16" fill="' + c + '"/><path d="M8 12 L14 20 M40 12 L34 20" stroke="#ffca28" stroke-width="3" stroke-linecap="round"/><circle cx="19" cy="23" r="2.4" fill="#fff"/><circle cx="29" cy="23" r="2.4" fill="#fff"/><circle cx="19.6" cy="23.4" r="1.2" fill="#333"/><circle cx="29.6" cy="23.4" r="1.2" fill="#333"/><path d="M24 27 L22 31 L26 31 Z" fill="#333"/><path d="M20 35 q4 3 8 0" stroke="#ffca28" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 48 48"><path d="M14 40 Q10 18 24 10 Q38 18 34 40 Q28 44 14 40 Z" fill="' + c + '"/><circle cx="20" cy="24" r="2.4" fill="#fff"/><circle cx="28" cy="24" r="2.4" fill="#fff"/><circle cx="20.6" cy="24.4" r="1.2" fill="#333"/><circle cx="28.6" cy="24.4" r="1.2" fill="#333"/><path d="M22 29 l2 5 2-5 z" fill="#ffca28"/></svg>';
}

/* ================= 绘制 ================= */
function draw() {
  ctx.clearRect(0, 0, W, H);
  // 河流
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7fc4e8'); g.addColorStop(0.5, '#4a9ad8'); g.addColorStop(1, '#2a6fb8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 波纹
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2;
  for (var wv = 0; wv < 6; wv++) {
    ctx.beginPath();
    for (var wx = 0; wx <= W; wx += 24) {
      var wy = LANE0 + wv * LANEH / 6 + Math.sin(wx * 0.03 + tick * 0.04 + wv) * 5;
      if (wx === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    ctx.stroke();
  }
  // 赛道分界线
  for (var ln = 1; ln < LANES; ln++) {
    var ly = LANE0 + LANEH / LANES * ln;
    ctx.setLineDash([10, 9]);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
    ctx.setLineDash([]);
  }
  // 终点线
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillRect(finishX - 3, LANE0 - 8, 6, LANEH + 16);
  ctx.fillStyle = '#e53935';
  for (var fl = 0; fl < LANES; fl++) {
    ctx.beginPath(); ctx.moveTo(finishX, LANE0 + LANEH / LANES * fl + 6); ctx.lineTo(finishX - 14, LANE0 + LANEH / LANES * fl + 14); ctx.lineTo(finishX, LANE0 + LANEH / LANES * fl + 22); ctx.closePath(); ctx.fill();
  }
  // 起点
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(22, LANE0 - 8); ctx.lineTo(22, LANE0 + LANEH + 8); ctx.stroke();

  // 水花
  for (var sp = 0; sp < splash.length; sp++) {
    var q = splash[sp];
    ctx.save();
    ctx.globalAlpha = clamp(q.life / 0.3, 0, 0.8);
    ctx.fillStyle = '#e8f6ff';
    ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, 7); ctx.fill();
    ctx.restore();
  }

  // 船
  for (var i = 0; i < boats.length; i++) drawBoat(boats[i]);

  // 倒计时
  if (state === 'countdown') {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '900 ' + Math.round(clamp(W * 0.14, 60, 110)) + 'px sans-serif';
    ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(10,30,60,.6)';
    var num = Math.max(0, Math.ceil(countdown));
    ctx.strokeText(num === 0 ? 'GO!' : num, W / 2, H * 0.42);
    ctx.fillStyle = '#ffca28'; ctx.fillText(num === 0 ? 'GO!' : num, W / 2, H * 0.42);
    ctx.restore();
  }

  // 消息
  if (msgT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(msgT / 0.4, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '900 ' + Math.round(clamp(W * 0.055, 20, 34)) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(10,30,60,.75)';
    ctx.strokeText(msgTxt, W / 2, H * 0.16);
    ctx.fillStyle = msgCol; ctx.fillText(msgTxt, W / 2, H * 0.16);
    ctx.restore();
  }
  // 飘字
  for (var k = 0; k < parts.length; k++) {
    var p2 = parts[k];
    ctx.save();
    ctx.globalAlpha = clamp(p2.life / 0.5, 0, 1);
    ctx.font = '900 ' + Math.round(clamp(W * 0.045, 16, 26)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,30,60,.7)';
    ctx.strokeText(p2.txt, p2.x, p2.y);
    ctx.fillStyle = p2.c; ctx.fillText(p2.txt, p2.x, p2.y);
    ctx.restore();
  }
  // 彩带
  for (var c = 0; c < confetti.length; c++) {
    var cf = confetti[c];
    ctx.save();
    ctx.globalAlpha = clamp(cf.life / 0.6, 0, 1);
    ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot);
    ctx.fillStyle = cf.c;
    ctx.fillRect(-cf.s / 2, -cf.s / 3, cf.s, cf.s * 0.66);
    ctx.restore();
  }
}
function drawBoat(b) {
  var x = boatX(b), y = laneY(b.lane);
  var L = 150, W2 = 30;                     // 船长/半宽
  ctx.save();
  ctx.translate(x, y);
  if (b.isMe && sprintT > 0) {
    ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 22;
  }
  // 水波
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.ellipse(0, 14, L * 0.42, 7, 0, 0, 7); ctx.fill();
  // 船身
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.moveTo(-L * 0.5, -4);
  ctx.quadraticCurveTo(0, -W2 - 2, L * 0.5, -4);
  ctx.lineTo(L * 0.42, 6);
  ctx.quadraticCurveTo(0, W2, -L * 0.42, 6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-L * 0.5, -4);
  ctx.quadraticCurveTo(0, -W2 - 2, L * 0.5, -4);
  ctx.lineTo(L * 0.42, 6);
  ctx.quadraticCurveTo(0, W2, -L * 0.42, 6);
  ctx.closePath(); ctx.stroke();
  // 鳞片纹
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.6;
  for (var sc = 1; sc <= 4; sc++) {
    var sx = -L * 0.3 + sc * L * 0.15;
    ctx.beginPath(); ctx.arc(sx, -2, 8, 0, Math.PI); ctx.stroke();
  }
  // 龙头
  drawHead(b, -L * 0.5);
  // 龙尾
  ctx.fillStyle = b.color;
  ctx.beginPath(); ctx.moveTo(L * 0.48, -6); ctx.quadraticCurveTo(L * 0.62, -12, L * 0.55, -2); ctx.quadraticCurveTo(L * 0.66, 6, L * 0.44, 6); ctx.closePath(); ctx.fill();
  // 鼓手（船头）
  drawDrummer(b, -L * 0.3, b.isMe);
  // 划手：5 排 × 2 人
  var rowers = 5;
  for (var row = 0; row < rowers; row++) {
    var rx = -L * 0.22 + row * L * 0.13;
    drawRower(b, rx, -9, 1, row);       // 左侧
    drawRower(b, rx, 9, -1, row);       // 右侧
  }
  // 名字
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '900 ' + Math.round(clamp(W * 0.03, 11, 15)) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,30,60,.6)';
  ctx.strokeText(b.name, 0, 26);
  ctx.fillText(b.name, 0, 26);
  ctx.restore();
}
function drawHead(b, hx) {
  ctx.save();
  ctx.translate(hx, -6);
  ctx.scale(-1, 1);
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.moveTo(-10, -10);
  ctx.quadraticCurveTo(8, -22, 20, -6);
  ctx.quadraticCurveTo(30, 2, 14, 10);
  ctx.quadraticCurveTo(4, 16, -8, 8);
  ctx.closePath(); ctx.fill();
  // 角
  ctx.fillStyle = b.color;
  ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(16, -26); ctx.lineTo(18, -12); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2, -18); ctx.lineTo(-8, -28); ctx.lineTo(-6, -12); ctx.closePath(); ctx.fill();
  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(16, -4, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(17, -4, 2, 0, 7); ctx.fill();
  // 鼻孔
  ctx.fillStyle = '#5b3a1e';
  ctx.beginPath(); ctx.arc(4, 2, 1.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(8, 3, 1.6, 0, 7); ctx.fill();
  // 龙须
  ctx.strokeStyle = b.color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(6, -12); ctx.quadraticCurveTo(14, -16, 22, -12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, -10); ctx.quadraticCurveTo(16, -14, 22, -8); ctx.stroke();
  ctx.restore();
}
function drawDrummer(b, dx, isMe) {
  ctx.save();
  ctx.translate(dx, 0);
  var bob = Math.sin(b.phase * 0.7) * 2;
  // 鼓
  ctx.fillStyle = '#d8481e';
  ctx.beginPath(); ctx.ellipse(0, 3, 9, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, 7); ctx.fill();
  // 鼓手
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath(); ctx.arc(0, -10 + bob, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#5b3a1e';
  ctx.beginPath(); ctx.arc(0, -12 + bob, 6, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(2, -10 + bob, 1.2, 0, 7); ctx.fill();
  // 鼓棒（挥动）
  var swing = isMe ? Math.sin(tick * 0.4) : Math.sin(b.phase * 0.6);
  ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(2, -4 + bob); ctx.lineTo(2 + swing * 8, -1 + bob); ctx.stroke();
  ctx.restore();
}
function drawRower(b, rx, ry, side, row) {
  ctx.save();
  ctx.translate(rx, ry);
  var ph = b.phase + row * 0.35 * side;
  var swing = Math.sin(ph) * 0.7;
  // 船桨
  ctx.strokeStyle = '#a06a2a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(side * 4, 6); ctx.lineTo(side * (6 + swing * 9), 6 + Math.abs(swing) * 8); ctx.stroke();
  ctx.fillStyle = '#d9a06a';
  ctx.beginPath(); ctx.ellipse(side * (6 + swing * 9), 6 + Math.abs(swing) * 8, 3, 2, 0, 0, 7); ctx.fill();
  // 身体（倾斜）
  ctx.save();
  ctx.rotate(swing * 0.2 * side);
  ctx.fillStyle = b.isMe ? '#ff5f6d' : '#6b8fd9';
  roundRect(-4, -8, 8, 9, 3); ctx.fill();
  ctx.restore();
  // 头
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath(); ctx.arc(side * 1, -12, 4.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#5b3a1e';
  ctx.beginPath(); ctx.arc(side * 1, -13.5, 4.2, Math.PI, 0); ctx.fill();
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ================= 输入 ================= */
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); audio();
  if (state === 'countdown' || state === 'play') paddle();
});
cv.addEventListener('pointermove', function (e) {
  e.preventDefault();
  if (state === 'countdown' || state === 'play') paddle();
});
$('menuBtn').onclick = function () { audio(); sfxTick(); showMenu(); };

/* ================= 测试钩子 ================= */
window.__dragon = {
  get state() { return state; },
  get race() { return race + 1; },
  get label() { return RACES[race].label; },
  get dist() { return raceDist; },
  get myDist() { return Math.round(myBoat.dist); },
  get remaining() { return Math.max(0, Math.round(raceDist - myBoat.dist)); },
  get mySpeed() { return mySpeed; },
  get energy() { return energy; },
  get sprintT() { return sprintT; },
  get myTime() { return raceTime; },
  get rank() { return rank; },
  get foes() { return boats.filter(function (b) { return !b.isMe; }).map(function (b) { return { name: b.name, dist: Math.round(b.dist), speed: +b.speed.toFixed(2) }; }); },
  start: function () { startGame(); },
  toRace: function (n) { race = clamp(n, 0, RACES.length - 1); startRace(); },
  paddle: function () { paddle(); },
  // 自动狂点划桨直到结束
  autoPlay: function (clicksPerSec) {
    var cps = clicksPerSec || 8;
    var guard = 0;
    var last = 0;
    while (state === 'play' && guard++ < 40000) {
      var now = guard;
      if (now - last >= Math.max(1, Math.round(1000 / cps / 16.7))) {
        paddle();
        last = now;
      }
      update(0.016);   // 测试用：直接推进游戏
    }
    return { state: state, rank: rank, myTime: raceTime, dist: Math.round(myBoat.dist) };
  },
  tick: function (sec) {
    var steps = Math.max(1, Math.round(sec / 0.016));
    for (var s = 0; s < steps; s++) {
      if (state === 'countdown' || state === 'play') update(0.016);
    }
    return { state: state, myDist: Math.round(myBoat.dist), rank: rank };
  }
};

/* ================= 启动 ================= */
function loop(t) {
  var dt = Math.min((t - lastT) / 1000 || 0.016, 0.05);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', function () { resize(); });
resize();
startRace();    // 垫一局，保证首帧有船
showMenu();
requestAnimationFrame(loop);
})();
</script>
