<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝宝的游戏盒子</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(170deg, #a8e6ff 0%, #c9b6ff 55%, #ffc3d8 100%);
    background-attachment: fixed; overflow: hidden; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 10px 12px 12px; gap: 10px; }

  /* ---------- 顶栏 ---------- */
  .bar { flex: none; display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .bar .title {
    font-size: 20px; font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 rgba(120,90,180,.45); white-space: nowrap;
  }
  .homebtn {
    flex: none; border: none; cursor: pointer; display: none;
    background: #fff; color: #5b4b8a; font-size: 14px; font-weight: 900;
    border-radius: 12px; padding: 8px 13px; box-shadow: 0 3px 0 rgba(120,90,180,.25);
  }
  .homebtn:active { transform: translateY(2px); box-shadow: none; }
  .bar.showback .homebtn { display: block; }
  .bar.showback .title { font-size: 16px; }
  .quick { margin-left: auto; display: none; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .bar.showback .quick { display: flex; }
  .quick::-webkit-scrollbar { display: none; }
  .chip {
    border: none; cursor: pointer; background: rgba(255,255,255,.75); color: #5b4b8a;
    font-size: 13px; font-weight: 800; border-radius: 11px; padding: 7px 11px;
    box-shadow: 0 2px 0 rgba(120,90,180,.2); white-space: nowrap; flex: none;
  }
  .chip:active { transform: translateY(2px); box-shadow: none; }
  .chip.cur { background: #ffd34d; color: #fff; box-shadow: 0 2px 0 #e0a712; }

  /* 切换按钮（图标/列表） */
  .viewbtn {
    flex: none; border: none; cursor: pointer; background: rgba(255,255,255,.85);
    color: #5b4b8a; font-size: 13px; font-weight: 900; border-radius: 11px; padding: 7px 12px;
    box-shadow: 0 2px 0 rgba(120,90,180,.2);
  }
  .viewbtn:active { transform: translateY(2px); box-shadow: none; }
  body.playing .viewbtn { display: none; }

  /* ---------- 舞台 ---------- */
  .stage { flex: 1; min-height: 0; display: flex; }

  /* ===== 图标网格模式（默认，整齐好选） ===== */
  #home.grid {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; align-content: start; gap: 12px; padding: 2px 2px 10px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    max-width: 640px; width: 100%; margin: 0 auto;
  }
  @media (min-width: 620px) {
    #home.grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; max-width: 820px; }
  }
  @media (min-width: 980px) {
    #home.grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; max-width: 980px; align-content: center; }
  }
  @media (min-width: 1280px) {
    #home.grid { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px; max-width: 1240px; }
  }
  .tile .pic { width: 62%; }
  .tile {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: #fffdf6; border: 4px solid #fff; border-radius: 22px; padding: 13px 6px 10px;
    box-shadow: 0 8px 18px rgba(80,60,140,.2); cursor: pointer; font-family: inherit;
    transition: transform .14s, box-shadow .14s; width: 100%;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(80,60,140,.3); }
  .tile:active { transform: translateY(1px); }
  .tile .no {
    position: absolute; top: 5px; left: 8px; font-size: 12px; font-weight: 900; color: #cbb8ec;
  }
  .tile .pic {
    width: 66%; aspect-ratio: 1; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .tile .pic svg { width: 70%; height: 70%; }
  .tile .nm { font-size: 15px; font-weight: 900; color: #5b4b8a; white-space: nowrap; }

  /* ===== 列表模式（家长看详细介绍） ===== */
  #home.list {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 12px; padding: 2px 2px 10px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .card {
    display: flex; align-items: center; gap: 15px; cursor: pointer;
    background: #fffdf6; border: 5px solid #fff; border-radius: 24px; padding: 12px 16px;
    box-shadow: 0 8px 20px rgba(80,60,140,.2); transition: .16s; text-align: left;
    font-family: inherit; width: 100%;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(80,60,140,.3); }
  .card:active { transform: translateY(2px); }
  .card .no {
    font-size: 15px; font-weight: 900; color: #cbb8ec; flex: none; width: 26px; text-align: center;
  }
  .card .pic {
    width: 60px; height: 60px; flex: none; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .card .pic svg { width: 46px; height: 46px; }
  .card .txt { flex: 1; min-width: 0; }
  .card .t { font-size: 19px; font-weight: 900; color: #5b4b8a; margin-bottom: 3px; }
  .card .d { font-size: 13.5px; color: #8a7ab0; font-weight: 700; line-height: 1.55; }
  .card .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; font-weight: 800; border-radius: 9px; padding: 2px 8px; background: #ffefc9; color: #c98a10; }
  .tag.time { background: #dff3e0; color: #4a9c55; }

  /* 玩游戏的 iframe */
  #frame {
    flex: 1; min-height: 0; width: 100%; border: none; border-radius: 20px; display: none;
    background: #fff; box-shadow: 0 10px 26px rgba(60,80,140,.28);
  }
  body.playing #home { display: none; }
  body.playing #frame { display: block; }

  /* ---------- 底部说明 ---------- */
  .foot {
    flex: none; text-align: center; font-size: 12.5px; font-weight: 700; color: #5b4b8a;
    background: rgba(255,255,255,.55); border-radius: 14px; padding: 7px 12px; line-height: 1.7;
  }
  body.playing .foot { display: none; }
</style>
</head>
<body>
<div id="app">

  </div>

  <div class="stage">
    <section id="home"></section>
    <iframe id="frame" title="游戏画面" allow="autoplay"></iframe>
  </div>

  <div class="foot">每天玩 1~2 个就停，别让孩子玩累 · 手机 / 平板 / 电脑都能打开</div>
</div>

const $ = id => document.getElementById(id);
let cur = -1;
let viewMode = localStorage.getItem('viewMode') || 'grid';

// ===== 两种视图：图标网格（默认） / 列表（家长看详情） =====
function renderHome() {
  $('home').className = viewMode;
  if (viewMode === 'grid') {
    $('home').innerHTML = GAMES.map((g, i) =>
      '<button class="tile" data-i="' + i + '">' +
        '<span class="no">' + (i + 1) + '</span>' +
        '<span class="pic" style="background:' + g.bg + '">' + g.icon + '</span>' +
        '<span class="nm">' + g.short + '</span>' +
      '</button>'
    ).join('');
  } else {
    $('home').innerHTML = GAMES.map((g, i) =>
      '<button class="card" data-i="' + i + '">' +
        '<span class="no">' + (i + 1) + '</span>' +
        '<div class="pic" style="background:' + g.bg + '">' + g.icon + '</div>' +
        '<div class="txt">' +
          '<div class="t">' + g.name + '</div>' +
          '<div class="d">' + g.desc + '<br>' + g.sub + '</div>' +
          '<div class="meta"><span class="tag">' + g.tag + '</span><span class="tag time">' + g.time + '</span></div>' +
        '</div>' +
      '</button>'
    ).join('');
  }
}
$('viewBtn').onclick = function () {
  viewMode = viewMode === 'grid' ? 'list' : 'grid';
  localStorage.setItem('viewMode', viewMode);
  this.textContent = viewMode === 'grid' ? '列表' : '图标';
  renderHome();
};
$('viewBtn').textContent = viewMode === 'grid' ? '列表' : '图标';

// 快速切换小标签
$('quick').innerHTML = GAMES.map((g, i) =>
  '<button class="chip" data-i="' + i + '">' + g.short + '</button>'
).join('');

function play(i) {
  if (i === cur) return;
  cur = i;
  const g = GAMES[i];
  document.body.classList.add('playing');
  $('bar').classList.add('showback');
  $('barTitle').textContent = g.name;
  [...$('quick').children].forEach((c, k) => c.className = 'chip' + (k === i ? ' cur' : ''));
  const f = $('frame');
  f.src = 'about:blank';                 // 先清空，保证换游戏时旧的定时器全部销毁
  setTimeout(() => { f.src = encodeURI(g.file); }, 30);
}
function goHome() {
  cur = -1;
  document.body.classList.remove('playing');
  $('bar').classList.remove('showback');
  $('barTitle').textContent = '宝宝的游戏盒子';
  const f = $('frame');
  f.src = 'about:blank';
}
$('home').addEventListener('click', e => {
  const b = e.target.closest('.tile, .card');
  if (b) play(+b.dataset.i);
});
$('quick').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (b) play(+b.dataset.i);
});
$('btnHome').onclick = goHome;
renderHome();

// 地址栏带 #2 可直接进第二个游戏
const m = /^#(\d+)$/.exec(location.hash);
if (m && GAMES[+m[1]]) play(+m[1]);
</script>
