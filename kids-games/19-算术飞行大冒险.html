<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>算术飞行大冒险 · 6~8岁数学撞怪兽</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(180deg, #7fc4f5 0%, #b9dcff 45%, #ffd9e8 100%);
    overflow: hidden; user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #app {
    position: relative; width: 100%; max-width: 560px; height: 100%; max-height: 920px;
    display: flex; flex-direction: column; padding: 8px 10px 10px; gap: 6px;
  }

  /* ===== 顶部栏 ===== */
  .topbar { flex: none; display: flex; align-items: center; gap: 8px; }
  .topbar .ttl {
    font-size: 17px; font-weight: 900; color: #fff;
    text-shadow: 0 2px 0 rgba(60,90,160,.5); flex: 1; white-space: nowrap; overflow: hidden;
  }
  .iconbtn {
    flex: none; border: none; cursor: pointer; background: #fff; color: #5b4b8a;
    font-size: 14px; font-weight: 800; border-radius: 12px; padding: 6px 10px;
    box-shadow: 0 3px 0 rgba(120,90,180,.28);
  }
  .iconbtn:active { transform: translateY(2px); box-shadow: none; }

  /* ===== HUD ===== */
  .hud { flex: none; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.62);
    border-radius: 16px; padding: 6px 12px; box-shadow: 0 3px 10px rgba(60,80,150,.14); flex-wrap: wrap; }
  .hud .hearts { display: flex; gap: 2px; }
  .hud .hearts svg { width: 20px; height: 20px; display: block; }
  .hud .score { font-size: 15px; font-weight: 900; color: #5b4b8a; }
  .hud .score b { color: #e08a12; font-size: 17px; }
  .hud .combo { font-size: 13px; font-weight: 900; color: #fff; background: linear-gradient(#ff9a3d,#ff5f7a);
    border-radius: 11px; padding: 3px 9px; }
  .hud .stars { margin-left: auto; font-size: 15px; font-weight: 900; color: #c98a1b; }
  .hud .lvl { font-size: 13px; font-weight: 900; color: #5b4b8a; }

  /* ===== 题目区 ===== */
  #quiz { flex: none; display: none; background: rgba(255,255,255,.95); border-radius: 14px;
    padding: 8px 10px 10px; box-shadow: 0 4px 14px rgba(40,60,140,.25); }
  #quiz .qtop { display: flex; align-items: center; gap: 8px; }
  #quiz .qtxt { flex: 1; text-align: center; font-size: 26px; font-weight: 900; color: #3a4a8a; letter-spacing: 2px; min-height: 32px; }
  #quiz .qlabel { flex: none; font-size: 12px; font-weight: 900; color: #fff; background: #7aa2e8;
    border-radius: 9px; padding: 3px 9px; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  #quiz .opts { display: none; gap: 8px; margin-top: 8px; }
  #quiz .opt { flex: 1; border: none; cursor: pointer; font-family: inherit; border-radius: 12px;
    padding: 9px 0 8px; font-size: 24px; font-weight: 900; color: #fff; position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,.16); }
  #quiz .opt:active { transform: translateY(3px); box-shadow: none; }
  #quiz .opt .k { position: absolute; left: 7px; top: 5px; font-size: 11px; font-weight: 800; opacity: .85;
    background: rgba(255,255,255,.25); border-radius: 6px; padding: 1px 5px; font-style: normal; }
  #quiz .opt:disabled { filter: grayscale(.7) brightness(1.05); opacity: .55; }
  .o1 { background: linear-gradient(#66c05c,#3e9a4e); }
  .o2 { background: linear-gradient(#5fb2f0,#3a6fd8); }
  .o3 { background: linear-gradient(#ffae5c,#ff8a3c); }
  #quiz .qhint { margin-top: 3px; font-size: 13px; font-weight: 900; color: #e08a12; text-align: center; letter-spacing: .5px; }
  #quiz .timerbar { margin-top: 6px; height: 7px; background: #eee; border-radius: 5px; overflow: hidden; }
  #quiz .timerbar i { display: block; height: 100%; background: linear-gradient(90deg,#ff5f7a,#ff9a3d); width: 100%; border-radius: 5px; }
  #quiz.wrong .qtxt { animation: qshake .4s; color: #e05555; }
  #quiz.right .qtxt { animation: qpop .35s; color: #3e9a4e; }
  @keyframes qshake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
  @keyframes qpop { 0%{transform:scale(1)} 50%{transform:scale(1.16)} 100%{transform:scale(1)} }

  /* ===== 画布区 ===== */
  #cvwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas#cv { touch-action: none; border-radius: 14px; box-shadow: 0 6px 18px rgba(40,60,140,.22); background: #bfe0ff; display: block; }
  #banner { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); z-index: 6;
    pointer-events: none; background: rgba(40,50,100,.85); color: #fff; border-radius: 16px;
    padding: 14px 22px; font-size: 20px; font-weight: 900; text-align: center; opacity: 0;
    transition: opacity .25s; max-width: 92%; }
  #banner small { display: block; font-size: 13px; font-weight: 700; opacity: .9; margin-top: 5px; }
  #banner.show { opacity: 1; }
  #flash { position: absolute; inset: 0; z-index: 5; pointer-events: none; border-radius: 14px; opacity: 0; }

  /* ===== 浮层 ===== */
  .overlay { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(30,40,90,.45); border-radius: 14px; }
  .overlay.show { display: flex; }
  .panel { background: #fff; border-radius: 22px; padding: 20px 24px; text-align: center; max-width: 90%;
    box-shadow: 0 10px 30px rgba(20,30,80,.35); max-height: 94%; overflow-y: auto; }
  .panel h1 { margin: 0 0 6px; font-size: 24px; color: #5b4b8a; }
  .panel .sub { color: #8a7ba8; font-size: 14px; margin-bottom: 8px; line-height: 1.6; }
  .bigbtn { display: block; width: 100%; border: none; cursor: pointer; font-family: inherit; border-radius: 14px;
    padding: 12px; font-size: 17px; font-weight: 900; color: #fff; margin-top: 9px;
    background: linear-gradient(#7ad46b,#3e9a4e); box-shadow: 0 4px 0 rgba(0,0,0,.16); }
  .bigbtn:active { transform: translateY(3px); box-shadow: none; }
  .bigbtn.blue { background: linear-gradient(#5fb2f0,#3a6fd8); }
  .bigbtn.orange { background: linear-gradient(#ffae5c,#ff8a3c); }
  .bigbtn.gray { background: linear-gradient(#b9b3d6,#8f86b0); }
  .modebox { display: flex; gap: 8px; margin: 10px 0 2px; }
  .mode { flex: 1; border: 3px solid #dcd6ee; background: #f6f3ff; border-radius: 14px; padding: 9px 3px;
    font-family: inherit; cursor: pointer; }
  .mode b { display: block; font-size: 15px; color: #5b4b8a; }
  .mode span { font-size: 11px; color: #8a7ba8; line-height: 1.3; display: block; margin-top: 2px; }
  .mode.cur { border-color: #ff9a3d; background: #fff6e8; }
  .starsbig { font-size: 40px; margin: 6px 0; }
  .statline { font-size: 16px; font-weight: 800; color: #5b4b8a; margin: 3px 0; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="ttl">✈️ 算术飞行大冒险</div>
    <button class="iconbtn" id="sndBtn">🔊</button>
    <button class="iconbtn" id="backBtn">返回大厅</button>
  </div>

  <div class="hud">
    <span class="hearts" id="heartsBox"></span>
    <span class="lvl" id="lvlTxt">第 1 关</span>
    <span class="score">得分 <b id="scoreTxt">0</b></span>
    <span class="combo" id="comboTxt" style="display:none">连击×2</span>
    <span class="stars" id="starTxt">⭐0/3</span>
  </div>

  <!-- 题目条 -->
  <div id="quiz">
    <div class="qtop"><span class="qlabel" id="qLabel">第1关</span><div class="qtxt" id="qText">3 + 5 = ?</div></div>
    <div class="qhint" id="qHint">算出答案，去撞背上数字一样的怪兽！</div>
    <div class="timerbar" id="timerBar" style="display:none"><i></i></div>
    <div class="opts" id="opts" style="display:none"></div>
  </div>

  <div id="cvwrap">
    <canvas id="cv" width="480" height="700"></canvas>
    <div id="banner"></div>
    <div id="flash"></div>
  </div>

  <!-- 开始菜单 -->
  <div class="overlay show" id="menuOv">
    <div class="panel">
      <h1>✈️ 算术飞行大冒险</h1>
      <div class="sub">怪兽都背着数字牌！算出题目的答案，<br>开飞机去撞那只数字对的怪兽～<br>撞错会惹恼它，当心炸弹怪！</div>
      <div style="font-size:12px;font-weight:800;color:#8a7ba8">家长模式 · 选题目难度</div>
      <div class="modebox" id="modeBox">
        <button class="mode" data-m="easy"><b>加法</b><span>只练 10 以内加法</span></button>
        <button class="mode cur" data-m="std"><b>加减混合</b><span>20 以内加减法</span></button>
        <button class="mode" data-m="hard"><b>挑战</b><span>加减+连加+乘法</span></button>
      </div>
      <button class="bigbtn" id="startBtn">🚀 开始游戏</button>
      <button class="bigbtn gray" id="backBtn2">返回大厅</button>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="overlay" id="pauseOv">
    <div class="panel">
      <h1>⏸️ 休息一下</h1>
      <div class="sub">答对题目，星星会掉下来，<br>集满 3 颗能放超级激光！</div>
      <button class="bigbtn" id="resumeBtn">▶️ 继续游戏</button>
      <button class="bigbtn blue" id="restartBtn">🔄 重新开始</button>
      <button class="bigbtn gray" id="quitBtn">返回大厅</button>
    </div>
  </div>

  <!-- 过关 -->
  <div class="overlay" id="clearOv">
    <div class="panel">
      <h1 id="clearTitle">🎉 过关啦！</h1>
      <div class="statline" id="clearScore"></div>
      <button class="bigbtn" id="nextBtn">下一关 ➡️</button>
      <button class="bigbtn gray" id="clearBack">返回大厅</button>
    </div>
  </div>

  <!-- 通关 -->
  <div class="overlay" id="winOv">
    <div class="panel">
      <h1>🏆 全部通关！</h1>
      <div class="starsbig" id="winStars"></div>
      <div class="statline" id="winScore"></div>
      <div class="sub">你是最棒的算术小勇士！</div>
      <button class="bigbtn" id="againBtn">🔄 再玩一次</button>
      <button class="bigbtn gray" id="winBack">返回大厅</button>
    </div>
  </div>

  <!-- 失败 -->
  <div class="overlay" id="overOv">
    <div class="panel">
      <h1>💔 飞机被撞坏了</h1>
      <div class="statline" id="overScore"></div>
      <div class="sub">先算出答案再撞！撞到发怒的怪兽<br>或炸弹怪才会受伤，别急，盯准数字！</div>
      <button class="bigbtn orange" id="retryBtn">🔄 重新挑战</button>
      <button class="bigbtn gray" id="overBack">返回大厅</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
let muted = false, AC = null;
function beep(f,d,type,v){ if(muted) return; try{
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.value=v||0.11;
  o.connect(g); g.connect(AC.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+d);
  o.stop(AC.currentTime+d);
}catch(e){} }
function noise(d,vol){ if(muted) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const n=Math.max(1,Math.floor(AC.sampleRate*d)), buf=AC.createBuffer(1,n,AC.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const g=AC.createGain(); g.gain.value=vol||0.2;
  s.connect(g); g.connect(AC.destination); s.start();
}catch(e){} }
const S = {
  ok(){ beep(880,.09,'sine'); setTimeout(()=>beep(1320,.12,'sine'),80); },
  bad(){ beep(200,.22,'sawtooth',.08); },
  shoot(){ noise(.05,.04); beep(340,.04,'square',.02); },
  laser(){ beep(180,.16,'sawtooth',.1); noise(.12,.1); setTimeout(()=>beep(90,.2,'sawtooth',.1),30); },
  boom(){ noise(.22,.16); beep(90,.25,'triangle',.14); },
  star(){ beep(1046,.09); setTimeout(()=>beep(1568,.13),85); },
  clock(){ beep(660,.1); setTimeout(()=>beep(990,.16),100); },
  shield(){ beep(520,.1,'triangle'); setTimeout(()=>beep(780,.16,'triangle'),110); },
  hurt(){ beep(130,.35,'sawtooth',.18); noise(.2,.16); },
  bossIn(){ [196,247,294,392].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.1),i*160)); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.26),i*130)); }
};
function toggleSnd(){ muted=!muted; $('sndBtn').textContent=muted?'🔇':'🔊'; }
function goLobby(){ try{ if(window.parent&&window.parent.goHome){ window.parent.goHome(); return; } }catch(e){} location.href='游戏大厅.html'; }
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ==================== 状态 ==================== */
const MODE = {
  easy: { name:'加法',     q:[[10,'add'],[20,'add'],[12,'add','add3']] },
  std:  { name:'加减混合', q:[[10,'add','sub'],[20,'add','sub'],[20,'add','sub','add3']] },
  hard: { name:'挑战',     q:[[12,'add','sub','mul'],[20,'add','sub','mul'],[20,'add','sub','mul','add3']] }
};
const LEVELS = [
  { name:'数字草原', need:8,  hp:2, spd:[52,80],  max:4, boss:'数字巨人', tip:'连续答对 3 题打败它！' },
  { name:'算术森林', need:12, hp:3, spd:[70,105], max:5, boss:'猫头鹰博士', tip:'答对 5 题打败它！答错会下泡泡雨' },
  { name:'太空挑战', need:16, hp:4, spd:[95,135], max:6, boss:'太空大魔王', tip:'答对 6 题打败它！答错会扣一条命' }
];
const WAVE_N = [4,5,6];   // 每关每道题出几只数字怪兽
const BOSS_NEED = [3,5,6];
let state='menu', mode='std', level=0, running=false;
let lives=3, maxLives=3, score=0, combo=0, starsGot=0, shieldOn=false, clockT=0;
let wrongStreak=0, qLock=false, bossActive=false, bossConsec=0;
let kills=0, curQ=null, qTimer=0, qTotal=0, newQDelay=0, waveId=0;

/* ==================== 画布 ==================== */
const W=480, H=700;
const cv=$('cv'), ctx=cv.getContext('2d');
let cssScale=1;
function resize(){
  const wrap=$('cvwrap');
  const aw=wrap.clientWidth||300, ah=wrap.clientHeight||300;
  cssScale=Math.min(aw/W, ah/H);
  if(cssScale<=0) cssScale=1;
  cv.style.width=(W*cssScale)+'px';
  cv.style.height=(H*cssScale)+'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

/* ==================== 实体 ==================== */
let plane={x:W/2, y:H-60, w:44, h:26};
let enemies=[], ebullets=[], drops=[], parts=[], floaters=[];
let shakeT=0, flashT=0, flashCol='#fff', bossT=0, boss=null;

/* ==================== 题目生成（答案均为数字） ==================== */
function qnum(max){ return 1+Math.floor(Math.random()*max); }
/* 围绕正确答案生成互不相同的干扰数字（不超出 max，且尽量贴近答案） */
function distractors(ans, max, n){
  const out=[];
  let guard=0;
  while(out.length<n && guard++<100){
    let v;
    if(Math.random()<0.7){                       // 70% 贴近答案，考验辨别力
      v = ans + (Math.random()<0.5?-1:1)*(1+Math.floor(Math.random()*3));
    } else {                                     // 30% 稍远一点
      v = ans + (Math.random()<0.5?-1:1)*(3+Math.floor(Math.random()*3));
    }
    if(v<0) v = ans + 1+Math.floor(Math.random()*2);
    if(v>max) v = ans - (1+Math.floor(Math.random()*2));
    if(v<0 || v===ans || out.includes(v)) continue;
    out.push(v);
  }
  let g=0;
  while(out.length<n && g++<80){                 // 兜底
    const v=Math.floor(Math.random()*(max+1));
    if(v!==ans && !out.includes(v)) out.push(v);
  }
  return out;
}
/* 生成一道题：答案一定是数字（可背在怪兽身上），并给出数值范围 scope */
function makeQ(bossQ){
  const cfg = MODE[mode].q[level] || MODE[mode].q[2];
  const max=cfg[0];
  let types = cfg.slice(1);
  if(bossQ && level===0) types=['add3'];
  if(bossQ && level===2) types=['add','sub','mul'];
  let type = pick(types);
  let time = (level===2 && rnd(4)===0)? 6 : 0;
  if(bossQ && level===2) time = 4;

  let text='', ans=0;
  if(type==='add'){
    const a=qnum(Math.min(9,Math.max(1,max-1))), b=qnum(Math.max(1,max-a));
    text = a+' + '+b+' = ?'; ans=a+b;
  } else if(type==='add3'){
    const rem = Math.max(1,max-2);
    const a = qnum(rem);
    const b = qnum(Math.max(1, Math.min(rem+1, max-a-1)));
    const c = qnum(Math.max(1, max-a-b));
    ans=a+b+c;
    text = a+' + '+b+' + '+c+' = ?';
  } else if(type==='sub'){
    const a=qnum(max), b=qnum(a);
    text = a+' - '+b+' = ?'; ans=a-b;
  } else if(type==='mul'){
    const a=2+rnd(4), b=2+rnd(4);
    text = a+' × '+b+' = ?'; ans=a*b;
  }
  const scope = (ans<=max)? max : ans+4;   // 答案超范围（乘法）时，干扰数围绕大答案
  return {text, ans, time, max, scope};
}
let lastQText='';
function freshQ(bossQ){
  if(state!=='play') return;
  let q=makeQ(bossQ);
  if(q.text===lastQText){ q=makeQ(bossQ); }
  lastQText=q.text;
  curQ=q; qTimer=q.time; qTotal=q.time; qLock=false;
  spawnWave();
  showQ();
}
function hideQ(){ $('quiz').style.display='none'; }
function showQ(){
  const el=$('quiz');
  if(state!=='play') return;
  $('qLabel').textContent = bossActive? LEVELS[level].boss : ('第'+(level+1)+'关');
  $('qText').textContent = curQ.text;
  $('timerBar').style.display = curQ.time>0?'block':'none';
  if(curQ.time>0){ $('timerBar').firstElementChild.style.width='100%'; }
  el.style.display='block';
  el.classList.remove('wrong','right');
  qLock=false;
}

/* ==================== 流程 ==================== */
function startLevel(lv){
  level=lv; lives=maxLives=3; combo=0; starsGot=0; shieldOn=false;
  clockT=0; wrongStreak=0; bossActive=false; bossConsec=0; kills=0;
  enemies=[]; ebullets=[]; drops=[]; parts=[]; floaters=[];
  plane.x=W/2; plane.y=H-60; newQDelay=0; boss=null;
  $('lvlTxt').textContent='第 '+(lv+1)+' 关';
  renderHUD();
  const tips=[
    '怪兽都背着数字！算出答案，撞背上数字一样的怪兽',
    '撞错会惹怪兽发怒冲向你！小心猫头鹰的泡泡',
    '带 ⏱ 的题目要快答！当心黑色的炸弹怪'
  ];
  showBanner('第 '+(lv+1)+' 关 · '+LEVELS[lv].name, tips[lv]);
  state='play'; running=true;
  setTimeout(()=>freshQ(false), 800);
}
function showBanner(t,s){
  const b=$('banner');
  b.innerHTML=t+(s?'<small>'+s+'</small>':'');
  b.classList.add('show');
  clearTimeout(showBanner._t);
  showBanner._t=setTimeout(()=>b.classList.remove('show'), 2600);
}
function showOv(id,on){ $(id).classList.toggle('show', on); }
function renderHUD(){
  let h='';
  for(let i=0;i<maxLives;i++){
    const on=i<lives;
    h+='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-10.4-10C.2 7.6 2.6 4.3 6 4.3c2.1 0 3.8 1.2 4.7 3 0-1.8 1.3-3 3.4-3 2.8 0 5 2.6 4.3 5.6C17.2 15.7 12 21 12 21z" fill="'+(on?'#ff4d6d':'#d9d4e8')+'"/></svg>';
  }
  $('heartsBox').innerHTML=h;
  $('scoreTxt').textContent=score;
  const ct=$('comboTxt');

function addScore(n, x, y){

/* 撞怪结果：撞对 / 撞错 / 炸弹 / 超时 */
function onHitRight(e){
  qLock=true;
  S.ok(); combo++;
  addScore(10*combo, e.x, e.y-16);
  wrongStreak=0;
  const wasBoss=bossActive;
  explode(e, '#ffd34d');
  removeEnemy(e);
  explodeAll();          // 其他怪兽吓退
  kills++;
  dropRoll();
  if(wasBoss){
    bossConsec++;
    if(bossConsec>=BOSS_NEED[level]){ bossDefeat(); return; }
  } else {
    if(kills>=LEVELS[level].need){ spawnBoss(); return; }
  }
  newQDelay = 1.0;
}
function onHitWrong(e){
  qLock=false;  // 不换题：撞错后怪兽发怒，还能继续找对的
  combo=0;
  wrongStreak++;
  S.bad(); vibrate(50);
  e.angry=true; e.boost=1.6;        // 发怒加速冲下来
  e.angryT=3.2;                     // 加速一会儿
  floaters.push({x:e.x,y:e.y-26,txt:'✗ 错啦',life:.9,col:'#ff5f7a'});
  if(bossActive && level===0) bossConsec=0;          // 巨人：连对被打断
  if(bossActive && level===1) spawnBossBubbles(3);   // 猫头鹰：泡泡雨
  if(bossActive && level===2) hurt(null);            // 大魔王：扣命
  if(lives<=0) return;
  if(!bossActive && wrongStreak>=3){
    wrongStreak=0;
    hurt(null);                       // 连续撞错扣命
    if(lives<=0) return;
    newQDelay=1.2; qLock=true;        // 换一题
  } else {
    newQDelay=0;
  }
}
function onBombHit(e){
  removeEnemy(e);
  explode(e, '#ff6a3d');
  S.boom(); shakeT=.4; flash('#ff5f7a',.35);
  hurt(null);
}
function qTimeout(){
  if(qLock || state!=='play' || !curQ) return;
  qLock=true;
  combo=0; wrongStreak++;
  S.bad();
  if(bossActive && level===0) bossConsec=0;
  if(bossActive && level===1) spawnBossBubbles(3);
  if(bossActive && level===2) hurt(null);
  if(lives<=0) return;
  newQDelay=1.1;
}
function dropRoll(){

    drops.push({x:rnd(W-70)+35, y:16, kind});

}
function hurt(by){

}
function bossDefeat(){

/* ==================== 战斗 ==================== */
function explode(e, col){
  const c = col || pick(['#ffd34d','#ff9a3d','#ff8fa3','#fff']);
  for(let i=0;i<16;i++) parts.push({x:e.x,y:e.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,r:2+rnd(5),col:c,life:.7});
  for(let i=0;i<6;i++) parts.push({x:e.x,y:e.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160-40,r:1+rnd(3),col:'#fff',life:.5});
}
function removeEnemy(e){
  const idx=enemies.indexOf(e);
  if(idx>=0) enemies.splice(idx,1);
}
function superLaser(){
  S.win(); flash('#fff3a0',.45);
  const ansE = enemies.find(x=>x.isAns);
  const wasBoss = bossActive;
  const alreadyDone = qLock;                 // 正在换题空窗期：只清屏，不重复计分
  while(enemies.length){ explode(enemies[0], '#ffd34d'); removeEnemy(enemies[0]); }
  starsGot=0; renderHUD();
  floaters.push({x:W/2,y:240,txt:'超级激光！',life:1.2,col:'#ffd34d',big:true});
  parts.push({kind:'beamAll',life:.4});
  if(!alreadyDone && (ansE || wasBoss)){
    // 直接算答对一次
    qLock=true; combo++;
    addScore(10*combo, W/2, 200);
    wrongStreak=0; kills++;
    if(wasBoss){
      bossConsec++;
      if(bossConsec>=BOSS_NEED[level]){ bossDefeat(); return; }
    } else {
      if(kills>=LEVELS[level].need){ spawnBoss(); return; }
    }
    newQDelay = 0.8;
  }
}
function explodeAll(){
  while(enemies.length){ explode(enemies[0], '#9ad6a0'); removeEnemy(enemies[0]); }
}
function spawnWave(){
  explodeAll();
  if(state!=='play' || !curQ) return;
  const n = WAVE_N[level]||4;
  const lv=LEVELS[level];
  const scope = curQ.scope || Math.max(curQ.ans+2, (MODE[mode].q[level]||[20])[0] + 4);
  const ans = curQ.ans;
  const nums = distractors(ans, scope, n-1);   // n-1 个干扰数字
  nums.push(ans);
  // 打乱位置
  for(let i=nums.length-1;i>0;i--){ const j=rnd(i+1); const t=nums[i]; nums[i]=nums[j]; nums[j]=t; }
  const spread = W/(n+1);
  waveId++;
  const thisWave = waveId;
  nums.forEach((num,i)=>{
    const isAns = (num===ans);
    const spd = lv.spd[0]+Math.random()*(lv.spd[1]-lv.spd[0]);
    const e={
      x: spread*(i+1) + (Math.random()-.5)*30,
      y: -30 - Math.random()*70,
      r: isAns? 25 : 22,
      num, isAns,
      vy: isAns? spd*0.8 : spd,           // 答案怪略慢一点方便追，但不明显泄漏
      baseX: spread*(i+1),
      boost:1, kind:level, t:rnd(20),
      angry:false, angryT:0,
      bomb: false, hover:false, gone:false
    };
    e.wave=thisWave;
    enemies.push(e);
  });
  // 炸弹怪：额外一只（不挤占数字位）；普通关低概率，Boss 战不出
  const bombChance = (bossActive||level===0)? 0 : (level===1? 0.22 : 0.34);
  if(bombChance>0 && Math.random()<bombChance){
    enemies.push({
      x: 30+Math.random()*(W-60), y: -40, r:24, num:null, isAns:false,
      vy: lv.spd[1]*0.85, baseX: W/2, boost:1, kind:level, t:rnd(20),
      angry:false, angryT:0, bomb:true, hover:false, gone:false, wave:thisWave
    });
  }
}
function updateEnemy(e,dt){
  if(clockT>0) return;
  e.t+=dt;
  if(e.angry){
    e.angryT-=dt;
    e.y += e.vy*e.boost*dt;
    e.x += Math.sin(e.t*9)*70*dt;
    e.boost = Math.min(3, e.boost+dt*1.4);
    if(e.angryT<=0 || e.y>H+60){ removeEnemy(e); return; }
    // 发怒怪撞到飞机
    if(Math.abs(e.x-plane.x)<e.r+18 && Math.abs(e.y-plane.y)<e.r+12){ removeEnemy(e); hurt(e); }
    return;
  }
  // 所有怪兽（含答案怪）边下落边左右晃，不会停在原地暴露答案
  if(e.y<90){ e.x = e.baseX + Math.sin(e.t*2.4)*24; }
  else { e.x += Math.sin(e.t*2.2)*34*dt; }
  e.y += e.vy*e.boost*dt;
  if(e.y>H+46){
    if(e.isAns){
      // 答案怪触底=这题没答上：回到顶部再给一次机会
      e.y = -30; e.x = e.baseX + (Math.random()-.5)*W*0.2;
      wrongStreak++;
      S.bad();
      floaters.push({x:clamp(plane.x,44,W-44), y:plane.y-46, txt:'它溜走啦，快追！', life:.9, col:'#ff8a3c'});
      if(bossActive && level===0) bossConsec=0;          // 巨人：连对被打断
      if(bossActive && level===1) spawnBossBubbles(3);   // 猫头鹰：泡泡雨
      if(bossActive && level===2){ hurt(null); }         // 大魔王：扣命
      if(lives<=0) return;
      if(!bossActive && wrongStreak>=3){
        wrongStreak=0;
        hurt(null);                       // 连漏3题扣命
        if(lives<=0) return;
        qLock=true; newQDelay=1.2;        // 换一题
      }
    } else {
      // 干扰怪回到顶部继续巡逻，保持干扰（不消失，防止"等干扰怪走光再撞"）
      e.y = -30 - Math.random()*50;
      e.x = e.baseX + (Math.random()-.5)*W*0.24;
      e.laps = (e.laps||0)+1;
      if(e.bomb && e.laps>2){ removeEnemy(e); }  // 炸弹巡逻两圈后离开，不无限累积威胁
    }
  }
}
function collidePlane(e){
  // 圆形近似碰撞
  const dx = Math.abs(e.x-plane.x), dy = Math.abs(e.y-plane.y);
  const rr = (e.r+18)*(e.r+18);
  if(dx*dx+dy*dy < rr*1.6) return true;
  // 额外用 AABB 宽容一点（儿童友好）
  return dx < e.r+26 && dy < e.r+20;
}
function updateBullets(dt){
  if(clockT<=0){ /* 无自动射击：一切靠撞数字怪兽 */ }
  // 敌弹
  for(let i=ebullets.length-1;i>=0;i--){
    const eb=ebullets[i];
    if(clockT>0) continue;
    eb.y+=eb.vy*dt;
    if(eb.kind==='fire'){ eb.vx += (plane.x-eb.x)*dt*.9; eb.x+=eb.vx*dt; }
    if(Math.abs(eb.x-plane.x)<20 && Math.abs(eb.y-plane.y)<22){
      ebullets.splice(i,1); hurt(eb); continue;
    }
    if(eb.y>H+30||eb.y<-30||eb.x<-30||eb.x>W+30){ ebullets.splice(i,1); }
  }
}

function updateBoss(dt){
  if(!boss || clockT>0) return;
  boss.t+=dt;
  if(boss.kind===0) boss.x += Math.sin(boss.t*.8)*30*dt;
  else if(boss.kind===1){
    boss.x += Math.sin(boss.t*1.2)*55*dt;
    if(Math.random()<dt*.5) spawnBossBubbles(1);
  } else {
    boss.x += Math.sin(boss.t*1.6)*70*dt;
    if(Math.random()<dt*.5) ebullets.push({x:boss.x,y:boss.y+40,vx:0,vy:170,kind:'fire'});
  }
  boss.x=clamp(boss.x,50,W-50);
}

/* ==================== 道具 ==================== */
function updateDrops(dt){
  if(clockT>0) return;
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.y+=60*dt;
    if(d.y>H+20){ drops.splice(i,1); continue; }
    if(Math.abs(d.x-plane.x)<36 && Math.abs(d.y-plane.y)<32){
      if(d.kind==='star'){
        starsGot++; S.star();
        floaters.push({x:d.x,y:d.y,txt:'⭐',life:.9,col:'#ffd34d'});
        if(starsGot>=3) superLaser();
      } else if(d.kind==='clock'){ clockT=5; S.clock(); floaters.push({x:d.x,y:d.y,txt:'时间暂停！',life:1,col:'#8fd6ff'}); }
      else {
        if(!shieldOn){ shieldOn=true; S.shield(); floaters.push({x:d.x,y:d.y,txt:'🛡护盾',life:1,col:'#8fd6ff'}); }
        else addScore(30,d.x,d.y);
      }

    }
  }
}
function updateFx(dt){
  if(clockT>0){ clockT-=dt; if(clockT<=0){ clockT=0; renderHUD(); } }
  if(shakeT>0) shakeT-=dt;
  if(flashT>0) flashT-=dt;
  parts.forEach(p=>{ p.life-=dt; if(p.x2===undefined && p.kind!=='beamAll' && p.kind!=='beamUp'){ p.x+=(p.vx||0)*dt; p.y+=(p.vy||0)*dt; } });
  parts=parts.filter(p=>p.life>0);
  floaters.forEach(f=>{ f.y-=40*dt; f.life-=dt; });

}

function drawEnemy(e){

  if(e.bomb){
    // 炸弹怪：黑球 + 引线火花 + 惊叹号

    ctx.fillStyle='#3a3648'; ctx.beginPath(); ctx.arc(0,0,23,0,7); ctx.fill();
    ctx.fillStyle='#57516b'; ctx.beginPath(); ctx.arc(-7,-8,8,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-8,8,0,7); ctx.fill();
    ctx.strokeStyle='#8a7f9e'; ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.strokeStyle='#ffd34d'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(6,-14); ctx.quadraticCurveTo(15,-22,22,-26); ctx.stroke();
    if(blink){

      ctx.fillStyle='#ff8a3c'; ctx.beginPath(); ctx.arc(23,-28,3,0,7); ctx.fill();
    }
    ctx.fillStyle='#fff'; ctx.font='bold 30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('!',0,2);
    ctx.restore(); return;
  }
  // 发怒状态：红眼 + 燃烧的眉毛
  const angry=e.angry;
  // 头身（按关卡换色，但都是圆鼓鼓怪兽 + 胸前数字牌）
  const bodyCol = e.kind===0 ? (angry?'#f25d5d':'#6fbf6a')
               : e.kind===1 ? (angry?'#f25d5d':'#4db6e0')
               : (angry?'#f25d5d':'#9a6fd0');
  ctx.fillStyle=bodyCol; ctx.beginPath(); ctx.arc(0,0,e.r+2,0,7); ctx.fill();
  // 角/鳍装饰
  ctx.fillStyle=e.kind===0?'#4d9c55':(e.kind===1?'#2f8fc4':'#7a54b8');
  if(e.kind===0){ ctx.beginPath(); ctx.moveTo(-16,-12); ctx.lineTo(-20,-26); ctx.lineTo(-8,-18); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(16,-12); ctx.lineTo(20,-26); ctx.lineTo(8,-18); ctx.closePath(); ctx.fill(); }
  else if(e.kind===1){ ctx.beginPath(); ctx.ellipse(-14,-6,7,10,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(14,-6,7,10,0,0,7); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(0,-e.r-4); ctx.lineTo(-12,-e.r-14); ctx.lineTo(12,-e.r-14); ctx.closePath(); ctx.fill(); }
  // 眼睛：发怒是 X 眼/红眼，平时亮晶晶
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-8,-3,7,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(8,-3,7,0,7); ctx.fill();
  if(angry){
    ctx.strokeStyle='#a02020'; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(-13,-8); ctx.lineTo(-3,2); ctx.moveTo(-3,-8); ctx.lineTo(-13,2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,-8); ctx.lineTo(13,2); ctx.moveTo(13,-8); ctx.lineTo(3,2); ctx.stroke();
    ctx.strokeStyle='#ff8a3c'; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(-18,-8); ctx.lineTo(-4,-12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18,-8); ctx.lineTo(4,-12); ctx.stroke();
  } else {
    ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(-8,-3,3.2,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(8,-3,3.2,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-6.4,-4.6,1.3,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(9.6,-4.6,1.3,0,7); ctx.fill();
  }
  // 数字牌：胸前最醒目的白色圆牌 + 大数字
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,13,17,0,7); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle= angry?'#ff5f5f':'#5b8fd9'; ctx.stroke();
  ctx.fillStyle= angry?'#d03030':'#2f4a8a';
  const fs = e.num>=100? 16 : (e.num>=10? 21 : 25);
  ctx.font='900 '+fs+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(e.num,0,15);
  // 发怒火星
  if(angry && Math.floor(e.t*10)%2===0){
    ctx.fillStyle='rgba(255,138,60,.9)';
    ctx.beginPath(); ctx.arc(-e.r-4,-e.r+6,4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(e.r+2,-e.r+2,3,0,7); ctx.fill();
  }
  ctx.restore();
}
function drawProj(){
  ebullets.forEach(eb=>{
    if(eb.kind==='bubble'){ ctx.fillStyle='rgba(150,225,255,.8)'; ctx.beginPath(); ctx.arc(eb.x,eb.y,10,0,7); ctx.fill(); ctx.strokeStyle='#5fb8e8'; ctx.lineWidth=1.5; ctx.stroke(); }
    else { ctx.fillStyle='#ff8a3c'; ctx.beginPath(); ctx.arc(eb.x,eb.y,8,0,7); ctx.fill(); ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(eb.x,eb.y,4,0,7); ctx.fill(); }
  });
}
function drawPlane(){
  ctx.save(); ctx.translate(plane.x,plane.y);
  if(shieldOn){ ctx.strokeStyle='rgba(140,220,255,.9)'; ctx.lineWidth=3; ctx.setLineDash([7,6]);
    ctx.beginPath(); ctx.arc(0,0,36,0,7); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle='#ff9a3d'; ctx.beginPath(); ctx.moveTo(-6,14); ctx.lineTo(0,28+(Math.random()*8|0)); ctx.lineTo(6,14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5b8fd9'; ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(7,-10); ctx.lineTo(13,12); ctx.lineTo(-13,12); ctx.lineTo(-7,-10); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8fb5e8'; ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(5,-9); ctx.lineTo(-5,-9); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3a6fd8';
  ctx.beginPath(); ctx.moveTo(-5,-8); ctx.lineTo(-24,4); ctx.lineTo(-16,12); ctx.lineTo(-4,7); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5,-8); ctx.lineTo(24,4); ctx.lineTo(16,12); ctx.lineTo(4,7); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawDrops(){
  drops.forEach(d=>{
    ctx.save(); ctx.translate(d.x,d.y);
    ctx.fillStyle = d.kind==='star'?'#ffd34d':(d.kind==='clock'?'#8fd6ff':'#9ad6a0');
    ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#333';
    ctx.fillText(d.kind==='star'?'★':(d.kind==='clock'?'钟':'盾'),0,4);
    ctx.restore();
  });
}
function drawFx(){
  parts.forEach(p=>{
    if(p.kind==='beam'){
      ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=7; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x2!==undefined?p.x2:p.x,p.x2!==undefined?p.y2:-40); ctx.stroke();
      ctx.strokeStyle='#7fd8ff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x2!==undefined?p.x2:p.x,p.x2!==undefined?p.y2:-40); ctx.stroke();
    } else if(p.kind==='beamAll'||p.kind==='beamUp'){
      ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(255,243,160,.5)'; ctx.fillRect(W*.2,0,W*.6,H);
    } else {
      ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
  });
  floaters.forEach(f=>{
    ctx.font=(f.big?'bold 24px sans-serif':'bold 17px sans-serif');
    ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillText(f.txt,f.x+1.5,f.y+1.5);
    ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x,f.y);
  });
}

/* ==================== 主循环 ==================== */
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastT) lastT=ts;
  const dt=Math.min(.05,(ts-lastT)/1000); lastT=ts;
  // 键盘移动（全向，始终监听方向）
  if(keys.left) plane.x=clamp(plane.x-280*dt,26,W-26);
  if(keys.right) plane.x=clamp(plane.x+280*dt,26,W-26);
  if(keys.up) plane.y=clamp(plane.y-220*dt,58,H-46);
  if(keys.down) plane.y=clamp(plane.y+220*dt,58,H-46);
  if(state!=='play' || !running){ drawFrame(); return; }
  updateFx(dt);
  if(bossActive) updateBoss(dt);
  for(let i=enemies.length-1;i>=0;i--) updateEnemy(enemies[i],dt);
  updateBullets(dt);
  updateDrops(dt);
  // 撞怪判定（一切击杀都靠它，无自动射击）
  if(!qLock && curQ && lives>0){
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(!e || e.gone) continue;
      if(e.angry) continue;              // 发怒怪由 updateEnemy 判定撞击
      if(collidePlane(e)){
        if(e.bomb){ onBombHit(e); }
        else if(e.isAns){ onHitRight(e); }
        else { onHitWrong(e); }
        break;
      }
    }
  }
  // 题目节奏
  if(qLock && newQDelay>0){
    newQDelay-=dt;
    if(newQDelay<=0 && state==='play' && lives>0) freshQ(bossActive);
  }
  // 限时题
  if(curQ && !qLock && curQ.time>0 && state==='play'){
    qTimer-=dt;
    $('timerBar').firstElementChild.style.width=Math.max(0,qTimer/qTotal*100)+'%';
    if(qTimer<=0) qTimeout();
  }
  drawFrame();
}
function drawFrame(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawBoss();
  enemies.forEach(drawEnemy);
  drawDrops();
  drawProj();
  drawPlane();
  drawFx();
  const cvEl=cv;
  if(shakeT>0){ cvEl.style.transform='translate('+((Math.random()-.5)*7)+'px,'+((Math.random()-.5)*7)+'px)'; }
  else if(cvEl.style.transform) cvEl.style.transform='';
  if(flashT<=0){ const fl=$('flash'); fl.style.opacity=0; }
}

/* ==================== 输入 ==================== */
let keys={};
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=true;
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=true;
  else if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') keys.up=true;
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') keys.down=true;
  else if(e.key===' '||e.key==='p'||e.key==='P'||e.key==='Escape'){ togglePause(); e.preventDefault(); }
});
document.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') keys.down=false;
});
let drag=null;
cv.addEventListener('pointerdown', e=>{
  drag={ px:plane.x, py:plane.y, sx:e.clientX, sy:e.clientY };
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove', e=>{
  if(drag){
    // 飞机跟随手指移动（位置式拖动，体验更顺）
    plane.x=clamp(drag.px+(e.clientX-drag.sx)/cssScale, 26, W-26);
    plane.y=clamp(drag.py+(e.clientY-drag.sy)/cssScale, 58, H-46);
  }
});
window.addEventListener('pointerup', ()=>{ drag=null; });
window.addEventListener('pointercancel', ()=>{ drag=null; });

/* ==================== 按钮 ==================== */
function init(){
  // 家长模式
  const mb=$('modeBox');
  mb.querySelectorAll('.mode').forEach(b=>{
    b.onclick=()=>{
      mb.querySelectorAll('.mode').forEach(x=>x.classList.remove('cur'));
      b.classList.add('cur'); mode=b.dataset.m;
      try{ localStorage.setItem('arithMode',mode); }catch(e){}
    };
  });
  try{
    const saved=localStorage.getItem('arithMode');
    if(saved && MODE[saved]){ mode=saved; mb.querySelectorAll('.mode').forEach(x=>x.classList.toggle('cur',x.dataset.m===mode)); }
  }catch(e){}
  $('sndBtn').onclick=toggleSnd;
  $('backBtn').onclick=goLobby;
  $('backBtn2').onclick=goLobby;
  $('startBtn').onclick=startGame;
  $('retryBtn').onclick=()=>{ showOv('overOv',false); startGame(); };
  $('againBtn').onclick=()=>{ showOv('winOv',false); startGame(); };
  $('winBack').onclick=goLobby;
  $('overBack').onclick=goLobby;
  $('clearBack').onclick=goLobby;
  $('quitBtn').onclick=goLobby;
  $('resumeBtn').onclick=()=>{ showOv('pauseOv',false); running=true; lastT=0; };
  $('restartBtn').onclick=()=>{ showOv('pauseOv',false); startGame(); };
  $('nextBtn').onclick=()=>{
    showOv('clearOv',false);
    startLevel(level+1);
  };
  // 阻止答题时按钮被再次点按造成 double
  $('opts').addEventListener('click', e=>{ e.stopPropagation(); });
  resize();
  requestAnimationFrame(frame);
}
function startGame(){
  showOv('menuOv',false); showOv('overOv',false); showOv('winOv',false); showOv('clearOv',false); showOv('pauseOv',false);
  score=0;
  startLevel(0);
}
function togglePause(){
  if(state!=='play') return;
  if($('pauseOv').classList.contains('show')){ $('resumeBtn').click(); }
  else { running=false; showOv('pauseOv',true); }
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
