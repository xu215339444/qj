<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>炸弹传递大作战</title>
<style>
:root{
  --u:min(9vh,54px);
  --barH:clamp(86px,21dvh,190px);
}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a2332;font-family:"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}
#cvWrap{flex:1;position:relative;min-height:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#1a2332;}
/* ===== 触控操作栏（对战中出现） ===== */
#ctrl{position:fixed;left:0;right:0;bottom:0;height:var(--barH);display:none;align-items:stretch;justify-content:space-between;
  background:linear-gradient(180deg,#16202f,#0d1520);border-top:2px solid #3d5a80;z-index:20;
  padding:6px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));box-sizing:border-box;}
#ctrl.show{display:flex;}
.pside{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0;}
#cMid{flex:0 0 150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;}
#cMid .lbl{color:#8fb3d9;font-size:11px;letter-spacing:1px;}
#throwA,#throwB{
  height:min(19dvh,150px);border-radius:20px;border:3px solid #ffd166;color:#fff;
  font-size:clamp(15px,3.4dvh,26px);font-weight:900;letter-spacing:2px;
  background:linear-gradient(180deg,#f77f00,#d65108);box-shadow:0 6px 0 #8a3505,0 8px 18px #0008;
  display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;
  text-shadow:0 2px 0 #0006;touch-action:none;}
#throwA:active,#throwB:active{transform:translateY(4px);box-shadow:0 2px 0 #8a3505;}
#throwB{background:linear-gradient(180deg,#4d96ff,#1d5bd6);border-color:#a8d1ff;box-shadow:0 6px 0 #0d3a8f;}
.itRow{display:flex;gap:6px;justify-content:center;}
.itSlot{width:min(15dvh,56px);height:min(15dvh,56px);border-radius:12px;background:#ffffff1a;border:2px solid #ffffff30;
  display:flex;align-items:center;justify-content:center;font-size:min(5dvh,26px);position:relative;cursor:pointer;}
.itSlot.filled{border-color:#ffd166;background:#fff3d6;box-shadow:0 0 10px #ffd166aa;}
.itSlot .k{position:absolute;left:2px;top:-1px;font-size:10px;color:#ffd166;font-weight:900;}
#pvA,#pvB{width:130px;height:20px;border-radius:10px;background:#00000066;overflow:hidden;position:relative;border:1px solid #ffffff40;}
#pvA .fg,#pvB .fg{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#ffb300,#ff3d00);transition:width .12s linear;}
#pvA .lbl,#pvB .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-shadow:0 1px 0 #000;}
/* 顶部小钮 */
#topBtns{position:fixed;top:6px;right:8px;display:flex;gap:6px;z-index:30;}
.miniBtn{width:var(--u);height:var(--u);min-width:34px;min-height:34px;border-radius:10px;border:2px solid #ffffff55;background:#00000055;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.miniBtn:active{transform:scale(.92);}
#homeBtn{position:fixed;top:6px;left:8px;z-index:30;}
/* ===== 覆盖面板 ===== */
#ovl{position:fixed;inset:0;background:#0b101acc;display:none;align-items:center;justify-content:center;z-index:40;overflow:auto;}
#ovl.show{display:flex;}
.panel{background:linear-gradient(180deg,#24344d,#152238);border:3px solid #ffd166;border-radius:24px;
  max-width:640px;width:94%;max-height:94dvh;overflow:auto;padding:18px;box-sizing:border-box;color:#eaf2ff;
  text-align:center;box-shadow:0 16px 60px #000a;}
.panel h1{margin:4px 0 2px;font-size:clamp(24px,5dvh,34px);color:#ffd166;text-shadow:0 3px 0 #7a4a00,0 0 18px #ffd16666;letter-spacing:2px;}
.panel h2{margin:8px 0;font-size:clamp(16px,3dvh,22px);color:#ffd166;}
.panel p{font-size:13px;color:#b8cbe6;line-height:1.6;margin:6px 0;}
.bigbtn{display:block;margin:10px auto;padding:13px 26px;min-width:70%;font-size:19px;font-weight:900;border-radius:16px;
  border:3px solid #ffd166;background:linear-gradient(180deg,#ffb300,#e07b00);color:#fff;letter-spacing:3px;cursor:pointer;
  box-shadow:0 5px 0 #8a4f00;text-shadow:0 2px 0 #0005;}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4f00;}
.bigbtn.sec{background:linear-gradient(180deg,#5b84c4,#2f4f83);border-color:#a8c8f0;box-shadow:0 5px 0 #16294a;}
.bigbtn.grn{background:linear-gradient(180deg,#43d17c,#179a4b);border-color:#b9ffd6;box-shadow:0 5px 0 #0d5c2d;}
.bigbtn.tny{min-width:44%;font-size:15px;padding:10px 12px;display:inline-block;margin:6px;}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 2px;}
.card{width:92px;box-sizing:border-box;border-radius:14px;padding:5px 4px;background:#ffffff0f;border:2px solid #ffffff26;cursor:pointer;color:#dfe9ff;transition:transform .08s,box-shadow .12s,border-color .12s;}
.card:active{transform:scale(.94);}
.card.sel{border-color:#ffd166;background:#ffd1661a;box-shadow:0 0 14px #ffd16688;}
.card.selA{border-color:#ffb300;background:#ffb3001a;box-shadow:0 0 12px #ffb300aa;}
.card.selB{border-color:#58a6ff;background:#58a6ff1a;box-shadow:0 0 12px #58a6ffaa;}
.card canvas{width:80px;height:80px;display:block;margin:0 auto;background:#ffffff08;border-radius:10px;}
.card .nm{font-size:13px;font-weight:800;margin-top:3px;line-height:1.2;}
.card .tp{font-size:9.5px;color:#9fb6d6;line-height:1.25;height:24px;overflow:hidden;margin-top:2px;}
/* 选人：顶部双玩家头像行 */
.pickHeads{display:flex;gap:10px;justify-content:center;margin:6px 0 2px;max-width:560px;margin-left:auto;margin-right:auto;}
.head{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#ffffff0d;border:2px solid #ffffff26;border-radius:14px;padding:6px 10px;text-align:left;cursor:default;}
.head canvas{width:44px;height:44px;flex:0 0 auto;border-radius:9px;background:#ffffff0a;}
.head .hn{font-weight:900;font-size:14px;white-space:nowrap;}
.head .hc{font-size:11px;color:#9fb6d6;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.head.act{border-color:#ffd166;box-shadow:0 0 12px #ffd16677;cursor:pointer;}
.head.act .hn{color:#ffd166;}
.head.act::after{content:'👆';margin-left:auto;font-size:14px;}
.btnRow{display:flex;gap:10px;justify-content:center;align-items:stretch;margin:12px auto 0;max-width:560px;}
.btnRow .bigbtn{margin:0;flex:1;}
.btnRow .bigbtn.tny{flex:0 0 auto;min-width:118px;}
.modeList{display:flex;flex-direction:column;gap:8px;max-width:460px;margin:8px auto;}
.modeRow{display:flex;gap:10px;align-items:center;background:#ffffff0d;border:2px solid #ffffff22;border-radius:14px;padding:8px 12px;cursor:pointer;text-align:left;}
.modeRow.sel{border-color:#ffd166;background:#ffd16614;box-shadow:0 0 10px #ffd16677;}
.modeRow .mI{font-size:24px;}
.modeRow .mT{font-weight:900;font-size:16px;}
.modeRow .mD{font-size:11px;color:#9fb6d6;}
.diffRow{display:flex;gap:8px;justify-content:center;}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.hearts{margin:4px 0;font-size:clamp(13px,2.4dvh,17px);letter-spacing:2px;}
.hint{font-size:11px;color:#7f97bd;margin-top:8px;}
.tip{color:#ffd166;font-size:12px;}
</style>
</head>
<body>
<div id="app">
  <div id="cvWrap"><canvas id="cv"></canvas></div>
  <button class="miniBtn" id="homeBtn" style="display:none" title="返回大厅">←</button>
  <div id="topBtns">
    <button class="miniBtn" id="muteBtn" title="声音">🔊</button>
    <button class="miniBtn" id="pauseBtn" style="display:none" title="暂停">⏸</button>
  </div>
  <div id="ctrl">
    <div class="pside" id="psA">
      <div class="itRow" id="itRowA"></div>
      <div id="pvA"><div class="fg"></div><div class="lbl">引信</div></div>
      <button id="throwA">💣 扔炸弹<span style="font-size:.55em;opacity:.85;margin-left:6px">A</span></button>
    </div>
    <div id="cMid"><span id="modeLbl" class="lbl">对战</span></div>
    <div class="pside" id="psB">
      <div class="itRow" id="itRowB"></div>
      <div id="pvB"><div class="fg"></div><div class="lbl">引信</div></div>
      <button id="throwB">💣 扔炸弹<span style="font-size:.55em;opacity:.85;margin-left:6px">L</span></button>
    </div>
  </div>
</div>
<div id="ovl"></div>
<script>
(function(){
'use strict';
/* ============ 工具 ============ */
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.max(0,Math.ceil(n));

/* ============ 音效（Web Audio） ============ */
let AC=null,master=null,sfxOn=true,bgmOn=true;
function audio(){
  if(!AC){try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;
    /* 限幅压缩器：爆炸/多音效叠加时不破音刺耳 */
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-16;comp.knee.value=14;comp.ratio.value=10;
    comp.attack.value=.002;comp.release.value=.22;
    master.connect(comp);comp.connect(AC.destination);
  }catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||!sfxOn)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
function noiseBurst(dur,vol,fc,delay){
  if(!AC||!sfxOn)return;
  try{
    const t=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=AC.createBufferSource();src.buffer=buf;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;
    const g=AC.createGain();g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(f);f.connect(g);g.connect(master);src.start(t);
  }catch(e){}
}
const SND={
  throw:()=>{tone(300,900,.12,'sawtooth',.16)},
  fly:()=>{noiseBurst(.3,.05,900)},
  catch:()=>{tone(520,240,.08,'square',.2);tone(880,660,.06,'square',.12,.02)},
  fuse:()=>{noiseBurst(.18,.05,2600)},
  alarm:()=>{tone(1200,1200,.06,'square',.06);tone(1200,1200,.06,'square',.06,.18)},
  boom:()=>{noiseBurst(.4,.16,420);tone(150,45,.34,'sawtooth',.13);tone(62,32,.36,'sine',.12,.02)},
  dodge:()=>{tone(880,1320,.14,'sine',.22)},
  pickup:()=>{tone(660,660,.05,'square',.18);tone(990,990,.08,'square',.16,.06)},
  item:()=>{tone(440,880,.1,'triangle',.22);tone(880,1320,.12,'triangle',.18,.08)},
  freeze:()=>{tone(1200,300,.4,'sine',.2);tone(1600,400,.5,'sine',.1,.05)},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f,.14,'square',.18,i*.13))},
  lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.2,'sawtooth',.16,i*.16))},
  tick:()=>{tone(980,980,.03,'square',.08)}
};
/* 简易 8-bit 背景乐循环 */
let bgmTimer=null,bgmStep=0,bgmNote=0;
const BGM=[262,330,392,523,392,330,262,294,330,392,440,392,330,262,220,262];
function bgmStart(){
  if(!AC||!bgmOn||bgmTimer)return;
  bgmStep=0;bgmNote=0;
  bgmTimer=setInterval(()=>{
    if(!bgmOn){return}
    bgmNote++;
    if(bgmNote%3===0){const f=BGM[bgmStep%BGM.length];tone(f,f,.11,'square',.028);bgmStep++;}
    if(bgmNote%12===0)tone(131,131,.4,'triangle',.022);
  },180);
}
function bgmStop(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}

/* ============ 数据 ============ */
const CHARS=[
 {id:'monkey',n:'小猴子',tips:'移动速度 +15%',body:'#b9803c',dark:'#8a5a26',belly:'#f0d0a0',spdMul:1.15,sp:''},
 {id:'dino',  n:'小恐龙',tips:'接住炸弹引信 +0.8 秒',body:'#5cb85c',dark:'#3d7a3d',belly:'#c9e9c9',catchAdd:.8,sp:''},
 {id:'ninja', n:'小忍者',tips:'连按↑可向上闪避',body:'#4a5f75',dark:'#2c3a49',belly:'#8aa0b8',hop:1,sp:''},
 {id:'robot', n:'小机器人',tips:'被炸后无敌 1 秒',body:'#9db4c6',dark:'#5d7485',belly:'#d7e4ec',invulnAdd:1.2,sp:''},
 {id:'ghost', n:'小幽灵',tips:'可穿过中央云台',body:'#e6e9f0',dark:'#aab3c5',belly:'#f7f9ff',ghost:1,sp:''},
 {id:'panda', n:'小熊猫',tips:'开局自带 1 个防护罩',body:'#f5f5f5',dark:'#20242a',belly:'#f5f5f5',panda:1,sp:''}
];
/* ★ 儿童友好版引信：全部拉长约一倍（原普通弹 2~4 秒，小孩子根本来不及反应；现在接住后有充足时间按“扔”按钮） */
const BOMBS={
 normal:{n:'普通炸弹',col:'#22252b',hi:'#5a6472',fuse:[4,7],fspd:1,dmg:1},
 ice:   {n:'冰冻炸弹',col:'#43c6e8',hi:'#cdf4ff',fuse:[5,8],fspd:.95,freeze:2},
 split: {n:'分裂炸弹',col:'#ffd23e',hi:'#fff3b0',fuse:[4,6],fspd:1.05,split:1,dmg:1},
 gift:  {n:'假炸弹',  col:'#ff5d73',hi:'#ffd0d6',fuse:[5,8],fspd:.9,gift:1},
 accel: {n:'加速炸弹',col:'#ff5e3a',hi:'#ffd0a8',fuse:[3,4.5],fspd:1.5,dmg:1},
 slow:  {n:'慢速炸弹',col:'#3fbf5f',hi:'#b7ecc8',fuse:[8,12],fspd:.65,dmg:1},
 bounce:{n:'反弹炸弹',col:'#b06ef0',hi:'#e4c8ff',fuse:[5,7],fspd:1,dmg:1,rebound:1},
 homing:{n:'追踪炸弹',col:'#ff9432',hi:'#ffe2bd',fuse:[4,6],fspd:1.05,dmg:1,homing:1},
 smoke: {n:'烟雾炸弹',col:'#8f98a3',hi:'#cdd5dd',fuse:[5,7],fspd:.95,dmg:1,smoke:5},
 gold:  {n:'黄金炸弹',col:'#ffd700',hi:'#fff6cc',fuse:[4,6],fspd:1,gold:1}
};
const BOMB_KEYS=Object.keys(BOMBS);
const ARENAS=[
 {id:'grass',n:'草地',f:'sky',eff:''},
 {id:'ice',  n:'冰面',f:'ice',eff:'ice'},
 {id:'volcano',n:'火山',f:'volcano',eff:'volcano'},
 {id:'space',n:'太空',f:'space',eff:'space'},
 {id:'palace',n:'天宫',f:'palace',eff:'cloud'},
 {id:'arena',n:'擂台',f:'arena',eff:'arena'}
];
const ITEMS=[
 {id:'shield',n:'防护罩',e:'抵挡一次爆炸伤害',ic:'🛡️'},
 {id:'shoes',  n:'加速鞋',e:'移动速度翻倍 5 秒',ic:'👟'},
 {id:'magnet', n:'磁铁',e:'吸住对方扔来的炸弹',ic:'🧲'},
 {id:'clock',  n:'时间暂停',e:'炸弹引信暂停 3 秒',ic:'⏱️'},
 {id:'board',  n:'反弹板',e:'把炸弹弹回给对方',ic:'↩️'},
 {id:'swap',   n:'交换位置',e:'与对手交换位置',ic:'🔀'}
];
const MODES=[
 {id:'classic',n:'经典对战',d:'先被炸 3 次的一方输',ic:'❤️'},
 {id:'timed',  n:'限时生存',d:'60 秒后受伤少者胜',ic:'⏳'},
 {id:'score',  n:'积分赛',d:'让对方被炸得 1 分，先得 5 分胜',ic:'🏆'},
 {id:'dual',   n:'双炸弹模式',d:'场上同时 2 颗炸弹',ic:'💣'},
 {id:'ai',     n:'单人 vs AI',d:'挑战电脑，选难度',ic:'🤖'}
];
/* ★ 儿童友好难度：简单=反应慢+追不准+常发呆，最适合小朋友；err 大=接球对不准会漏接(球落地自己炸) */
const DIFFS=[
 {id:'easy',n:'简单',react:.65,err:150,mistake:.55,delay:1.2,stare:.3},
 {id:'norm',n:'普通',react:.3,err:80,mistake:.32,delay:.8,stare:.06},
 {id:'hard',n:'困难',react:.12,err:26,mistake:.06,delay:.5,stare:0}
];

/* ============ 画布/布局 ============ */
const cv=document.getElementById('cv');let cx=cv.getContext('2d');
let W=0,H=0,DPR=1,TOUCH=false,LAY={};
function isTouch(){return (navigator.maxTouchPoints>0)||('ontouchstart' in window)||(navigator.pointerEnabled&&navigator.maxTouchPoints)}
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const bw=document.getElementById('cvWrap').clientWidth, bh=document.getElementById('cvWrap').clientHeight;
  W=bw;H=bh;
  cv.width=Math.round(bw*DPR);cv.height=Math.round(bh*DPR);
  cv.style.width=bw+'px';cv.style.height=bh+'px';
  const portrait=H>W;
  const barH=TOUCH?parseFloat(getComputedStyle(document.getElementById('ctrl')).height)||0:0;
  const availH=H-barH;
  const cw=W,ch=availH;
  const groundY=ch*0.94, topY=ch*0.12;
  const charH=portrait?clamp(ch*0.26,76,132):clamp(ch*0.30,96,168);
  LAY={W,W2:W/2,ch,portrait,groundY,topY,midX:W/2,
    c1:clamp(W*0.17,86,190), c2:Math.max(80,W-W*0.17-W*0.06),
    charH, bombD:clamp(Math.min(W,ch)*0.21,64,128),
    catchR:clamp(charH*0.5+46,86,150),
    topY2:topY+charH*0.9, botY:groundY-charH*0.55};
  if(LAY.botY<LAY.topY2+10)LAY.botY=LAY.topY2+90;
}
function rsize(){layout();}
window.addEventListener('resize',rsize);
window.addEventListener('orientationchange',()=>setTimeout(rsize,120));

/* ============ DOM helpers & 屏幕 ============ */
const $=id=>document.getElementById(id);
const ovl=$('ovl');
function showPanel(html){ovl.innerHTML='<div class="panel">'+html+'</div>';ovl.classList.add('show')}
function hidePanel(){ovl.classList.remove('show')}
function panelDone(){hidePanel()}

/* ============ 主状态 ============ */
let st='title';            // title|pick|play|over
let mode=MODES[0],diff=DIFFS[1],chars=[CHARS[0],CHARS[4]];
let P=[null,null],bombs=[],items=[],parts=[],smokes=[],pillars=[],cloud=null;
let arena=ARENAS[0],score=[0,0],timeLeft=0,itemTimer=0,spawnWait=0,flashT=0,shakeT=0,timeStop=0;
let frame=0,overT=0;
let touchDrag=[null,null];
let fuseBarT=0;   // 用于底部引信条的 DOM 刷新节流

/* ============ 角色绘制（Q 版，设计高 120，原点=脚底中心，+x 朝前，-y 向上） ============ */
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function chDraw(c,opt){
  // opt:{px,py(脚底),s,face,mood,pose,t,black,alpha,bubble,frozen}
  const ch=c.ch||chars[0];
  cx.save();
  cx.translate(opt.px,opt.py);
  cx.scale(opt.s,opt.s);
  if(opt.face<0)cx.scale(-1,1);   // 面向左
  if(opt.alpha!==undefined)cx.globalAlpha=opt.alpha;

  const dark=opt.black?'#3a3a3a':ch.dark, body=opt.black?'#5a5a5a':ch.body, belly=opt.black?'#777':ch.belly;
  cx.translate(0,-bob);
  if(opt.frozen){cx.globalAlpha*=.55}
  /* 尾巴/特征在身体后面 */
  if(ch.id==='monkey'){cx.strokeStyle=dark;cx.lineWidth=9;cx.lineCap='round';
    cx.beginPath();cx.moveTo(-16,-30);cx.quadraticCurveTo(-38,-24,-36,-44);cx.stroke()}

    cx.fillStyle=body;cx.beginPath();cx.moveTo(26,-52);cx.lineTo(52,-60);cx.lineTo(38,-40);cx.closePath();cx.fill(); // 吻部
  }

    cx.beginPath();cx.moveTo(6,-66);cx.quadraticCurveTo(26,-58,40,-52+Math.sin(t*.2)*6);cx.stroke()}
  /* 脚 */
  cx.fillStyle=dark;cx.beginPath();cx.ellipse(-10,-2,11,5,0,0,TAU);cx.ellipse(10,-2,11,5,0,0,TAU);cx.fill();
  if(ch.id==='ghost'){cx.fillStyle='rgba(230,233,240,'+(opt.alpha||.86)+')';
    cx.beginPath();cx.moveTo(-22,-6);cx.lineTo(-20,-14);cx.quadraticCurveTo(-15,-2,-8,-14);cx.quadraticCurveTo(0,-1,8,-14);cx.quadraticCurveTo(16,-2,22,-14);cx.lineTo(20,-6);cx.closePath();cx.fill();
    cx.fillStyle='rgba(255,255,255,.6)';
    for(let i=-14;i<=14;i+=7){cx.beginPath();cx.arc(i,-2,2.4,0,TAU);cx.fill()}}
  /* 身体 */
  cx.fillStyle=body;
  rr(-17,-64,34,52,14);cx.fill();
  cx.fillStyle=belly;cx.beginPath();cx.ellipse(2,-40,13,15,0,0,TAU);cx.fill();
  if(ch.id==='robot'){cx.strokeStyle=dark;cx.lineWidth=2;
    rr(-17,-64,34,52,14);cx.stroke();
    cx.fillStyle='#ffd166';cx.beginPath();cx.arc(-9,-36,3.4,0,TAU);cx.arc(9,-36,3.4,0,TAU);cx.fill()}
  if(ch.id==='panda'){cx.fillStyle=dark;cx.beginPath();cx.arc(-11,-46,7,0,TAU);cx.arc(11,-46,7,0,TAU);cx.fill();
    cx.strokeStyle=dark;cx.lineWidth=8;cx.beginPath();cx.moveTo(-17,-38);cx.lineTo(17,-38);cx.stroke()}
  /* 手臂（姿势） */
  const armY=opt.pose==='throw'?Math.max(-30,-58+14*(1-opt.throwP)):-48;
  const armExt=opt.pose==='throw'?26+8*opt.throwP:(opt.pose==='catch'?22:6);
  const armUp=opt.pose==='throw'?-4*opt.throwP:(opt.pose==='catch'?8:0);
  cx.fillStyle=dark;
  /* 后臂（远侧，简单小圆） */
  cx.beginPath();cx.arc(-12,-46,6.5,0,TAU);cx.fill();
  /* 前臂 */
  cx.save();
  cx.translate(8,armY-8);
  const handX=opt.pose==='throw'?armExt:10, handY=opt.pose==='catch'?-4-armUp:0;
  cx.rotate((opt.pose==='throw'?-0.9-0.5*opt.throwP:(opt.pose==='catch'?-0.35:0)));
  rr(-2,-2,16,7,3);cx.fill();
  cx.restore();
  cx.beginPath();cx.arc(8+(opt.pose==='throw'?armExt:0),armY-14+(opt.pose==='catch'?-8:0),6.5,0,TAU);cx.fill();
  /* 头 */
  const hx=6,hy=-92,hr=28;
  if(ch.id==='panda'){cx.fillStyle=dark;cx.beginPath();cx.arc(hx-20,hy-8,9,0,TAU);cx.arc(hx+22,hy-8,9,0,TAU);cx.fill()}
  if(ch.id==='monkey'){cx.fillStyle=dark;cx.beginPath();cx.arc(hx-26,hy-2,8,0,TAU);cx.arc(hx+28,hy-2,8,0,TAU);cx.fill();
    cx.fillStyle=body;cx.beginPath();cx.arc(hx-26,hy-4,5,0,TAU);cx.arc(hx+28,hy-4,5,0,TAU);cx.fill()}
  if(ch.id==='robot'){cx.strokeStyle=dark;cx.lineWidth=2.5;cx.beginPath();cx.moveTo(hx,hy-30);cx.lineTo(hx,hy-42);cx.stroke();
    cx.fillStyle='#ff5252';cx.beginPath();cx.arc(hx,hy-45,4,0,TAU);cx.fill();
    cx.fillStyle=body;cx.beginPath();cx.arc(hx-9,hy-25,4,0,TAU);cx.arc(hx+9,hy-25,4,0,TAU);cx.fill()}
  if(ch.id==='ninja'){cx.fillStyle=dark;rr(hx-22,hy-6,44,7,3);cx.fill()}
  if(ch.id==='ghost'){cx.fillStyle='rgba(90,110,140,.28)';cx.beginPath();cx.ellipse(hx+10,hy+14,20,7,-.5,0,TAU);cx.fill()}
  cx.fillStyle=body;
  cx.beginPath();cx.arc(hx,hy,hr,0,TAU);cx.fill();
  if(ch.id==='dino'){cx.fillStyle=belly;cx.beginPath();cx.arc(hx+10,hy-6,15,0,TAU);cx.fill()}
  if(ch.id==='robot'){cx.fillStyle='#d7e4ec';rr(hx-14,hy+6,28,16,8);cx.fill()}
  /* 脸 */
  const eY=hy-2, mood=opt.mood||'idle';
  cx.lineCap='round';
  if(opt.black||mood==='x'){cx.strokeStyle='#eee';cx.lineWidth=3;
    const dx=6;
    for(const s of[-1,1]){cx.beginPath();
      cx.moveTo(hx+s*9-dx,eY-5);cx.lineTo(hx+s*9+dx,eY+5);
      cx.moveTo(hx+s*9+dx,eY-5);cx.lineTo(hx+s*9-dx,eY+5);cx.stroke()}
    cx.strokeStyle='#999';cx.beginPath();cx.moveTo(hx-18,eY+10);cx.quadraticCurveTo(hx,eY+16,hx+18,eY+10);cx.stroke();
  }else if(mood==='nerve'){cx.fillStyle='#fff';cx.strokeStyle='#263238';cx.lineWidth=2;
    for(const s of[-1,1]){cx.beginPath();cx.arc(hx+s*9,eY,7.5,0,TAU);cx.fill();cx.stroke();
      cx.fillStyle='#263238';cx.beginPath();cx.arc(hx+s*9+3.4,eY+1.5,2.6,0,TAU);cx.fill();cx.fillStyle='#fff'}
    cx.strokeStyle='#4fc3f7';cx.beginPath();cx.moveTo(hx+20,eY-16);cx.lineTo(hx+26,eY-22);cx.stroke();
  }else{ /* 正常 */
    cx.fillStyle='#263238';
    const ex=Math.sin(t*.1)*.6;
    cx.beginPath();cx.arc(hx-11+ex,eY,4.4,0,TAU);cx.arc(hx+5+ex,eY,4.4,0,TAU);cx.fill();
    cx.fillStyle='#fff';cx.beginPath();cx.arc(hx-12.4+ex,eY-1.4,1.5,0,TAU);cx.arc(hx+3.6+ex,eY-1.4,1.5,0,TAU);cx.fill();
    if(ch.id==='panda'){cx.fillStyle='#263238';cx.beginPath();cx.arc(hx-11,eY,7,0,TAU);cx.fill();cx.beginPath();cx.arc(hx+5,eY,7,0,TAU);cx.fill();
      cx.fillStyle='#fff';cx.beginPath();cx.arc(hx-9.5,eY-1.5,3.6,0,TAU);cx.fill();cx.beginPath();cx.arc(hx+6.5,eY-1.5,3.6,0,TAU);cx.fill()}
  }
  /* 嘴 */
  if(mood!=='x'){cx.strokeStyle='#5b3a1e';cx.lineWidth=2.4;
    cx.beginPath();cx.moveTo(hx-6,eY+10);cx.quadraticCurveTo(hx+2,eY+(mood==='nerve'?17:13),hx+10,eY+10);cx.stroke()}
  /* 汗滴/紧张 */
  if(mood==='nerve'){cx.fillStyle='#8fd8ff';cx.beginPath();cx.arc(hx-22,eY-12,3.6,0,TAU);cx.fill()}
  if(opt.frozen){cx.globalAlpha=1;cx.fillStyle='rgba(120,200,255,.45)';
    cx.beginPath();cx.arc(0,-60,46,0,TAU);cx.fill();
    cx.fillStyle='#cfefff';for(let i=0;i<6;i++){cx.save();cx.translate((i%3-1)*20, -60+(i>2?28:-16)+(i%2)*10);cx.rotate(.5+(i%3));cx.beginPath();cx.moveTo(0,0);cx.lineTo(-4,-10);cx.lineTo(4,-12);cx.lineTo(3,-2);cx.closePath();cx.fill();cx.restore()}}
  /* 防护罩泡泡 */
  if(opt.bubble){cx.strokeStyle='rgba(80,200,255,.85)';cx.lineWidth=3;
    cx.beginPath();cx.arc(0,-55,52+Math.sin(t*.06)*3,0,TAU);cx.stroke();
    cx.fillStyle='rgba(120,210,255,.10)';cx.beginPath();cx.arc(0,-55,52,0,TAU);cx.fill()}
  if(opt.ghostGlow){cx.strokeStyle='rgba(200,220,255,.5)';cx.lineWidth=2;cx.beginPath();cx.arc(0,-55,56,0,TAU);cx.stroke()}
  cx.restore();
  /* 效果小图标（如加速鞋/磁铁激活）在头顶 */
  if(c.effIcons){cx.save();cx.translate(opt.px,opt.py);cx.scale(opt.s,opt.s);cx.textAlign='center';cx.font='13px sans-serif';
    let iy=-128;for(const e2 of c.effIcons){cx.fillText(e2,0,iy);iy-=15}cx.restore()}
}

/* ============ 玩家实体 ============ */
function mkP(side){
  const c=chars[side];
  return{side,ch:c,id:c.id,
    cy:LAY.groundY-80,cyTarget:LAY.groundY-80,vy:0,
    face:side===0?1:-1,x:side===0?LAY.c1:LAY.c2,
    hearts:3,score:0,alive:true,state:'idle',stateT:0,
    invuln:0,frozen:0,shield:0,shieldItem:0,shieldInt:0,shoes:0,magnet:0,board:0,
    items:[],slide:0,hop:0,hopCd:0,manT:0,
    hold:null,throwCd:0,think:0,ai:null,effIcons:[],hopT:0};
}
function pBoxMinY(p){return LAY.topY2+(p.ch.ghost?0:0)}
function pBoxMaxY(p){return LAY.botY}
/* 幽灵/忍者边界弹性 */
function clampY(p,y){
  let a=LAY.topY2+ (p.ch.ghost?-26:0), b=LAY.botY+(p.ch.ghost?20:0);
  return clamp(y,a,b);
}
function pFootY(p){return p.cy+LAY.charH*.5}
function pTopY(p){return p.cy-LAY.charH*.5}

/* ============ 炸弹 ============ */
function newBomb(kind,holder,side){
  const k=BOMBS[kind]||BOMBS.normal;
  const o={k:kind,d:k,fuse:rnd(k.fuse[0],k.fuse[1]),alarm:false,
    holder:holder||null,side:side!==undefined?side:(holder?holder.side:0),
    state:holder?'held':'rest', t:0,dur:.8, sx:0,sy:0,tx:0,ty:0,arc:120,
    x:0,y:0,restT:0,backTo:null,spawnP:rnd(.35,.65),threw:0};
  if(o.state==='held'){const h=o.holder;o.x=h.x;o.y=h.cy-LAY.charH*.5-LAY.bombD*.5-6}
  else{o.x=LAY.midX;o.y=LAY.groundY-LAY.bombD}
  return o;
}
function throwBomb(p){
  const b=p.hold;if(!b||b.holder!==p||p.frozen>0||p.invuln>999)return;
  p.face=faceOf(p);
  const other=P[1-p.side];
  const spMul=b.d.fspd*(arena.id==='space'?1.18:1)*(timeStop>0?0.001:1);
  b.state='fly';b.holder=null;b.threw=p.side;
  b.side=other.side;   // 飞向谁，就威胁谁半场
  b.dur=0.8*spMul;
  b.sx=p.x+p.face*LAY.bombD*.4;b.sy=p.cy-LAY.bombD*.2;
  b.tx=other.x-other.face*LAY.bombD*.4;
  b.ty=other.cy;
  b.t=0;
  b.arc=Math.max(90,Math.abs(other.cy-p.cy)+LAY.bombD*1.1+Math.abs(p.x-other.x)*.22);
  p.hold=null;p.state='throw';p.stateT=14;p.throwCd=14;
  SND.throw();
}
function restBomb(b,atP){
  b.state='rest';b.holder=null;
  b.x=atP?atP.x:clamp(b.x,40,LAY.W-40);b.y=LAY.groundY-LAY.bombD*.5;
  b.side=atP?atP.side:b.side;
  b.restT=0;
}
function explodeBomb(b){
  b.gone=1;   /* ★ 爆炸即标记移除（修复无限复活爆炸：updateBombs 帧末 filter 依赖 gone；此前只 removeBomb 不设 gone，各分支 out.push 会把已爆炸弹加回 → 非致命爆炸(金弹/护盾/冰/云台)每帧重爆，卡死+狂响） */
  const owner=b.holder?b.holder:P[b.side];
  const kind=b.k,dd=b.d;
  SND.boom();shakeT=18;flashT=.34;
  boomFX(b.x,b.y);
  let victim=null;
  if(b.state==='held'&&b.holder&&!b.holder.dead){victim=b.holder}
  else if(b.state==='cloud'&&P[b.threw]&&!P[b.threw].dead){victim=P[b.threw]} /* 云台停太久归咎扔出方 */
  else if(owner&&!owner.dead&&owner.side===b.side){victim=owner} // 地面炸在自己半场
  const bFlash=frame;
  if(kind==='gift'){ /* 不炸，加分 */
    if(b.holder){b.holder.score++;floatTxt(b.x,b.y-30,'+1 分 ✨','#ffd166')}
    SND.dodge();
  }else if(kind==='gold'){
    P.forEach(p=>{p.score++;floatTxt(p.x,p.y-40,'+1 分','#ffd700')});
    goldFX(b.x,b.y);
  }else if(kind==='ice'&&victim){
    SND.freeze();iceBoomFX(b.x,b.y);
    if(victim.ch.id!=='robot'){victim.frozen=120;victim.state='idle';victim.stateT=0}
    freezeTxt(victim);
  }else{
    if(victim){hitPlayer(victim,dd,b)}
    if(kind==='split'){
      setTimeout(()=>{P.forEach(p=>{if(p.alive)miniTo(p)})},300);
    }
    if(dd.smoke){smokeScreen(dd.smoke)}
  }
  /* 得分模式：对方掉心，我 +1（在 hitPlayer 内处理） */
  if(kind==='gift')return;
  if(!victim&&kind!=='gold'){/* 谁也没伤到也结束这颗 */ }
  removeBomb(b);
}
function removeBomb(b){const i=bombs.indexOf(b);if(i>=0)bombs.splice(i,1)}
function miniTo(p){ /* 分裂小炸弹追向玩家 */
  const m={k:'mini',mini:1,state:'mini',holder:null,side:p.side, t:0,dur:1,
    sx:LAY.midX,sy:LAY.groundY-LAY.bombD*.5,tx:p.x,ty:p.cy,
    x:LAY.midX,y:LAY.groundY-LAY.bombD*.5,arc:60,spd:0};
  m.spd=Math.hypot(p.x-m.x,p.cy-m.y)/1.05;
  bombs.push(m);
}
function hitPlayer(p,dmgObj,b){
  if(p.dead||p.invuln>0)return;
  if(p.shield>0||p.shieldItem>0){ /* 防护罩吸收 */
    if(p.shieldItem>0)p.shieldItem--;else p.shield=0;
    SND.item();floatTxt(p.x,p.y-40,'防护罩抵挡！','#4fc3f7');
    boomFX(p.x,p.y-30);updateItemsBar();return;
  }
  const killer=P[1-p.side];
  if(mode.id==='score'){killer.score++;SND.boom();floatTxt(killer.x,killer.y-60,'+1 分','#ffd166');checkScoreEnd();return}
  p.hearts--;
  if(p.hearts<0)p.hearts=0;
  if(mode.id!=='timed'&&p.hearts<=0){
    p.hearts=0;p.alive=false;p.state='x';p.stateT=999;
    smokeVictim(p);SND.lose();
    overEnd(1-p.side);
  }else{
    p.invuln=Math.round((p.ch.invulnAdd||0.5)*60);
    p.state='x';p.stateT=70;
    smokeVictim(p);
  }
  floatTxt(p.x,p.y-60,'💥 -1 心','#ff5252');
}
function checkScoreEnd(){
  const t=mode.id==='score'?5:0;
  if(t&&(P[0].score>=t||P[1].score>=t)){
    const win=P[0].score>P[1].score?0:1;
    overEnd(win);
  }
}
function freezeTxt(p){floatTxt(p.x,p.y-60,'❄️ 冻住！','#4fc3f7')}
function smokeVictim(p){for(let i=0;i<14;i++)parts.push({x:p.x+rnd(-14,14),y:p.cy+rnd(-40,10),vx:rnd(-1,1),vy:rnd(-2.6,-.6),g:-.01,t:irnd(30,60),c:'#555',r:rnd(4,9),smoke:1})}
function boomFX(x,y){
  for(let i=0;i<26;i++){const a=rnd(0,TAU),v=rnd(2,9);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.16,t:irnd(20,45),c:Math.random()<.5?'#ffb300':'#ff6d00',r:rnd(2.5,6)})}
  for(let i=0;i<10;i++)parts.push({x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-.7,.7),vy:rnd(-1.8,-.4),g:-.02,t:irnd(40,80),c:'#9aa',r:rnd(5,11),smoke:1});
}
function goldFX(x,y){for(let i=0;i<16;i++){const a=rnd(0,TAU);parts.push({x,y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,g:.1,t:irnd(25,45),c:'#ffe082',r:rnd(2,5)})}}
function iceBoomFX(x,y){for(let i=0;i<18;i++){const a=rnd(0,TAU),v=rnd(2,6);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.18,t:irnd(20,40),c:'#b3e5fc',r:rnd(2,4.5)})}}
function floatTxt(x,y,s,c){parts.push({x,y,txt:s,c,t:70,vy:-1.1})}
function smokeScreen(sec){smokes.push({t:sec*60,x:LAY.midX,y:LAY.groundY-90,r:260})}

/* ============ 引信/报警 ============ */
let lastAlarm=0;
function fuseTick(b){
  const dt=1/60;
  if(timeStop>0)return;
  if(b.state==='held')b.fuse-=dt;
  else if(b.state==='fly')b.fuse-=dt*.8;
  else b.fuse-=dt*.5;
  if(b.fuse<=1.2&&b.fuse>0&&frame>lastAlarm+50&&b.state!=='rest'){SND.alarm();lastAlarm=frame}
  if(b.fuse<=0){if(b.k==='gift'){ /* 假炸弹到点：+1 分 */
    if(b.holder){b.holder.score++;floatTxt(b.x,b.y-34,'+1 分 🎁','#ffb74d')}
    SND.dodge();
    b.gone=1;                      /* ★ 修悬空：不设 gone 会被 held 分支 out.push 加回，负 fuse 礼物永远在场 → 对局永不结束 */
    if(b.holder)b.holder.hold=null;
    b.holder=null;
    removeBomb(b);return}
    explodeBomb(b)}
}

/* ================= 绘制：场地 ================= */
/* ================= 场地：左右对阵竞技场（清爽底 + 半场分色 + 站台） ================= */
function drawArena(){
  const a2=LAY, gy=a2.groundY;
  const id=(arena&&arena.id)||'grass';
  /* 场地主色表（浅色调，纸面清爽，让彩色角色最醒目） */
  const PAL={
    grass:{top:'#dff2e2',floor:'#bfe3ad',side0:'rgba(255,150,90,.07)',side1:'rgba(90,150,255,.07)'},
    ice:{top:'#e3f4fb',floor:'#bfe0ef',side0:'rgba(255,150,90,.06)',side1:'rgba(90,150,255,.06)'},
    volcano:{top:'#fbe8dc',floor:'#e7b692',side0:'rgba(255,120,80,.08)',side1:'rgba(90,150,255,.06)'},
    space:{top:'#e6e8f6',floor:'#b9bfdd',side0:'rgba(255,140,90,.06)',side1:'rgba(120,140,255,.08)'},
    palace:{top:'#fdf1d8',floor:'#e6cd97',side0:'rgba(255,170,90,.08)',side1:'rgba(90,150,255,.05)'},
    arena:{top:'#edf0f6',floor:'#c3cbd9',side0:'rgba(255,140,90,.06)',side1:'rgba(90,150,255,.07)'}
  }[id]||{top:'#eaf7ec',floor:'#bfe3ad',side0:'rgba(255,150,90,.07)',side1:'rgba(90,150,255,.07)'};
  /* 上半背景：顶部带主色 → 向下变白（清爽） */
  const g=cx.createLinearGradient(0,0,0,gy);
  g.addColorStop(0,PAL.top);g.addColorStop(1,'#ffffff');
  cx.fillStyle=g;cx.fillRect(0,0,a2.W,a2.ch);
  /* 地面 */
  const gg=cx.createLinearGradient(0,gy,0,a2.ch);
  gg.addColorStop(0,PAL.floor);gg.addColorStop(1,'#ffffff');
  cx.fillStyle=gg;cx.fillRect(0,gy,a2.W,a2.ch-gy);
  /* 左右半场淡色（对立感） */
  cx.fillStyle=PAL.side0;cx.fillRect(0,a2.topY-30,a2.midX,gy-(a2.topY-30));
  cx.fillStyle=PAL.side1;cx.fillRect(a2.midX,a2.topY-30,a2.W-a2.midX,gy-(a2.topY-30));
  /* 玩家站台（脚下半透明椭圆，暖=红方 / 冷=蓝方，明确"站在这里对战"） */
  cx.save();

/* ================= 绘制：炸弹（线稿简约风：白底+黑圆+大"炸弹"字+种类小标记） ================= */
const BOMB_TAG={normal:'●',ice:'❄',split:'✂',gift:'★',accel:'▲',slow:'▽',bounce:'◇',homing:'➤',smoke:'☁',gold:'◆'};
function drawBombVis(b){
  let x=b.x,y=b.y, k=b.k;
  /* ★ b.d 是 BOMBS[k] 配置对象而非尺寸数字 —— 直接用 LAY.bombD 作半径，避免 R=NaN 静默吞掉 */
  let d=LAY.bombD;
  /* NaN/Infinity 防御：AI 决策偶发让坐标变 NaN —— 优先回退到持有者位置，场上一定看得见 */
  if(!isFinite(x)||!isFinite(y)){
    const h=b.holder;
    if(h&&isFinite(h.x)&&isFinite(h.cy)){
      x=h.x;
      y=h.cy-LAY.charH*.5-LAY.bombD*.5-6;
      b.x=x;b.y=y; /* 顺手回写，避免后续帧继续坏 */
    }else{return}
  }
  if(!isFinite(d)||d<=0)return;
  const R=d*.5,fuseFrac=(b.d&&b.fuse!==undefined)?clamp(b.fuse/(b.d.fuse[1]||4),0,1):0;
  cx.save();cx.translate(x,y);
  const panic=b.fuse<=1&&b.fuse>0;
  /* ★ 引信（细黑线 + 末端实心点） */
  cx.strokeStyle='#222';cx.lineWidth=3;cx.lineCap='round';
  cx.beginPath();cx.moveTo(0,-R+4);cx.lineTo(rnd(-4,4),-R-12);cx.stroke();
  cx.fillStyle=panic?'#e53935':'#ffa';
  cx.beginPath();cx.arc(rnd(-4,4),-R-12,3.6,0,TAU);cx.fill();
  /* ★ 主圆（白底+黑描边，永远一眼可见） */
  cx.fillStyle='#ffffff';
  cx.strokeStyle='#222';cx.lineWidth=Math.max(2.5,R*.12);
  cx.beginPath();cx.arc(0,0,R*.95,0,TAU);cx.fill();cx.stroke();
  /* ★ 大字"炸弹" */
  cx.fillStyle='#222';
  cx.font='900 '+Math.round(R*.42)+'px "Microsoft YaHei","Heiti SC",sans-serif';
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('炸弹',0,2);
  /* ★ 种类小标记（右上角） */
  if(k!=='normal'&&BOMB_TAG[k]){
    cx.fillStyle='#222';
    cx.font='900 '+Math.round(R*.34)+'px sans-serif';
    cx.fillText(BOMB_TAG[k],R*.62,-R*.62);
  }
  /* ★ 倒计时数字（儿童友好：剩余 ≤5 秒就显示大字秒数，让小朋友一眼知道还剩几秒） */
  if(b.fuse!==undefined&&b.fuse>0&&(b.state!=='rest'||b.fuse>0)){
    const f=Math.ceil(b.fuse);
    if(f<=5){
      const red=panic&&f===1;
      const big=f<=3?R*.55:R*.4;
      cx.font='900 '+Math.round(big)+'px sans-serif';
      cx.lineWidth=Math.max(3,R*.12);cx.strokeStyle='#ffffff';
      cx.strokeText(f,0,R*.42);
      cx.fillStyle=red?'#e53935':'#222';
      cx.fillText(f,0,R*.42);
    }
  }
  cx.textBaseline='alphabetic';
  cx.restore();
}

function threatBomb(side){

    if(b.state!=='held'&&b.side===side&&b.fuse>0)return b;
  }
  return null;
}

function faceOf(p){const o=P[1-p.side];return o.x>p.x?1:-1}
function pBounds(p){
  const g=arena.eff==='arena';
  let a=LAY.topY2+(g?LAY.charH*.85:0)-(p.ch.ghost?30:0);
  let b=LAY.botY-(g?LAY.charH*1.2:0)+(p.ch.ghost?24:0);
  if(b<a+60)b=a+60;
  return[a,b];
}
function clampY2(p,y){const bb=pBounds(p);return clamp(y,bb[0],bb[1])}
/* ★ 自动接球辅助：玩家没有手动输入(没按方向键/没在屏幕上滑动)时，
   角色自动站到炸弹落点/回站台 —— 手机上只需点“扔”按钮，不用再上下移动对准。
   想自己控制时按住 W/S 或 ↑/↓（触屏上下滑）会临时接管，松开后恢复自动。 */
function humanAssist(p){
  if(!p||!p.alive)return;
  if(p.frozen>0||p.state==='x')return;
  if(p.hold){ /* 手里有球：回地面站台，稳稳拿住等按“扔” */
    const bbase=LAY.groundY-LAY.charH*.5;
    p.cyTarget=clampY2(p,bbase);
    return;
  }
  const inc=bombs.find(b=>!b.gone&&b.state==='fly'&&b.side===p.side&&!b.caught);
  if(inc){ /* 球飞过来了：自动站到接球点 */
    p.cyTarget=clampY2(p,inc.ty);
    return;
  }
  const rs=bombs.find(b=>!b.gone&&b.state==='rest'&&b.side===p.side);
  if(rs&&Math.abs(rs.x-p.x)<LAY.bombD*2.2){ /* 掉在脚下的球自动捡起 */
    p.cyTarget=clampY2(p,rs.y-LAY.charH*.35);
    return;
  }
  if(arena.eff==='volcano'){ /* 火山火柱来了自动抬升躲开 */
    const warn=pillars.find(pl=>pl.w>0&&Math.abs(pl.x-p.x)<30);
    if(warn){p.cyTarget=clampY2(p,p.cy-LAY.charH*.9);return}
  }
  /* 空闲：回地面站台 */
  const base=LAY.groundY-LAY.charH*.5;
  p.cyTarget=clampY2(p,base);
}
function movePlayer(p){
  if(!p.alive)return;
  if(p.frozen>0){p.cyTarget=p.cy;return}
  if(p.state==='x'&&p.stateT>0){p.cyTarget=p.cy;return}
  if(p.ai)aiThink(p);
  const dt=1/60;
  const mvMax=(p.shoes>0?560:310)*(p.ch.spdMul||1)*(arena.id==='space'?1.18:1);
  const want=p.cyTarget-p.cy;
  let step=clamp(want,-mvMax*dt,mvMax*dt);
  p.cy+=step;
  if(arena.eff==='ice'){
    p.slide=clamp((p.slide||0)*.93+(Math.abs(want)<1?step:0),-26,26);
    p.cy+=p.slide;
  }
  p.cy=clampY2(p,p.cy);
}
function updatePose(p){
  if(p.stateT>0)p.stateT--;
  if(p.throwCd>0)p.throwCd--;
  if(p.invuln>0)p.invuln--;
  if(p.frozen>0)p.frozen--;
  if(p.shoes>0)p.shoes--;
  if(p.magnet>0)p.magnet--;
  if(p.board>0)p.board--;
  if(p.hop>0)p.hop--;
  if(p.hopCd>0)p.hopCd--;
  if(p.hop>0)p.cy=clampY2(p,p.cy-13);
  /* 手上炸弹跟随：放在玩家头顶正上方，避开身体遮挡（之前 y=cy-bombD*.12 仍在角色内，被完全覆盖 → 看上去"没炸弹"） */
  if(p.hold&&!p.hold.gone){
    p.hold.x=p.x;
    p.hold.y=p.cy-LAY.charH*.5-LAY.bombD*.5-6;
  }
}
function sendBack(b,to){
  b.state='fly';b.holder=null;b.side=to.side;b.hitCloud=0;
  b.sx=b.x;b.sy=b.y;b.tx=to.x-to.face*(LAY.bombD*.45);b.ty=to.cy;
  b.dur=Math.max(.3,.6*(b.d?b.d.fspd:1)*(arena.id==='space'?1.18:1));
  b.arc=Math.max(70,Math.abs(to.cy-b.sy)+LAY.bombD*.9+Math.abs(b.sx-to.x)*.2);
  b.t=0;b.threw=to.side;
}
function updateBombs(){
  const out=[];
  bombs.forEach(b=>{
    if(b.gone)return;
    /* ★ 自愈：坐标或关键路径点坏掉的炸弹直接标记消失，避免污染后续帧让画面"看不见炸弹" */
    if(!isFinite(b.x)||!isFinite(b.y)){
      b.gone=1;return;
    }
    if((b.state==='fly'||b.state==='mini'||b.state==='cloud')&&(!isFinite(b.sx)||!isFinite(b.sy)||!isFinite(b.tx)||!isFinite(b.ty))){
      b.gone=1;return;
    }
    if(b.state==='held'){
      const h=b.holder;
      if(!h||h.dead){b.gone=1;return}
      fuseTick(b);
      if(b.gone)return;
      out.push(b);return;
    }
    if(b.state==='fly'||b.state==='mini'||b.state==='cloud'){
      const tar=P[b.side];
      if(b.state!=='cloud'){
        b.t+=1/60;
        if(b.k==='homing'&&b.state==='fly'){b.ty=lerp(b.ty,tar.cy,.14)}
        const e=Math.min(1,b.t/b.dur);
        if(b.state==='mini'){ /* 分裂小弹直追目标 */
          const dx=tar.x-b.x,dy=tar.cy-b.y,dist=Math.hypot(dx,dy);
          const sp=(b.spd||0)*(1/60);
          if(dist<sp){miniHit(b,tar);return}
          b.x+=dx/dist*sp;b.y+=dy/dist*sp;
          out.push(b);return;
        }
        b.x=lerp(b.sx,b.tx,e);
        b.y=lerp(b.sy,b.ty,e)-Math.sin(Math.PI*e)*b.arc;
        fuseTick(b);
        if(b.gone)return;
        /* 云台挡炸弹 */
        if(arena.eff==='cloud'&&cloud&&!b.hitCloud&&Math.abs(b.x-cloud.x)<LAY.bombD*.6&&Math.abs(b.y-cloud.y)<cloud.h*.6+LAY.bombD*.55){
          const sender=P[b.threw];
          if(sender&&sender.ch&&sender.ch.ghost){ /* 幽灵穿过 */ }
          else{b.hitCloud=1;b.state='cloud';b.t=0;b.cloudT=80;b.x=cloud.x;b.y=cloud.y;SND.dodge();floatTxt(b.x,b.y-cloud.h,'云台挡住！','#ffe082')}
        }
        /* 接球判定 */
        const catchable=!tar.dead&&tar.frozen<=0&&tar.state!=='x'&&e>0.15;
        if(catchable&&b.state==='fly'){
          const cx2=tar.x-tar.face*(LAY.bombD*.45),cy2=tar.cy-LAY.bombD*.1;
          const d2=Math.hypot(b.x-cx2,b.y-cy2);
          const catchZone=tar.magnet>0?LAY.W*.6:LAY.catchR;
          if(d2<catchZone){
            if(tar.board>0&&b.threw!==tar.side){ /* 反弹板 */
              tar.board=0;SND.item();floatTxt(tar.x,tar.y-60,'反弹板！','#8ef');
              sendBack(b,P[1-tar.side]);updateItemsBar();
            }else if(!(tar.magnet>0&&false)){
              doCatch(b,tar);
            }else{doCatch(b,tar)}
          }
        }
        /* 到点未接住 */
        if(b.state==='fly'&&e>=1&&!b.caught){
          const bd=BOMBS[b.k];
          if(bd&&bd.rebound){ /* 反弹炸弹：弹回扔出方 */
            SND.throw();floatTxt(b.x,b.y-40,'弹回去了！','#e4c8ff');
            sendBack(b,P[1-b.side]);
          }else{
            restBomb(b,tar);
          }
        }
        out.push(b);return;
      }else{ /* cloud 上停留后弹回 */
        b.cloudT--;fuseTick(b);
        if(b.gone)return;
        if(b.cloudT<=0){sendBack(b,P[b.threw])}
        out.push(b);return;
      }
    }
    if(b.state==='rest'){
      fuseTick(b);
      const sideP=P[b.side];
      if(b.gone)return;
      if(sideP&&sideP.alive&&sideP.frozen<=0){
        const d3=Math.hypot(b.x-sideP.x,b.y-(sideP.cy));
        if(d3<LAY.charH*.8)doCatch(b,sideP,true);
      }
      out.push(b);return;
    }
    out.push(b);
  });
  bombs=out.filter(b=>!b.gone);
  /* ★ 悬空引用自愈：explodeBomb/removeBomb 未清 p.hold，玩家手里仍指向已被 splice 的炸弹对象 → 画面"有 hold 但画不出"。每帧核对 bombs 数组，把悬空引用清掉 */
  for(const pp of P){if(pp.hold&&bombs.indexOf(pp.hold)<0)pp.hold=null}
}
function doCatch(b,p,fromGround){
  if(p.items&&p.magnet>0&&!fromGround&&b.threw!==p.side){p.magnet=0;SND.item();floatTxt(p.x,p.y-60,'磁铁吸住！','#9cf')}
  if(b.holder&&b.holder!==p)return;
  b.holder=p;b.state='held';b.gone=0;
  p.hold=b;if(p.ai)p.think=0;
  SND.catch();p.state='catch';p.stateT=20;
  if(p.ch.catchAdd){b.fuse+=p.ch.catchAdd;floatTxt(p.x,p.y-60,'+0.8s 引信','#8ef')}
  /* ★ 儿童引导：接到快爆的球时大字提醒赶紧按“扔” */
  if(!p.ai&&b.fuse<2.6&&b.fuse>0)floatTxt(p.x,p.y-84,'⏰ 快扔！','#ff5252');
  updateItemsBar();
}
function miniHit(b,tar){

    boomFX(b.x,b.y);SND.boom();floatTxt(tar.x,tar.y-50,'小炸！','#ff8a65')}
  else boomFX(b.x,b.y);

/* ================= 火柱（火山） ================= */
let pillarT=0;
function updatePillars(){
  if(arena.eff!=='volcano'){pillars=[];return}

function spawnDrop(){
  if(items.length>=2)return;
  items.push({x:LAY.midX+rnd(-30,30),y:-24,vy:2.4,i:irnd(0,ITEMS.length-1),landed:false,ry:LAY.groundY-30});

function updateItems(){

      }});

function useItem(side,idx){
  const p=P[side];if(!p||st!=='play'||!p.alive)return;
  if(p.items[idx]===undefined)return;
  const it=ITEMS[p.items[idx]];p.items.splice(idx,1);
  SND.item();
  if(it.id==='shield'){p.shieldInt=Math.min(2,(p.shieldInt||0)+1);floatTxt(p.x,p.y-60,'防护罩 +1','#4fc3f7')}
  else if(it.id==='shoes'){p.shoes=300;floatTxt(p.x,p.y-60,'加速 5 秒！','#ffd166')}
  else if(it.id==='magnet'){p.magnet=420;floatTxt(p.x,p.y-60,'磁铁就位！','#9cf')}
  else if(it.id==='clock'){timeStop=180;floatTxt(LAY.midX,LAY.groundY-160,'⏱ 时间暂停 3 秒','#7fd4ff')}
  else if(it.id==='board'){p.board=420;floatTxt(p.x,p.y-60,'反弹板就位！','#8ef')}
  else if(it.id==='swap'){
    const q=P[1-side];
    [p.x,q.x]=[q.x,p.x];[p.cy,q.cy]=[q.cy,p.cy];
    p.cyTarget=p.cy;q.cyTarget=q.cy;shakeT=8;

/* ================= AI ================= */
function aiThink(p){
  const d=diff||DIFFS[1],tar=P[1-p.side];
  p.think=(p.think||0)-1;
  if(p.hold){
    const fr=p.hold.fuse;
    /* ★ 儿童友好规则：绝不“捂到最后一秒才丢”。
       旧逻辑 wait=fr-0.6：AI 等引信烧到 0.6s 才出手 → 球飞到玩家手上引信≈0 → 玩家必炸、必输。
       现在接到球按难度固定停顿就扔回；引信不足 1.4s 时干脆不扔(抱着自爆)，不把烫手弹丢给小朋友。 */
    if(fr<=1.8){p.think=9999;return}         /* 太烫：不扔，自己抱住 → 公平（杜绝把只剩 1 秒的球塞给小朋友） */
    if(p.think<=0){
      let idle=0;
      if(Math.random()<d.stare)idle=irnd(80,200);   /* 简单 AI 偶尔抱着发呆，给小玩家喘息/机会 */
      p.think=Math.round(Math.max(12,(d.react*60+idle)*rnd(.85,1.3)));
    }else if(p.think<=10&&p.throwCd<=0){
      throwBomb(p);p.think=0;
    }
    return;
  }
  /* 躲避火柱预警 */
  if(arena.eff==='volcano'){
    const warn=pillars.find(pl=>pl.w>0&&Math.abs(pl.x-p.x)<30);
    if(warn){p.cyTarget=clampY2(p,p.cy+(p.cy>LAY.ch*.5?-1:1)*LAY.charH);return}
  }
  const inc=bombs.find(b=>b.state==='fly'&&b.side===p.side&&!b.caught);
  if(inc){
    if(Math.random()<d.stare){ /* 简单 AI 偶尔愣神不追 → 接不住，球落地自己那边炸 */
      return;
    }
    if(Math.random()<d.mistake){ /* 偶尔失误乱跑 */
      p.cyTarget=clampY2(p,LAY.groundY-60+rnd(-40,40));
      return;
    }
    p.cyTarget=clampY2(p,inc.ty+Math.sin(frame*.04+p.side*3)*d.err);
  }else if(Math.random()<.006){
    p.cyTarget=rnd(LAY.topY2+40,LAY.botY-40);
  }
}

let spawnT=0,spawnK=null;
function pickKind(){
  const w={normal:26,ice:15,split:11,gift:7,accel:11,slow:8,bounce:9,homing:9,smoke:7,gold:6};
  let tot=0;Object.values(w).forEach(v=>tot+=v);
  let r=rnd(0,tot);
  for(const k in w){r-=w[k];if(r<=0)return k}
  return 'normal';
}
function needBombs(){
  const real=bombs.filter(b=>!b.mini&&!b.gone);
  return mode.id==='dual'?2-real.length:1-real.length;
}
function updateSpawn(){
  const n=needBombs();
  if(n>0&&spawnT<=0&&P[0]&&P[1]&&(P[0].alive||P[1].alive)){
    const cands=P.filter(p=>p.alive&&p.frozen<=0&&!p.hold);
    const pool=cands.length?cands:P.filter(p=>p.alive);
    if(pool.length){
      const holder=pool[irnd(0,pool.length-1)];
      const b=newBomb(spawnK||pickKind(),holder);
      bombs.push(b);holder.hold=b;
      SND.catch();floatTxt(holder.x,holder.y-70,'炸弹来了！','#ff8a65');
      updateItemsBar();
      spawnK=null;
    }
    spawnT=mode.id==='dual'?90:75;
  }else if(spawnT>0)spawnT--;
}

function overEnd(win){

/* ================= 角色出场绘制 ================= */
function drawPlayer(p){
  if(!p||!p.alive||!p.ch)return;
  if(!isFinite(p.x)||!isFinite(p.cy))return;  /* NaN 防御：AI 决策出错时不画 */
  p.face=faceOf(p);
  const s=LAY.charH/124;
  const feet=p.cy+LAY.charH*.5;
  let mood='idle',pose='idle',throwP=0,black=false,frozen=p.frozen>0;
  if(p.state==='x'&&p.stateT>0){mood='x';black=p.stateT>16}
  else if(p.hold&&p.hold.fuse<=1.5){mood='nerve'}
  if(p.state==='catch'&&p.stateT>0)pose='catch';
  else if(p.state==='throw'&&p.stateT>0){pose='throw';throwP=1-p.stateT/14}
  p.effIcons=[];
  if(p.shoes>0)p.effIcons.push('👟');
  if(p.magnet>0)p.effIcons.push('🧲');
  if(p.board>0)p.effIcons.push('↩️');
  const blink=p.invuln>0&&(frame>>3)%2===0;
  chDraw(p,{px:p.x,py:feet,s,face:p.face,t:frame,mood,pose,throwP,
    black,frozen,alpha:blink?.45:undefined,
    bubble:(p.shieldInt||0)>0,
    ghostGlow:!!p.ch.ghost});
}
/* 角色预览小图 */

/* ================= 主渲染 ================= */
function drawScene(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,W,H);
  if(shakeT>0){const k=shakeT/18*9;
    cx.translate(rnd(-k,k),rnd(-k,k))}
  drawArena();
  drawCloud();
  if(st==='play'||st==='pick'||st==='title'||st==='over'){drawSmokes();}
  items.forEach(d=>drawDrop(d));
  if(st==='play')drawPillars();
  if(P[0])drawPlayer(P[0]);
  if(P[1])drawPlayer(P[1]);
  /* ★ 传递路径（炸弹在飞时画弧形虚线 + 箭头 —— 草图风格的"传递方向"） */
  if(st==='play'){
    bombs.forEach(b=>{
      if(b.state==='fly'&&isFinite(b.sx)&&isFinite(b.sy)&&isFinite(b.x)&&isFinite(b.y)){
        const sx=b.sx,sy=b.sy,ex=b.x,ey=b.y;
        const mx=(sx+ex)/2, my=Math.min(sy,ey)-Math.max(50,Math.abs(ex-sx)*.35);
        cx.strokeStyle='#888';cx.lineWidth=2.5;cx.setLineDash([6,5]);
        cx.beginPath();cx.moveTo(sx,sy);cx.quadraticCurveTo(mx,my,ex,ey);cx.stroke();cx.setLineDash([]);
        /* 箭头：终点位置沿曲线切线方向 */
        const dx=ex-mx, dy=ey-my, ang=Math.atan2(dy,dx);
        cx.save();cx.translate(ex,ey);cx.rotate(ang);
        cx.fillStyle='#888';
        cx.beginPath();cx.moveTo(0,0);cx.lineTo(-11,-6);cx.lineTo(-11,6);cx.closePath();cx.fill();
        cx.restore();
      }
    });
  }
  /* 炸弹（mini 缩小） */
  bombs.forEach(b=>{
    cx.save();
    if(b.mini){cx.translate(b.x,b.y);cx.scale(.5,.5);cx.translate(-b.x,-b.y)}
    drawBombVis(b);
    cx.restore();
  });
  /* 粒子/文字 */
  parts.forEach(pt=>{
    if(pt.txt){cx.globalAlpha=clamp(pt.t/40,0,1);cx.font='900 15px Arial';cx.fillStyle=pt.c||'#fff';
      cx.textAlign='center';cx.fillText(pt.txt,pt.x,pt.y);cx.textAlign='left';cx.globalAlpha=1;return}
    cx.globalAlpha=clamp(pt.t/24,0,1);
    cx.fillStyle=pt.c||'#ffb300';
    if(pt.smoke){cx.fillStyle='rgba(70,74,80,'+clamp(pt.t/60,.2,.7)+')'}
    cx.beginPath();cx.arc(pt.x,pt.y,pt.r,0,TAU);cx.fill();
    cx.globalAlpha=1;
  });
  /* 时间暂停特效 */
  if(timeStop>0){cx.fillStyle='rgba(70,140,255,'+clamp(timeStop/180,0,.12)+')';cx.fillRect(0,0,W,H)}
  if(st==='play')drawHUD();
  if(flashT>0){cx.globalAlpha=clamp(flashT,0,.9);cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.globalAlpha=1}
  /* 对战操作提示（首局短暂） */
}
function updateFX(){

/* ================= 每帧更新 ================= */
let paused=false,stepMode=0;
function update(){
  if(st==='play'&&!paused&&P[0]){
    /* ★ NaN/未定义自愈：上一轮 AI/道具偶发把玩家坐标写坏后，画面整局空、炸弹也看不见 —— 顶端复位 */
    for(const pp of P){
      if(!isFinite(pp.x))pp.x=(pp.side===0?LAY.c1:LAY.c2);
      if(!isFinite(pp.cy)){pp.cy=LAY.botY-30;pp.cyTarget=pp.cy;pp.hold=null;pp.state='idle';pp.stateT=0}
      if(!isFinite(pp.cyTarget))pp.cyTarget=pp.cy;
    }
    /* 先消费键盘瞬发键 */
    if(edge.t0&&!P[0].ai)tryThrow(0);
    if(edge.t1&&!P[1].ai)tryThrow(1);
    if(edge.i0)useItem(0,0);
    if(edge.i1)useItem(1,0);
    if(edge.u0&&P[0].ch&&P[0].ch.hop&&!P[0].hold&&P[0].hopCd<=0){P[0].hop=14;P[0].hopCd=80;P[0].cyTarget=P[0].cy-40;SND.dodge()}
    if(edge.u1&&P[1].ch&&P[1].ch.hop&&!P[1].hold&&P[1].hopCd<=0){P[1].hop=14;P[1].hopCd=80;P[1].cyTarget=P[1].cy-40;SND.dodge()}
    edge.t0=edge.t1=edge.i0=edge.i1=edge.u0=edge.u1=false;
    /* ★ 手动持续方向键（先于自动辅助生效：长按 W/S 或 ↑/↓ 可自由微调站位） */
    if(P[0]&&!P[0].ai){const m0=keys.u0||keys.d0;
      if(keys.u0)P[0].cyTarget-=4.6;if(keys.d0)P[0].cyTarget+=4.6;
      if(m0){P[0].cyTarget=clampY2(P[0],P[0].cyTarget);P[0].manT=8}else if(P[0].manT>0)P[0].manT--}
    if(P[1]&&!P[1].ai){const m1=keys.u1||keys.d1;
      if(keys.u1)P[1].cyTarget-=4.6;if(keys.d1)P[1].cyTarget+=4.6;
      if(m1){P[1].cyTarget=clampY2(P[1],P[1].cyTarget);P[1].manT=8}else if(P[1].manT>0)P[1].manT--}
    /* ★ 自动接球辅助：没在手动操作时接管位置，手机零操作也能接住球 */
    P.forEach(pp=>{if(pp&&pp.alive&&!pp.ai&&pp.manT<=0)humanAssist(pp)});
    if(mode.id==='timed'){timeLeft-=1/60;
      if(timeLeft<=0){timeLeft=0;timedEnd();return}}
    movePlayer(P[0]);movePlayer(P[1]);
    P.forEach(updatePose);
    updateBombs();updateSpawn();updateItems();updatePillars();
    updateFuseBars();
  }
  if(st==='play'||st==='pick')updateFX();
  if((st==='pick')&&previews.length)drawPreviews();
}
function tryThrow(side){
  const p=P[side];if(!p||st!=='play')return;
  if(p.hold)throwBomb(p);
  else floatTxt(p.x,p.y-60,'手上没有炸弹','#cfd8dc');
}
/* ================= 主循环 ================= */
function loop(){try{update()}catch(e){console.warn('[26] update err:',e.message);if(!window.__errCnt)window.__errCnt=0;if(++window.__errCnt>120){st='over';overEnd(-1);window.__errCnt=0}}
  try{drawScene()}catch(e){console.warn('[26] draw err:',e.message)}
  requestAnimationFrame(loop)}

/* ================= 输入 ================= */
const keys={u0:0,d0:0,u1:0,d1:0};
const edge={t0:0,t1:0,i0:0,i1:0,u0:0,u1:0};
let ptrId=[null,null];
function bindInput(){
  document.addEventListener('keydown',e=>{
    audio();
    const c=e.code;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c))e.preventDefault();
    if(c==='KeyW'){keys.u0=1;if(!e.repeat&&!keys.d0)edge.u0=1}
    else if(c==='KeyS')keys.d0=1;
    else if(c==='KeyA'&&!e.repeat)edge.t0=1;
    else if(c==='KeyD'&&!e.repeat)edge.i0=1;
    else if(c==='ArrowUp'){keys.u1=1;if(!e.repeat&&!keys.d1)edge.u1=1}
    else if(c==='ArrowDown')keys.d1=1;
    else if(c==='KeyL'&&!e.repeat)edge.t1=1;
    else if(c==='KeyK'&&!e.repeat)edge.i1=1;
    else if(c==='KeyP'||c==='Escape'){if(st==='play')togglePause()}
  });
  document.addEventListener('keyup',e=>{
    const c=e.code;
    if(c==='KeyW')keys.u0=0;else if(c==='KeyS')keys.d0=0;
    else if(c==='ArrowUp')keys.u1=0;else if(c==='ArrowDown')keys.d1=0;
  });
  /* 触屏/鼠标：半屏上下滑动控制 */
  cv.addEventListener('pointerdown',e=>{
    audio();
    if(st!=='play'||paused)return;
    cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
    let s=e.clientX<W/2?0:1;
    if(P[s]&&P[s].ai)s=0;
    if(ptrId[s]===null){ptrId[s]=e.pointerId;dragTo(s,e.clientY)}
  });
  cv.addEventListener('pointermove',e=>{
    for(const s of[0,1])if(ptrId[s]===e.pointerId)dragTo(s,e.clientY);
  });
  const rel=e=>{for(const s of[0,1])if(ptrId[s]===e.pointerId)ptrId[s]=null};
  cv.addEventListener('pointerup',rel);
  cv.addEventListener('pointercancel',rel);
  $('throwA').addEventListener('pointerdown',e=>{e.preventDefault();tryThrow(0)});
  $('throwB').addEventListener('pointerdown',e=>{e.preventDefault();if(P[1]&&!P[1].ai)tryThrow(1)});
  $('muteBtn').onclick=()=>{sfxOn=!sfxOn;bgmOn=sfxOn;$('muteBtn').textContent=sfxOn?'🔊':'🔇';if(!sfxOn)bgmStop();else if(st==='play')bgmStart()};
  $('pauseBtn').onclick=togglePause;
  $('homeBtn').onclick=goLobby;
  /* 首次交互解锁音频 */
  const unlock=()=>audio();
  document.addEventListener('pointerdown',unlock,{once:true});
  document.addEventListener('keydown',unlock,{once:true});
}
function dragTo(s,y){
  const p=P[s];if(!p)return;
  const rect=cv.getBoundingClientRect();
  const yy=y-rect.top;
  p.manT=10;   /* 手指拖动 = 手动接管，自动接球辅助暂停 */
  p.cyTarget=clampY2(p,yy);
}
function goLobby(){
  try{if(window.parent&&window.parent.goHome){window.parent.goHome();return}}catch(e){}
  location.href='游戏大厅.html';
}
function togglePause(){
  if(st!=='play')return;
  paused=!paused;
  if(paused){bgmStop();showPanel('<h2>⏸ 暂停</h2><p>休息一下～</p>'+
    '<button class="bigbtn" id="go">▶ 继续</button>'+
    '<button class="bigbtn sec" id="re">🔄 重新开局</button>'+
    '<button class="bigbtn tny" id="h1">📖 玩法</button>'+
    '<button class="bigbtn tny" id="t1">🏠 回标题</button>');
    $('go').onclick=()=>{hidePanel();paused=false;if(bgmOn)bgmStart()};
    $('re').onclick=()=>{hidePanel();paused=false;startMatch()};
    $('h1').onclick=()=>helpPanel();
    $('t1').onclick=()=>{hidePanel();paused=false;titlePanel()};
  }else hidePanel();
}
/* ================= 界面 ================= */
function helpPanel(){
  showPanel('<h1>📖 玩法</h1><p><b>目标</b>：接住对方扔来的炸弹并扔回去！引信烧完时炸弹在谁手里/谁半场，谁就被炸掉 1 颗红心。</p>'+
    '<p>🎮 <b>接球是自动的</b>——炸弹飞过来角色会自己站到落点接住，你只要盯住头上冒烟的炸弹，快炸时按“扔”丢回去！</p>'+
    '<p>🎮 P1：A 扔炸弹 · D 道具<br>🎮 P2：L 扔炸弹 · K 道具<br>（想自己挪位置可按住 W/S 或 ↑/↓）</p>'+
    '<p>📱 手机：不用上下滑动！接球自动，只点底部两个大按钮“扔炸弹”即可，点道具图标使用。</p>'+
    '<p class="tip">炸弹种类：黑球普通 · 蓝冰晶冻人 · 黄球分裂 · 礼物盒加分 · 火焰极快 · 绿壳超慢 · 紫弹簧会弹回 · 橙翅膀追踪 · 灰烟球放烟 · 金星双加分</p>'+
    '<button class="bigbtn" id="hb">👍 知道了</button>');
  $('hb').onclick=()=>{hidePanel()};
}
function titlePanel(){
  st='title';hidePanel();$('ctrl').classList.remove('show');$('pauseBtn').style.display='none';
  showPanel('<h1>💣 炸弹传递大作战</h1><p style="margin-top:2px">FC 风格双人对战！接住炸弹赶紧扔回去～</p>'+
    '<button class="bigbtn" id="bPlay">🎮 开始对战</button>'+
    '<button class="bigbtn sec tny" id="bHelp" style="width:70%">📖 玩法说明</button>'+
    '<p class="hint">接球自动完成 · 快炸时按“扔”丢回去 · 支持键盘与手机触屏</p>');
  $('bPlay').onclick=()=>modePanel();
  $('bHelp').onclick=()=>helpPanel();
}
function modePanel(){
  let html='<h1>🎮 选择模式</h1><div class="modeList">';
  MODES.forEach((m,i)=>{
    html+='<div class="modeRow'+(mode===m?' sel':'')+'" data-m="'+i+'">'+
      '<span class="mI">'+m.ic+'</span><div><div class="mT">'+m.n+'</div><div class="mD">'+m.d+'</div></div></div>';
  });
  html+='</div><div id="diffWrap" style="display:none"><h2>AI 难度</h2><div class="diffRow">';
  DIFFS.forEach((d,i)=>{html+='<div class="card'+(diff===d?' sel':'')+'" data-d="'+i+'"><div class="nm">'+d.n+'</div></div>'});
  html+='</div><p class="hint">简单 = 电脑反应慢还会发呆，最适合小朋友</p></div>';
  html+='<button class="bigbtn" id="mNext">下一步：选角色 →</button>'+
        '<button class="bigbtn tny sec" id="mBack">← 返回</button>';
  showPanel(html);
  $$('.modeRow').forEach(el=>el.onclick=()=>{
    mode=MODES[+el.dataset.m];$('diffWrap').style.display=mode.id==='ai'?'block':'none';
    $$('.modeRow').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  });
  $$('[data-d]').forEach(el=>el.onclick=()=>{diff=DIFFS[+el.dataset.d];$$('[data-d]').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')});
  $('mNext').onclick=()=>pickPanel();
  $('mBack').onclick=()=>titlePanel();
}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
let pickSide=0;   // 当前正在选人的玩家
function pickPanel(){
  st='pick';
  if(mode.id==='ai')pickSide=0;      // AI 局只需给玩家1选
  chars=[CHARS[sel0],CHARS[sel1]];
  const p2ai=mode.id==='ai';
  const p2lbl=p2ai?('🤖 电脑 ('+(diff?diff.n:'普通')+')'):'💙 玩家2';
  let html='<h1>👥 选择角色</h1>';
  /* 顶部：两位玩家头像（谁在选谁高亮） */
  html+='<div class="pickHeads">';
  [0,1].forEach(sd=>{
    const ai=p2ai&&sd===1;
    html+='<div class="head'+(pickSide===sd?' act':'')+'" data-h="'+sd+'"'+(ai?' style="opacity:.8"':'')+'>'+
      '<canvas width="44" height="44" data-hi="'+sd+'"></canvas>'+
      '<div><div class="hn">'+(sd===0?'🧡 玩家1':p2lbl)+'</div>'+
      '<div class="hc" data-hc="'+sd+'">'+(ai?'电脑自动选择':chars[sd].n+' 已选')+'</div></div></div>';
  });
  html+='</div>';
  /* 角色卡网格：点卡 = 给高亮的玩家选 */
  html+='<div class="cards">';
  CHARS.forEach((c,i)=>{
    html+='<div class="card'+(i===sel0?' selA':'')+(i===sel1?' selB':'')+'" data-i="'+i+'" title="'+c.tips+'">'+
      '<canvas width="80" height="80"></canvas>'+
      '<div class="nm">'+c.n+'</div><div class="tp">'+c.tips+'</div></div>';
  });
  html+='</div>';
  html+='<p class="hint" style="margin:2px 0 0">👆 上方高亮的玩家在选 · 点他/她的头像可切换</p>';
  html+='<div class="btnRow">'+
    '<button class="bigbtn grn" id="pStart">⚔️ 开始对战！</button>'+
    '<button class="bigbtn sec tny" id="pBack">← 换模式</button></div>';
  showPanel(html);
  /* 预览画布 */
  previews.length=0;
  $$('#ovl .card canvas').forEach(cvx=>{
    previews.push({g:cvx.getContext('2d'),getI:()=>+cvx.parentNode.dataset.i,side:0,type:'card'});
  });
  $$('#ovl .head canvas').forEach(cvx=>{
    const sd=+cvx.parentNode.dataset.h;
    previews.push({g:cvx.getContext('2d'),getI:()=>sd===0?sel0:sel1,side:sd,type:'head'});
  });
  /* 交互 */
  $$('#ovl .head').forEach(h=>h.onclick=()=>{
    const sd=+h.dataset.h;
    if(mode.id==='ai'&&sd===1)return;      // AI 不用选
    pickSide=sd;pickUI();
  });
  $$('#ovl .card').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    if(pickSide===0)sel0=i;else sel1=i;
    chars=[CHARS[sel0],CHARS[sel1]];
    if(mode.id!=='ai')pickSide=1-pickSide;   // 选完自动轮到另一位
    pickUI();
  });
  $('pStart').onclick=()=>startMatch();
  $('pBack').onclick=()=>modePanel();
}
function pickUI(){ /* 刷新选中态与高亮 */
  $$('#ovl .head').forEach(h=>{
    const sd=+h.dataset.h;
    h.classList.toggle('act',pickSide===sd);
    const hc=h.querySelector('[data-hc]');
    if(hc)hc.textContent=(mode.id==='ai'&&sd===1)?'电脑自动选择':(chars[sd]?chars[sd].n+' 已选':'');
  });
  $$('#ovl .card').forEach(c=>{
    const i=+c.dataset.i;
    c.classList.toggle('selA',i===sel0);
    c.classList.toggle('selB',i===sel1);
  });
}
function sel(sd){return sd===0?sel0:sel1}
/* 测试钩子 */
window.__T={
  get st(){return st},
  start:(m,c0,c1,dl)=>{mode=MODES.find(x=>x.id===m)||mode;if(dl)diff=DIFFS.find(x=>x.id===dl)||diff;
    if(c0!==undefined)sel0=CHARS.findIndex(x=>x.id===c0);if(c1!==undefined)sel1=CHARS.findIndex(x=>x.id===c1);
    if(sel0<0)sel0=0;if(sel1<0)sel1=1;chars=[CHARS[sel0],CHARS[sel1]];
    startMatch()},
  bothAI:()=>{P[0].ai=DIFFS[1];P[1].ai=DIFFS[1]},
  humanOnly:()=>{P[0].ai=null;P[1].ai=null},
  players:()=>P, bombs:()=>bombs,
  trow:s=>tryThrow(s),use:(s,i)=>useItem(s,i),hit:s=>{if(P[s])hitPlayer(P[s],{dmg:1},null)},
  kind:k=>{spawnK=k},arena:i=>{arena=ARENAS[i%ARENAS.length];if(arena.id==='palace')cloud={x:LAY.midX,y:LAY.groundY-LAY.charH*1.25,w:LAY.charH*1.7,h:LAY.charH*.5};else cloud=null},
  step:()=>{update();drawScene()},
  state:()=>({st,mode:mode.id,arena:arena.id,p0:P[0]&&{cy:Math.round(P[0].cy),hearts:P[0].hearts,hold:!!P[0].hold,items:P[0].items.slice()},p1:P[1]&&{cy:Math.round(P[1].cy),hearts:P[1].hearts,hold:!!P[1].hold,items:P[1].items.slice()},bombs:bombs.map(b=>({k:b.k,st:b.state,f:+(b.fuse||0).toFixed(2)}))})
};
/* ================= 启动 ================= */
let sel0=0,sel1=1;
function setCloud(){
  cloud=(arena.id==='palace')?{x:LAY.midX,y:LAY.groundY-LAY.charH*1.25,w:LAY.charH*1.7,h:LAY.charH*.5}:null;
}
function init(){
  layout();TOUCH=isTouch();
  chars=[CHARS[sel0],CHARS[sel1]];
  P=[mkP(0),mkP(1)];
  arena=ARENAS[irnd(0,ARENAS.length-1)];
  setCloud();
  bindInput();
  requestAnimationFrame(loop);
  const q=new URLSearchParams(location.search);
  if(q.has('demo')){
    mode=MODES.find(x=>x.id===(q.get('mode')||'classic'))||MODES[0];
    if(q.get('kind'))spawnK=q.get('kind');
    startMatch();
    P[0].ai=DIFFS[1];P[1].ai=DIFFS[1]; /* 双 AI 演示 */
    if(q.get('arena')){arena=ARENAS[clamp(+q.get('arena'),0,5)];setCloud()}
    if(q.get('freeze')){P[1].frozen=400}
    for(let i=0;i<(q.get('skip')||0);i++)update();
  }else titlePanel();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
